<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D4FD6">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jornada">
<title>Findout Jornada</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{
  --primary:#2D4FD6;--primary-d:#213DB0;--primary-dd:#172C85;--lilac:#6E8CF0;--lilac-l:#D6E0FF;
  --navy:#010F2E;--bg:#FFFFFF;--lav:#EAF0FF;--line:#DCE4F5;--line2:#BCC9EA;--white:#FFFFFF;
  --teal:#F7941E;--teal-d:#B85E08;--teal-dd:#7A3D05;--teal-l:#FFEBD2;
  --blue:#4C86E8;--blue-d:#2763CE;--blue-l:#E1EBFC;
  --green:#8FB569;--green-d:#5E8A3B;--green-dd:#2F5A14;--green-l:#EAF3DF;--green-b:#DCEBC9;
  --gold:#FFD36A;--gold-d:#8A6207;--gold-dd:#5A3F03;--gold-s:#C9A23E;--gold-l:#FFF8E1;
  --red:#E0475B;--red-d:#B8313F;--red-dd:#8A1F2B;--red-l:#FBE4E6;--red-b:#F8D7DA;
  --orange:#F08A24;--orange-d:#C8571D;--muted:#5A6170;--ink2:#444D69;--backdrop:#E4EBF9;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;--f-display:'Jost',system-ui,sans-serif;--f-body:'Jost',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
/* Celular e tablet (toque): o app ocupa a tela inteira. No tablet largo, fica numa coluna central. */
@media (min-width:600px) and (pointer:coarse){
  body{background:var(--backdrop);display:flex;justify-content:center}
  #app{max-width:520px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
/* Computador (mouse): moldura de celular no meio da tela */
@media (min-width:520px) and (hover:hover) and (pointer:fine){
  body{background:#0B1230;background-image:radial-gradient(900px 520px at 15% -10%,rgba(45,79,214,.55),transparent 60%),radial-gradient(760px 480px at 100% 110%,rgba(76,195,193,.45),transparent 55%),radial-gradient(500px 300px at 80% 10%,rgba(255,211,106,.18),transparent 60%);display:flex;align-items:center;justify-content:center;padding:24px 16px}
  #app{max-width:430px;height:min(100%,880px);border-radius:40px;border:10px solid #070C22;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 40px 90px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04)}
  .nav{margin-bottom:14px}
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}
input{font:inherit}
#app{height:100%;width:100%;margin:0 auto;background:var(--bg);background-image:radial-gradient(600px 300px at 50% -80px,rgba(45,79,214,.10),transparent 70%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.px{font-family:var(--f-pixel);letter-spacing:.02em}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.pxbtn{box-shadow:4px 4px 0 var(--sh,var(--navy));transition:transform .06s}
.pxbtn:active{transform:translate(4px,4px);box-shadow:none}
@keyframes blink{50%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bounce{animation:bounce 1.3s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .4s ease-out both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:shake .25s 2}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slidedown{to{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
/* Entrada de tela: avançar vem da direita, voltar vem da esquerda, trocar aba só cruza. A barra de navegação fica parada. */
@keyframes in-push{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes in-pop{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@keyframes in-tab{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter-push>.scroll{animation:in-push .26s cubic-bezier(.2,.7,.2,1) both}
.enter-pop>.scroll{animation:in-pop .26s cubic-bezier(.2,.7,.2,1) both}
.enter-tab>.scroll{animation:in-tab .22s ease-out both}
.enter-push>.topbar,.enter-push>.footer,.enter-push>.checkbar,.enter-pop>.topbar,.enter-pop>.footer,.enter-pop>.checkbar,.enter-tab>.topbar,.enter-tab>.footer{animation:fadein .22s ease-out both}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.xpfloat{position:absolute;left:50%;top:40%;font-family:var(--f-pixel);font-size:14px;color:var(--gold-d);text-shadow:2px 2px 0 var(--gold);pointer-events:none;z-index:30;animation:floatup 1s ease-out forwards;white-space:nowrap}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}.heartbreak{animation:heartbreak .55s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--urgb,37,99,235),.6),4px 4px 0 var(--sh,var(--navy))}100%{box-shadow:0 0 0 16px rgba(var(--urgb,37,99,235),0),4px 4px 0 var(--sh,var(--navy))}}.ring{animation:ring 1.6s ease-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}.wiggle{animation:wiggle .6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .9s linear infinite}
@keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes fillin{0%{background-color:#fff;color:var(--ub,var(--primary));transform:scale(1)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes chestopen{0%{transform:scale(.5) rotate(0)}30%{transform:scale(1.05) rotate(-10deg)}45%{transform:scale(1.05) rotate(10deg)}60%{transform:scale(1.05) rotate(-7deg)}78%{transform:scale(1.25) rotate(0)}100%{transform:scale(1)}}
.chest-anim{display:inline-flex;animation:chestopen .9s cubic-bezier(.3,1.4,.5,1) both}
.reveal{animation:pop .45s ease-out both;animation-delay:calc(var(--d,0)*90ms)}
.opt,.chip,.slot,.node{transition:transform .08s,background-color .15s,border-color .15s}
.opt:active,.chip:active{transform:scale(.97)}
.opt.ok,.chip.ok,.slot.ok{animation:okpop .4s ease-out}
.opt.bad,.chip.bad,.slot.bad{animation:shake .25s 2}
.node.justdone{animation:fillin .7s .3s ease-out both}
.node.justdone .crown{animation:pop .4s .9s ease-out both}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.blink,.bounce,.pop,.shake,.heartbreak,.ring,.wiggle,.spin,.reveal,.chest-anim,.opt.ok,.chip.ok,.slot.ok,.opt.bad,.chip.bad,.slot.bad,.node.justdone,.node.justdone .crown,.enter-push>*,.enter-pop>*,.enter-tab>*{animation:none}.xpfloat{display:none}}

.topbar{flex-shrink:0;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;min-height:60px;position:relative;z-index:6}
.topbar h1{margin:0;font-size:18px;font-weight:700;flex:1;font-family:var(--f-display)}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.pad{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.footer{flex-shrink:0;padding:10px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.nav{flex-shrink:0;margin:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(1,15,46,.14),0 2px 6px rgba(1,15,46,.06);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:5px;position:relative;z-index:6}
.nav button{height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;padding:0 2px;font-weight:600;color:var(--muted);transition:background-color .15s,color .15s,transform .1s}
.nav button:active{transform:scale(.95)}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700;background:var(--lav)}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 2px 0 rgba(45,79,214,.25))}
.navbadge{position:absolute;top:6px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}

.btn{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;width:100%;transition:transform .08s}
.btn:not(.pxbtn):active{transform:scale(.98)}
.btn-primary{background:linear-gradient(180deg,#4D6EE6 0%,var(--primary) 60%,#213DB0 100%);color:var(--white)}
.btn-dark{background:linear-gradient(180deg,#1A2650,var(--navy));color:var(--white)}
.btn-gold{background:linear-gradient(180deg,#FFE08F,var(--gold) 60%,#F2C14E);color:var(--navy);--sh:var(--gold-s)}
.btn-outline{height:48px;border:2px solid var(--primary);color:var(--primary);background:var(--white);font-size:14px;font-weight:600}
.btn-ghost{height:44px;color:var(--muted);text-decoration:underline;font-weight:600;font-size:14px}
.btn-off{background:var(--line);color:var(--muted)}
.btn:disabled{opacity:.6}
.chipbtn{height:40px;padding:0 12px;border-radius:10px;border:2px solid var(--primary);background:var(--white);color:var(--primary);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chipbtn:disabled{border-color:transparent;background:var(--line);color:var(--muted)}
input.inp{width:100%;height:50px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(1,15,46,.04)}
input.inp:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(45,79,214,.14)}
label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:5px}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;background:var(--lav)}
.msg.err{background:var(--red-l);color:var(--red-d)}.msg.ok{background:var(--green-l);color:var(--green-dd)}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line2)}

.card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(1,15,46,.05)}
button.card:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row+.row{border-top:1px solid var(--lav)}
.tile{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t15{font-weight:700;font-size:15px}
.sub{font-size:13px;color:var(--muted);line-height:1.4}
.h2{margin:0;font-size:15px;font-weight:700;font-family:var(--f-display)}
.bar{height:10px;background:var(--lav);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--primary)}

.jhead{justify-content:space-between}
.subjbtn{height:40px;border:1.5px solid var(--primary);border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:600;font-size:13px;min-width:0;overflow:hidden;white-space:nowrap}
.subjbtn span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.subjbtn svg{flex-shrink:0}
/* o Mapa do ENEM é a tela mais autoral do app e morava a três toques, dentro do Perfil */
.mapbtn{width:40px;height:40px;flex-shrink:0;border:1.5px solid var(--primary);border-radius:10px;color:var(--primary);background:var(--white);display:flex;align-items:center;justify-content:center}
.subjbtn span{overflow:hidden;text-overflow:ellipsis}
.stat{height:36px;padding:0 9px 0 6px;border-radius:12px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:14px}
.stat+.stat{margin-left:4px}

.trail{padding:12px 0 110px;display:flex;flex-direction:column;gap:10px;position:relative}
.trail::before{content:"";position:absolute;left:50%;top:0;bottom:60px;width:0;border-left:3px dashed var(--line2);transform:translateX(-50%);z-index:0}
.trail>*{position:relative;z-index:1}
.unit{margin:4px 20px 6px;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:12px;border:2px solid var(--ub,var(--primary));background:linear-gradient(135deg,var(--ua,#4D6EE6) 0%,var(--ub,var(--primary)) 55%,var(--uc,#213DB0) 100%);color:var(--white);box-shadow:0 10px 24px rgba(var(--urgb,37,99,235),.28);overflow:hidden}
.trail .nodewrap+.unit,.trail .pop-card+.unit{margin-top:26px}
.unit::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.unit.locked{background:var(--white);color:var(--muted);border-color:var(--line);box-shadow:none}
.unit.locked::after{display:none}
.unit .guide{width:44px;height:44px;border-radius:10px;border:2px solid var(--lilac);display:flex;align-items:center;justify-content:center;color:inherit}
.unit.locked .guide{border-color:var(--line)}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.nodeinner{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:72px;height:72px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.node:hover{transform:translateY(-2px)}
.crown{position:absolute;right:-8px;bottom:-6px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--gold);border:2px solid var(--gold-d);color:var(--gold-dd);font-size:9px;display:flex;align-items:center;justify-content:center;gap:2px}
.startlbl{background:var(--white);border:2px solid var(--primary);border-radius:8px;padding:7px 9px;font-size:9px;color:var(--primary)}
.mascot-side{position:absolute;left:100%;top:50%;transform:translate(14px,-50%);width:92px!important;pointer-events:none}
.mascot-side.left{left:auto;right:100%;transform:translate(-14px,-50%)}
.pop-card{margin:2px 20px 6px;position:relative}
.pop-card .caret{position:absolute;top:-8px;width:14px;height:14px;border-left:2px solid;border-top:2px solid;transform:translateX(-7px) rotate(45deg)}
.pop-card .box{border:2px solid;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--white);border:2px solid var(--primary);color:var(--primary);display:flex;align-items:center;justify-content:center;--sh:var(--primary);z-index:5}

.lhead{gap:10px}
.lprog{height:12px;background:var(--lav);border-radius:999px;overflow:hidden}
.lprog>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--primary));transition:width .35s}
.tag{font-size:9px;border-radius:999px;padding:6px 10px;background:var(--lav);color:var(--primary)}
.combo{display:flex;align-items:center;gap:5px;background:var(--teal);color:var(--navy);border-radius:999px;padding:6px 10px;font-size:9px}
.q{margin:0;font-size:21px;font-weight:700;line-height:1.3;text-wrap:balance;font-family:var(--f-display);letter-spacing:-.01em}
.card.stmt{border-radius:18px;box-shadow:0 8px 24px rgba(45,79,214,.10)}
.slot{border-radius:10px}
.qimg{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line)}
.opt{min-height:56px;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--white);border:2px solid var(--line);border-bottom-width:4px;width:100%}
.opt.sel{box-shadow:0 0 0 4px rgba(45,79,214,.12)}
.opt .letter{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:14px;border:1.5px solid var(--primary)}
.opt .txt{font-size:17px;font-family:var(--f-display);font-weight:500;flex:1}
.opt.sel{border-color:var(--primary);background:var(--lav)}
.opt.sel .letter{background:var(--primary);color:var(--white)}
.opt.ok{border-color:var(--green-d);background:var(--green-l)}
.opt.bad{border-color:var(--red-d);background:var(--red-l)}
.chip{min-height:44px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--white);font-family:var(--f-display);font-weight:600;font-size:16px}
.chip.used{background:var(--lav);color:transparent;border-color:var(--lav)}
.chip.sel{border-color:var(--primary);background:var(--lav)}
.chip.ok{border-color:var(--green-d);background:var(--green-l)}
.chip.bad{border-color:var(--red-d);background:var(--red-l)}
.chip.gone{background:var(--lav);color:var(--line2);border-color:var(--line2)}
.slot{min-width:110px;min-height:36px;padding:2px 10px;border-radius:8px;border:2px solid var(--line2);border-bottom-width:3px;background:var(--lav);font-family:var(--f-display);font-weight:600;font-size:16px;vertical-align:middle}
.slot.filled{background:var(--white);border-color:var(--primary)}
.slot.ok{border-color:var(--green-d);background:var(--green-l)}
.slot.bad{border-color:var(--red-d);background:var(--red-l)}
.bankline{margin:0;font-size:17px;line-height:2.1;font-family:var(--f-display)}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:10px;border-top:2px solid var(--line)}
.orderbox{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border:2px dashed var(--line2);border-radius:12px}
.matchgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.matchgrid .col{display:flex;flex-direction:column;gap:10px}
.matchgrid .chip{min-height:56px;font-size:15px;line-height:1.2;width:100%}
.stmt{padding:22px 18px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.3}
.tfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tfgrid .chip{height:60px;font-weight:700;font-size:17px}
.checkbar{flex-shrink:0;padding:12px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:10px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.checkbar .btn{border-radius:14px}
.banner{flex-shrink:0;padding:16px 20px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(1,15,46,.12);animation:slideup .2s ease-out}
.banner.ok{background:var(--green-b);color:var(--green-dd)}
.banner.bad{background:var(--red-b);color:var(--red-dd)}
.banner .ic{width:40px;height:40px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.sheet-bg{position:absolute;inset:0;background:rgba(1,15,46,.55);z-index:20}
.sheet-bg{animation:fadein .2s ease-out}
.sheet-bg.out{animation:fadeout .2s ease-in forwards}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:28px 28px 0 0;padding:14px 20px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -4px 0 var(--primary),0 -20px 50px rgba(1,15,46,.25);z-index:21;animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:slidedown .2s ease-in forwards}
.coins-big{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:34px;color:var(--gold-d)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);align-self:center}
.overlay{position:absolute;inset:0;background:rgba(244,244,254,.85);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600;color:var(--primary)}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--lav);border-top-color:var(--primary)}

.fullpurple{background:var(--primary);background-image:radial-gradient(520px 320px at 50% 0%,rgba(240,138,36,.25),transparent 70%),linear-gradient(180deg,#4D6EE6 0%,var(--primary) 45%,#172C85 100%);color:var(--white)}
.statbox{border:2px solid;border-radius:18px;background:var(--white);color:var(--navy);overflow:hidden;display:flex;flex-direction:column;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.unitprog{display:flex;align-items:center;gap:8px;margin-top:6px}
.unitprog .bar{flex:1;height:6px;background:rgba(255,255,255,.25)}
.unitprog .bar>i{background:var(--gold)}
.unit.locked .unitprog .bar{background:var(--lav)}
.unit.locked .unitprog .bar>i{background:var(--line2)}
.unitprog span{font-size:11px;font-family:var(--f-display);font-weight:600;white-space:nowrap}
.statbox .lbl{font-size:9px;padding:7px 4px}
.statbox .val{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 4px;font-family:var(--f-display);font-weight:700;font-size:22px}

@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px) scale(.98)}}
.toast{position:absolute;left:16px;right:16px;top:calc(72px + env(safe-area-inset-top,0px));background:rgba(1,15,46,.94);backdrop-filter:blur(8px);color:var(--white);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;z-index:40;box-shadow:4px 4px 0 var(--teal),0 10px 30px rgba(0,0,0,.25);animation:toastin .25s ease-out}
.toast.out{animation:toastout .2s ease-in forwards}
.opt,.chip{box-shadow:0 1px 2px rgba(1,15,46,.04)}
.subjbtn,.mapbtn{background:var(--white);box-shadow:0 2px 8px rgba(45,79,214,.12)}
.fab{box-shadow:4px 4px 0 var(--primary),0 10px 24px rgba(45,79,214,.25)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal span{height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:13px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--white);border-left:4px solid transparent}
.lrow.me{background:var(--lav);border-left-color:var(--primary);font-weight:700}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.avbtn{position:relative;flex-shrink:0;border-radius:50%}.avbtn .avedit{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--white)}
.avcats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;flex-shrink:0}.avcats::-webkit-scrollbar{display:none}
.avcats button{flex-shrink:0;height:34px;padding:0 12px;border-radius:17px;border:2px solid var(--line);background:var(--white);font-size:13px;font-weight:600;color:var(--ink2)}
.avcats button[aria-selected="true"]{border-color:var(--primary);background:var(--lav);color:var(--primary)}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow-y:auto;min-height:0;flex:1;padding:2px;align-content:start}
.avgrid.cores{grid-template-columns:repeat(5,1fr)}
.avopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:14px;border:2px solid var(--line);background:var(--white);font-size:11px;font-weight:600;color:var(--ink2);line-height:1.1;text-align:center}
.avopt[aria-pressed="true"]{border-color:var(--primary);background:var(--lav);color:var(--primary)}
.avopt.swatch{aspect-ratio:1;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 0 2px var(--line);padding:0}
.avopt.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--primary)}
/* Duelo: a roleta das áreas. transform-box faz o transform-origin cair no centro do viewBox;
   sem ele o navegador gira em volta da caixa do grupo, que muda conforme as fatias. */
.roleta{display:block;width:100%;max-width:236px;margin:0 auto}
.roleta .giro{transform-box:view-box;transform-origin:110px 110px;transition:transform 2.6s cubic-bezier(.17,.72,.14,1)}
@media (prefers-reduced-motion:reduce){.roleta .giro{transition:none}}
.duelista{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:13px;border:2px solid transparent}
.duelista.vez{border-color:var(--primary);background:var(--lav)}
.duelista .nm{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinos{display:flex;align-items:center;gap:5px}
.pino{width:13px;height:13px;border-radius:50%;background:var(--line2)}
.pino.ok{background:var(--green)}
.pino.err{background:var(--red)}
.pino.vazio{background:transparent;border:2px dashed var(--line2)}

/* Mapa do ENEM */
.mapa{display:block;width:100%;height:auto;background:#2E6BB0}
.mapa .ilha{cursor:pointer;animation:pop .5s ease-out var(--d) both,flutua 4.5s ease-in-out calc(var(--d) + .5s) infinite}
.mapa .ilha:focus-visible{outline:3px solid #FFD36A;outline-offset:2px}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mapa .castelo{animation:flutua 5s ease-in-out .3s infinite}
.mapa .nuvem{animation:nuvem var(--t,50s) linear var(--d,0s) infinite}
@keyframes nuvem{from{transform:translateX(-120px)}to{transform:translateX(var(--mw,420px))}}
.mapa .onda{animation:onda 3.2s ease-in-out var(--d,0s) infinite}
@keyframes onda{0%,100%{opacity:.2;transform:translateX(0)}50%{opacity:.8;transform:translateX(8px)}}
.mapa .rota{stroke-dasharray:7 8;animation:rota 1.4s linear infinite}
@keyframes rota{to{stroke-dashoffset:-30}}
/* dois grupos: o de fora leva o barco de uma ilha a outra, o de dentro faz o balanço.
   Um transform só não comporta os dois — o balanço sobrescreveria o deslocamento.
   Quem move o de fora é o navegarBarco(), quadro a quadro, para o barco seguir a rota. */
.mapa .barco{animation:balanca 3s ease-in-out infinite;transform-origin:0 0}
@keyframes balanca{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-3px)}}
.mapa .bandeira{animation:tremula .9s ease-in-out infinite alternate}
@keyframes tremula{from{transform:skewY(-7deg)}to{transform:skewY(7deg)}}
.mapa .halo{opacity:.6;animation:halo 1.5s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.6}to{transform:scale(2.4);opacity:0}}
.mapa .chama,.mapa .brasa{transform-box:fill-box;transform-origin:center}
.mapa .chama{animation:chama .25s ease-in-out infinite alternate}
@keyframes chama{from{transform:scaleY(.7)}to{transform:scaleY(1.3)}}
.mapa .brasa{animation:brasa 1.1s ease-in-out var(--d,0s) infinite alternate}
@keyframes brasa{from{opacity:.3;transform:translateY(0)}to{opacity:1;transform:translateY(-7px)}}
.mapatopo{padding:8px 14px 8px;display:flex;align-items:center;gap:10px;color:#fff;background:#2E6BB0;flex-shrink:0}
.mapatopo .avatar{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.mapalegenda{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:center;padding:5px 10px calc(7px + env(safe-area-inset-bottom,0px));font-size:10px;color:rgba(255,255,255,.85);background:#1B4F8F;flex-shrink:0}
.mapalegenda span{display:inline-flex;align-items:center;gap:5px}
.mapalegenda i{display:inline-block}
.lg-ilha{width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid #F08A24}
.lg-flag{width:0;height:0;border-left:9px solid #FFD36A;border-top:5px solid transparent;border-bottom:5px solid transparent}
.lg-rota{width:22px;border-top:2px dashed rgba(255,255,255,.8)}
.mapa .luz{animation:luz 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes luz{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}
.mapa .baleia{animation:flutua 5s ease-in-out 1s infinite;transform-box:fill-box;transform-origin:center}
.mapa .jato{animation:jato 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

.mapa .aura{animation:aura 6s linear infinite}
@keyframes aura{to{stroke-dashoffset:-48}}
.mapa .estrela{animation:estrela 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.mapa .estrela:nth-child(2n){animation-delay:.9s}.mapa .estrela:nth-child(3n){animation-delay:1.7s}
@keyframes estrela{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.3)}}
@keyframes jato{0%,60%,100%{opacity:0;transform:scaleY(.2)}20%,40%{opacity:1;transform:scaleY(1)}}
/* sol girando, peixes pulando, palmeiras balançando, asas dos pássaros, fumaça do castelo, brilhos das ilhas, esteira do barco, pino da ilha atual */
.mapa .sol{animation:gira 26s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes gira{to{transform:rotate(360deg)}}
.mapa .peixe{opacity:0;animation:peixe 7s ease-in-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
@keyframes peixe{0%,54%,100%{opacity:0;transform:translateY(8px) rotate(0)}60%{opacity:1}68%{transform:translateY(-12px) rotate(-16deg)}76%{opacity:1}84%{opacity:0;transform:translateY(8px) rotate(-30deg)}}
.mapa .palmeira{animation:palmeira 4.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes palmeira{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.mapa .asa{animation:asa 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes asa{from{transform:scaleY(1)}to{transform:scaleY(.4)}}
.mapa .fumaca{opacity:0;animation:fumaca 4s ease-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
@keyframes fumaca{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:.75}100%{opacity:0;transform:translateY(-24px) scale(1.6)}}
.mapa .brilho{opacity:0;animation:brilho 2.4s ease-in-out var(--d,0s) infinite;transform-box:fill-box;transform-origin:center}
@keyframes brilho{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(30deg)}}
.mapa .esteira{stroke-dasharray:3 7;animation:rota 1.6s linear infinite reverse}
.mapa .pula{animation:pula 1.6s ease-in-out infinite}
@keyframes pula{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mapa .foco{animation:foco 1.8s ease-in-out infinite}
@keyframes foco{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.mapalegenda .lg-num{width:13px;height:13px;border-radius:50%;background:#F08A24;color:#fff;font-weight:700;font-size:8px;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
@media (min-width:520px){.mapalegenda{font-size:12px;gap:3px 16px;padding-top:7px}.mapatopo{padding:10px 18px}}
.mapacard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#2E6BB0,#1B4F8F);color:#fff;text-align:left;width:100%;box-shadow:0 6px 18px rgba(27,79,143,.35)}
.mapacard .mini{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media (prefers-reduced-motion:reduce){.mapa .ilha,.mapa .castelo,.mapa .nuvem,.mapa .onda,.mapa .rota,.mapa .barco,.mapa .bandeira,.mapa .halo,.mapa .chama,.mapa .brasa,.mapa .luz,.mapa .baleia,.mapa .jato,.mapa .aura,.mapa .estrela,.mapa .sol,.mapa .peixe,.mapa .palmeira,.mapa .asa,.mapa .fumaca,.mapa .brilho,.mapa .esteira,.mapa .pula,.mapa .foco{animation:none}.mapa .halo,.mapa .peixe,.mapa .fumaca,.mapa .brilho{display:none}}
.zone{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:9px}
.zone::before,.zone::after{content:"";flex:1;height:2px;background:currentColor}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;background-image:radial-gradient(420px 260px at 50% -40px,rgba(45,79,214,.35),transparent 70%)}
.auth h1{font-family:var(--f-display);font-size:clamp(24px,6.5vw,28px);margin:0;line-height:1.2}
/* Login: só a Rapozinha, sem disco atrás (uma sombra suave no chão para ela não ficar solta) */
.hero-mascot{display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 14px 18px rgba(45,79,214,.22))}
.hero-mascot .mascot-pensa{width:132px!important}
/* Mascote solta nas telas de fundo azul: sem disco atrás; um brilho branco suave em volta separa a Rapozinha (azul) do fundo */
.mascot-livre{display:flex;justify-content:center;filter:drop-shadow(0 0 16px rgba(255,255,255,.6)) drop-shadow(0 10px 14px rgba(0,0,0,.25))}
/* Rapozinha em sprite (pensando, feliz3): quadros lado a lado; duração e número de quadros vêm do inline style gerado por mascot() */
.mascot-pensa{display:block;position:relative;overflow:hidden;flex-shrink:0}
.mascot-pensa img{position:absolute;left:0;top:0;height:100%;width:auto;max-width:none;animation:masc-pensa 2.4s steps(20) infinite}
@keyframes masc-pensa{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion: reduce){.mascot-pensa img{animation:none}}
/* Rapozinha em dúvida (escolha da primeira disciplina) */
.duvida-wrap{position:relative;display:inline-flex}
.duvida{position:absolute;top:-4px;right:-16px;width:36px;height:36px;border-radius:50% 50% 50% 6px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid #fff;box-shadow:0 3px 10px rgba(45,79,214,.35);animation:duvida-bob 1.6s ease-in-out infinite}
@keyframes duvida-bob{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-6px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.duvida{animation:none}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pill-dom{font-size:7px;padding:6px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;align-self:center}
.stats3 .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;height:auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px}
.stats3 .stat small{font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:500}

/* =====================================================================
   Vida: cor, luz, movimento e resposta ao toque (22 out)
   Tudo aqui só reforça o que já existe: fundo branco com brilhos azul e laranja,
   botões com brilho e varredura de luz, menu ativo em pílula, barras com reflexo,
   hovers no desktop, entrada escalonada dos cartões e ajustes por tamanho de tela.
   ===================================================================== */
:root{--grad-primary:linear-gradient(180deg,#5B7CFF 0%,#2D4FD6 55%,#213DB0 100%);--grad-orange:linear-gradient(135deg,#FFB347,#F7941E 60%,#E8780A);--sombra-azul:0 10px 24px rgba(45,79,214,.22)}
::selection{background:var(--lilac-l);color:var(--navy)}
.scroll{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
/* Papel de parede estilo WhatsApp, minimalista: 6 ícones pequenos por mosaico de 360 px, gerados em fundoCss() conforme a matéria escolhida (login e carregamento usam o conjunto geral) */
#app{background-image:radial-gradient(640px 320px at 50% -110px,rgba(45,79,214,.16),transparent 70%),radial-gradient(520px 380px at 108% 104%,rgba(247,148,30,.13),transparent 65%),var(--fundo,none);background-repeat:no-repeat,no-repeat,repeat;background-size:auto,auto,360px 360px}
.auth{background-image:radial-gradient(460px 280px at 50% -60px,rgba(45,79,214,.30),transparent 70%),radial-gradient(380px 300px at 100% 100%,rgba(247,148,30,.16),transparent 65%)}
/* transições gerais: tudo que se toca responde */
.btn,.chipbtn,.card,.row,.tile,.stat,.unit,.node,.nav button,.iconbtn,.opt,.chip,.subjbtn,.mapacard,.fab,.avopt,.avcats button,.lrow,.startlbl,.crown,.avbtn{transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background-color .18s,border-color .18s,color .18s,filter .18s,opacity .18s}
.opt,.chip,.slot,.node{transition-duration:.16s}
/* botões: gradiente mais vivo, brilho em cima e varredura de luz no hover */
.btn-primary{background:var(--grad-primary);position:relative;overflow:hidden;isolation:isolate}
.btn-primary:not(.pxbtn){box-shadow:var(--sombra-azul),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-primary.pxbtn{box-shadow:4px 4px 0 var(--sh,var(--navy)),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none;z-index:-1}
.btn-gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.btn-dark{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.btn-outline{box-shadow:0 2px 10px rgba(45,79,214,.08)}
.btn:disabled{filter:saturate(.6)}
.chipbtn:active,.iconbtn:active,.stat:active,.avopt:active{transform:scale(.94)}
.chipbtn:not(:disabled){box-shadow:0 2px 8px rgba(45,79,214,.10)}
/* menu: aba ativa em pílula azul com ícone branco; o ícone dá um pulo ao entrar */
.nav button[aria-current="page"]{color:#fff;background:var(--grad-primary);box-shadow:0 6px 16px rgba(45,79,214,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.nav button[aria-current="page"] svg{filter:none;animation:navpop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes navpop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.navbadge{animation:badgepulse 2s ease-in-out infinite}
@keyframes badgepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
/* cartões e linhas: sombra azulada; os clicáveis sobem no hover */
.card{box-shadow:0 4px 16px rgba(45,79,214,.07),0 1px 2px rgba(1,15,46,.04)}
.card.stmt{box-shadow:0 10px 28px rgba(45,79,214,.14)}
.stat{background:linear-gradient(180deg,#fff,#F5F7FF);box-shadow:0 2px 8px rgba(45,79,214,.08)}
.stat svg{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.tag{background:var(--lav);color:var(--primary-d);box-shadow:inset 0 0 0 1px rgba(45,79,214,.12)}
.combo{background:var(--grad-orange);color:var(--navy);box-shadow:0 3px 10px rgba(247,148,30,.35)}
.topbar{box-shadow:0 1px 0 rgba(45,79,214,.05),0 6px 18px rgba(45,79,214,.05)}
.footer,.checkbar{box-shadow:0 -6px 18px rgba(45,79,214,.05)}
.mapacard{box-shadow:0 8px 22px rgba(27,79,143,.38),inset 0 1px 0 rgba(255,255,255,.18)}
.fab{box-shadow:4px 4px 0 var(--primary),0 12px 26px rgba(45,79,214,.28)}
/* FAB com rótulo: só aparece quando há lição para retomar, então precisa dizer o que é */
.fab-ext{width:auto;height:50px;border-radius:25px;padding:0 18px;gap:9px;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap;background:var(--primary);border-color:var(--navy);color:var(--white);--sh:var(--navy);box-shadow:4px 4px 0 var(--navy),0 12px 26px rgba(1,15,46,.3)}
.startlbl{box-shadow:0 4px 12px rgba(45,79,214,.18)}
.sheet{box-shadow:0 -4px 0 var(--teal),0 -20px 50px rgba(1,15,46,.25)}
/* barras de progresso: andam com suavidade e têm um reflexo que passa de vez em quando */
.bar>i,.lprog>i{position:relative;overflow:hidden;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar>i::after,.lprog>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.45) 50%,transparent 100%);transform:translateX(-100%);animation:shimmer 2.8s ease-in-out 1s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
/* unidades da trilha: brilho que varre o cartão da unidade atual */

.unit:not(.locked)::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-130%);animation:shimmer 6s ease-in-out 2s infinite;pointer-events:none}
.pop-card{animation:in-tab .26s cubic-bezier(.2,.7,.2,1) both}
/* entrada de tela: os blocos do conteúdo chegam um a um, de cima para baixo */
.enter-push .pad>:not(.reveal),.enter-pop .pad>:not(.reveal),.enter-tab .pad>:not(.reveal){animation:in-tab .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.pad>:nth-child(2){--i:1}.pad>:nth-child(3){--i:2}.pad>:nth-child(4){--i:3}.pad>:nth-child(5){--i:4}.pad>:nth-child(6){--i:5}.pad>:nth-child(7){--i:6}.pad>:nth-child(8){--i:7}.pad>:nth-child(n+9){--i:8}
/* hover só onde existe mouse: subir, iluminar, escurecer de leve */
@media (hover:hover) and (pointer:fine){

  .btn-primary:hover::after{transition:transform .55s ease-out;transform:translateX(130%)}
  .btn-outline:hover,.chipbtn:not(:disabled):hover{background:var(--lav)}
  .btn-ghost:hover{color:var(--primary)}
  button.card:hover,.card.row:where(button):hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(45,79,214,.14),0 2px 4px rgba(1,15,46,.05)}
  button.row:hover,.lrow:where(button):hover{background:var(--lav)}
  button:hover>.tile,.row:hover>.tile{transform:scale(1.08) rotate(-4deg)}
  .nav button:not([aria-current="page"]):hover{color:var(--primary);background:var(--lav)}
  .iconbtn:hover{background:var(--lav);color:var(--primary)}
  .stat:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(45,79,214,.16)}
  .stat:hover svg{transform:scale(1.2) rotate(-8deg)}
  .subjbtn:hover{box-shadow:0 6px 16px rgba(45,79,214,.22);transform:translateY(-1px)}
  .unit:not(.locked):hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(var(--urgb,45,79,214),.40),inset 0 1px 0 rgba(255,255,255,.22)}
  .unit .guide:hover{background:rgba(255,255,255,.18)}
  .node:not(:disabled):hover{transform:translateY(-3px) scale(1.06)}
  .opt:not(.sel):not(.ok):not(.bad):hover,.chip:not(.sel):not(.ok):not(.bad):not(.used):not(.gone):hover{border-color:var(--lilac);background:#F6F8FF;transform:translateY(-1px)}
  .mapacard:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .fab:hover{transform:translateY(-2px)}
  .avopt:hover,.avcats button:hover{border-color:var(--lilac);background:#F6F8FF}

button[data-a^="tier:"][aria-pressed="true"]{filter:drop-shadow(0 8px 12px rgba(1,15,46,.22));animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
@media (hover:hover) and (pointer:fine){button[data-a^="tier:"]:not([aria-pressed="true"]):hover{transform:translateY(-3px) scale(1.08)}}

.tour-arte{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:170px;animation:pop .4s cubic-bezier(.3,1.4,.5,1) both}
.tour-ic{width:120px;height:120px;border-radius:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(45,79,214,.18)}
.tour-ic svg{width:60px;height:60px}
.tour-arte .tour-masc{position:absolute!important;right:-62px;bottom:-6px}
.tour-dots{display:flex;gap:7px;justify-content:center;padding-top:6px}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:width .25s,background-color .25s}
.tour-dots i.ok{background:var(--lilac)}
.tour-dots i.on{width:22px;border-radius:4px;background:var(--primary)}

.chama-viva svg{transform-origin:50% 95%;animation:chama-corpo 1.1s ease-in-out infinite alternate}
.chama-viva svg path:last-child{transform-origin:50% 85%;animation:chama-miolo .7s ease-in-out infinite alternate}

@keyframes chama-miolo{from{transform:scale(.85) translateY(1px);opacity:.75}to{transform:scale(1.1) translateY(-1px);opacity:1}}
@media (prefers-reduced-motion:reduce){.chama-viva svg,.chama-viva svg path:last-child{animation:none}}

.sheet{max-height:92%;overflow-y:auto;overscroll-behavior:contain}
.banner{max-height:72%;overflow-y:auto}

.mascot-pensa.mascot-side{position:absolute}

      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="grow"><span class="px" style="font-size:9px;opacity:.85">SEÇÃO ${si + 1}</span><span style="font-family:var(--f-display);font-weight:700;font-size:18px">${esc(sec.titulo)}</span></div>

          ${locked ? `<span style="width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center">${I.lock(18)}</span>` : ''}</div>
        <div class="bar" style="background:${locked ? 'var(--lav)' : 'var(--primary-d)'}"><i style="width:${pct}%;background:${isDone ? 'var(--gold)' : 'var(--teal)'}"></i></div>
        <span class="num" style="font-size:12px;opacity:.85">${us.length} unidades · ${doneN} concluídas${sec.unidades.length > us.length ? ` · ${sec.unidades.length - us.length} em preparação` : ''}</span>

          <span style="flex:1;font-size:14px;font-weight:${k === 'cur' ? 700 : 500};color:${k === 'locked' ? 'var(--muted)' : 'var(--navy)'}">${esc(u.uni.titulo)}</span>

const MODO_SERVIDOR = {lesson: 'licao', legend: 'lendaria', jump: 'pular', review: 'revisao', errors: 'erros', unitreview: 'unidade', secreview: 'unidade', flash: 'relampago'};
/* ---------- lição guardada ----------
   L vivia só em memória: fechar o app na questão 4 de 5 perdia tudo, e no PWA instalado o

/* ---------- duelo entre colegas (migration 0054) ----------
   Dois alunos da mesma turma, em turnos. Na sua vez o jogador gira a roleta; quem sorteia a
   área e a questão é o SERVIDOR, e aqui a roleta só anima até a fatia que voltou. Ele responde
   primeiro e só então o adversário recebe A MESMA questão.

   A questão chega na leitura de estado SEGUINTE ao giro, porque é essa leitura que começa o
   relógio no servidor: é por isso que atualizarDuelo() não roda enquanto a roleta gira — senão
   o aluno gastaria o tempo dele olhando a roleta girar.

   Nada do que o primeiro respondeu sai antes de o segundo responder. É o que faz o placar medir
   quem sabe mais, e não quem calhou de pegar a pergunta mais fácil. */

// não tem contraste em fundo branco — o laranja de Linguagens fica em 2,4:1.

  : '<span class="av" style="width:' + t + 'px;height:' + t + 'px;font-size:' + Math.round(t / 3) + 'px;background:' + (cor || 'var(--orange)') + ';color:#fff">' + esc(iniciais(nome)) + '</span>';

async function carregarDuelos() {

  render(false); SND.tap(); vib(12);

// A roleta. O ponteiro fica no topo e a fatia 0 nasce centrada nele, então levar a fatia k até
// o ponteiro é girar -k*passo. O texto gira +90° junto da fatia: quando ela para no ponteiro,
// a soma dá zero e o nome da área sorteada aparece na horizontal.
function roletaFatia(a, i, quantas) {
  const passo = 360 / quantas, R = 96, cx = 110, cy = 110;
  const pt = (ang, r) => [cx + r * Math.cos(ang * Math.PI / 180), cy + r * Math.sin(ang * Math.PI / 180)];
  const c = i * passo - 90;
  const p0 = pt(c - passo / 2, R), p1 = pt(c + passo / 2, R), tp = pt(c, R * .66);
  const corpo = quantas === 1
    ? '<circle cx="110" cy="110" r="96" fill="' + corArea(a.id) + '"/>'
    : '<path d="M110 110 L' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A96 96 0 ' + (passo > 180 ? 1 : 0) + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + 'Z" fill="' + corArea(a.id) + '" stroke="rgba(255,255,255,.8)" stroke-width="2"/>';
  const x = tp[0].toFixed(1), y = tp[1].toFixed(1);
  return corpo + '<text x="' + x + '" y="' + y + '" transform="rotate(' + (c + 90).toFixed(1) + ' ' + x + ' ' + y + ')" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#fff" style="font-family:var(--f-display);paint-order:stroke;stroke:rgba(1,15,46,.5);stroke-width:3">' + esc(a.nome) + '</text>';
}
function roleta(areas, deg, parada) {
  const quantas = Math.max(1, areas.length);
  const fatias = areas.map((a, i) => roletaFatia(a, i, quantas)).join('');
  return `<svg class="roleta" viewBox="0 0 220 220" role="img" aria-label="${parada ? 'A roleta parou em ' + esc(parada) : 'Roleta das áreas do ENEM'}">
    <circle cx="110" cy="110" r="103" fill="var(--navy)" opacity=".12"/>
    <g class="giro" data-key="giro" style="transform:rotate(${deg.toFixed(2)}deg)">${fatias}</g>
    <circle cx="110" cy="110" r="16" fill="#fff" stroke="var(--navy)" stroke-width="2.5"/>
    <text x="110" y="110.5" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#C9A23E">★</text>
    <path d="M0 0 L-11 -15 L11 -15Z" transform="translate(110 22)" fill="var(--red)" stroke="#fff" stroke-width="2.5"/>
  </svg>`;

app.addEventListener('change', ev => { const el = ev.target; if (el.tagName === 'SELECT' && (el.dataset.a === 'rank-turma' || el.dataset.a === 'du-turma')) act(el.dataset.a + ':' + el.value).catch(e => console.error(e)); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && V.sheet) { ev.preventDefault(); fecharSheet(); } });
app.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled || !S) {
    // clique fora do balão da trilha fecha o balão
    if (S && V.open && V.screen === 'jornada' && !ev.target.closest('.pop-card')) { V.open = null; render(); }
    return;
  }
  act(el.dataset.a).catch(e => { console.error(e); toast('Algo deu errado. Tente de novo.'); });
});
app.addEventListener('submit', async ev => {
  if (ev.target.id !== 'f-nome') return;
  ev.preventDefault();
  const nome = document.getElementById('nome-inp').value.trim(); if (!nome) return;
  const {error} = await sb.from('perfis').update({nome}).eq('user_id', sessao.user.id);
  if (error) return toast(traduz(error.message));
  S.perfil.nome = nome; V.editNome = false; toast('Nome atualizado.');
});

/* ---------- relógios ---------- */
let ultimoDia = dkey();
setInterval(() => {
  if (!S) return;
  if (L && L.mode === 'flash') {
    const t = document.getElementById('flash-t');
    if (Date.now() >= L.deadline && L.result === null && !V.salvando && (!L.tentouFim || Date.now() - L.tentouFim > 10000)) { L.tentouFim = Date.now(); finish(true); return; }   // falhou ao salvar: tenta de novo a cada 10 s, não a cada segundo
    if (t) t.lastChild.textContent = mmss(L.deadline - Date.now());
  }
  if (V.screen === 'dinamica' && DIN && DIN.data && DIN.data.status === 'pergunta') {
    const dt = document.getElementById('din-t'), r = dinResta();
    if (dt && r !== null) dt.textContent = String(Math.max(0, Math.ceil(r / 1000)));
    if (r !== null && r <= 0 && !DIN.enviado && !DIN.travou) { DIN.travou = true; render(false); }
  }
  if (V.screen === 'duelo' && DUE && DUE.data) {
    const dt = document.getElementById('due-t'), r = dueResta();
    if (dt && r !== null) dt.textContent = String(Math.max(0, Math.ceil(r / 1000)));
    if (r !== null && r <= 0 && !DUE.travou) { DUE.travou = true; render(false); }   // trava a questão na hora
  }
  const ht = document.getElementById('heart-t'); if (ht) ht.textContent = 'PRÓXIMO CORAÇÃO EM ' + hms(nextHeartMs());
  const mt = document.getElementById('mid-t'); if (mt) mt.textContent = 'renovam em ' + hms(renovaMissoesEm() - Date.now());
  if (!plus() && S.economia.proximoCoracaoEm && nextHeartMs() <= 0 && !V.salvando && !V.regenCor) { if (L) regenerarCoracoes(); else { S.economia.proximoCoracaoEm = null; recarregarEstado(); } }
  if (S.tempo && S.tempo.renovaEm && Date.now() >= new Date(S.tempo.renovaEm).getTime()) { S.tempo.renovaEm = null; if (!L) recarregarEstado(); }
  if (dkey() !== ultimoDia) { ultimoDia = dkey(); if (!L) recarregarEstado(); }
  if (!L && !document.hidden && ++tiques % 90 === 0) recarregarEstado();
}, 1000);
let tiques = 0;
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && !L) recarregarEstado(); });

/* ---------- início ---------- */
telaCarregando('Abrindo…');
sb.auth.onAuthStateChange((ev, s) => {
  if (ev === 'PASSWORD_RECOVERY') { mostrando = 'recuperar'; telaNovaSenha(); return; }
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(s);
});
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => rota(null));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
// Toque numa notificação de aviso: o service worker pede para abrir a aba certa
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => { const t = ev.data && ev.data.tab; if (t && S && !L && SCREENS[t]) go(t); });
})();
</script>
</body>
