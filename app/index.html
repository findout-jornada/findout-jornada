<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#503C9D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jornada">
<title>Findout Jornada</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jost:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap">
<style>
:root{
  --primary:#503C9D;--primary-d:#3A2A72;--primary-dd:#2D2160;--lilac:#8E7FCF;--lilac-l:#D2BBDB;
  --navy:#010F2E;--bg:#F4F4FE;--lav:#EAEDFF;--line:#E4DFF7;--line2:#C5C9E3;--white:#FFFFFF;
  --teal:#4CC3C1;--teal-d:#0B6E6C;--teal-dd:#0B3D3C;--teal-l:#DDF3F3;
  --green:#8FB569;--green-d:#5E8A3B;--green-dd:#2F5A14;--green-l:#EAF3DF;--green-b:#DCEBC9;
  --gold:#FFD36A;--gold-d:#8A6207;--gold-dd:#5A3F03;--gold-s:#C9A23E;--gold-l:#FFF8E1;
  --red:#E0475B;--red-d:#B8313F;--red-dd:#8A1F2B;--red-l:#FBE4E6;--red-b:#F8D7DA;
  --orange:#F08A24;--orange-d:#C8571D;--muted:#6F7172;--ink2:#444D69;--backdrop:#D9DCF2;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;--f-display:'Jost',system-ui,sans-serif;--f-body:'Roboto',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--navy);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
@media (min-width:520px){
  body{background:#0B1230;background-image:radial-gradient(900px 520px at 15% -10%,rgba(142,127,207,.55),transparent 60%),radial-gradient(760px 480px at 100% 110%,rgba(76,195,193,.45),transparent 55%),radial-gradient(500px 300px at 80% 10%,rgba(255,211,106,.18),transparent 60%);display:flex;align-items:center;justify-content:center;padding:24px 16px}
  #app{height:min(100%,880px);border-radius:40px;border:10px solid #070C22;box-shadow:0 0 0 2px rgba(255,255,255,.08),0 40px 90px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04)}
  #app::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#070C22;border-radius:0 0 16px 16px;z-index:60;pointer-events:none}
  .topbar{padding-top:calc(8px + 22px)}
  .auth{padding-top:46px}
  .fullpurple>div:first-child{padding-top:54px!important}
  .scroll>div[style*="var(--orange)"]{padding-top:40px!important}
  .nav{margin-bottom:14px}
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}
input{font:inherit}
#app{height:100%;width:100%;max-width:430px;margin:0 auto;background:var(--bg);background-image:radial-gradient(600px 300px at 50% -80px,rgba(142,127,207,.18),transparent 70%);display:flex;flex-direction:column;position:relative;overflow:hidden}
.px{font-family:var(--f-pixel);letter-spacing:.02em}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.pxbtn{box-shadow:4px 4px 0 var(--sh,var(--navy));transition:transform .06s}
.pxbtn:active{transform:translate(4px,4px);box-shadow:none}
@keyframes blink{50%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bounce{animation:bounce 1.3s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .4s ease-out both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.shake{animation:shake .25s 2}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes screenin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.screen-in>*{animation:screenin .22s ease-out both}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.xpfloat{position:absolute;left:50%;top:40%;font-family:var(--f-pixel);font-size:14px;color:var(--gold-d);text-shadow:2px 2px 0 var(--gold);pointer-events:none;z-index:30;animation:floatup 1s ease-out forwards;white-space:nowrap}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}.heartbreak{animation:heartbreak .55s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(76,195,193,.7),4px 4px 0 var(--navy)}100%{box-shadow:0 0 0 16px rgba(76,195,193,0),4px 4px 0 var(--navy)}}.ring{animation:ring 1.6s ease-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}.wiggle{animation:wiggle .6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin .9s linear infinite}
.opt,.chip,.slot,.node{transition:transform .08s,background-color .15s,border-color .15s}
.opt:active,.chip:active{transform:scale(.97)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.blink,.bounce,.pop,.shake,.screen-in>*,.heartbreak,.ring,.wiggle,.spin{animation:none}.xpfloat{display:none}}

.topbar{flex-shrink:0;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;min-height:60px;position:relative;z-index:6}
.topbar h1{margin:0;font-size:18px;font-weight:700;flex:1;font-family:var(--f-display)}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.pad{padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.footer{flex-shrink:0;padding:10px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.nav{flex-shrink:0;margin:8px 12px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(1,15,46,.14),0 2px 6px rgba(1,15,46,.06);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px;position:relative;z-index:6}
.nav button{height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);transition:background-color .15s,color .15s,transform .1s}
.nav button:active{transform:scale(.95)}
.nav button[aria-current="page"]{color:var(--primary);font-weight:700;background:var(--lav)}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 2px 0 rgba(80,60,157,.25))}

.btn{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;width:100%}
.btn-primary{background:linear-gradient(180deg,#6450B8 0%,var(--primary) 60%,#47358C 100%);color:var(--white)}
.btn-dark{background:linear-gradient(180deg,#1A2650,var(--navy));color:var(--white)}
.btn-gold{background:linear-gradient(180deg,#FFE08F,var(--gold) 60%,#F2C14E);color:var(--navy);--sh:var(--gold-s)}
.btn-outline{height:48px;border:2px solid var(--primary);color:var(--primary);background:var(--white);font-size:14px;font-weight:600}
.btn-ghost{height:44px;color:var(--muted);text-decoration:underline;font-weight:600;font-size:14px}
.btn-off{background:var(--line);color:var(--muted)}
.btn:disabled{opacity:.6}
.chipbtn{height:40px;padding:0 12px;border-radius:10px;border:2px solid var(--primary);background:var(--white);color:var(--primary);font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.chipbtn:disabled{border-color:transparent;background:var(--line);color:var(--muted)}
input.inp{width:100%;height:48px;padding:0 14px;border:2px solid var(--line2);border-radius:12px;background:#fff}
input.inp:focus{outline:0;border-color:var(--primary)}
label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:5px}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4;background:var(--lav)}
.msg.err{background:var(--red-l);color:var(--red-d)}.msg.ok{background:var(--green-l);color:var(--green-dd)}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line2)}

.card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(1,15,46,.05)}
button.card:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px}
.row+.row{border-top:1px solid var(--lav)}
.tile{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t15{font-weight:700;font-size:15px}
.sub{font-size:13px;color:var(--muted);line-height:1.4}
.h2{margin:0;font-size:15px;font-weight:700;font-family:var(--f-display)}
.bar{height:10px;background:var(--lav);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--primary)}

.jhead{justify-content:space-between}
.subjbtn{height:40px;border:1.5px solid var(--primary);border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:600;font-size:13px;max-width:46%;overflow:hidden;white-space:nowrap}
.subjbtn span{overflow:hidden;text-overflow:ellipsis}
.stat{height:36px;padding:0 9px 0 6px;border-radius:12px;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:700;font-size:14px}
.stat+.stat{margin-left:4px}

.trail{padding:12px 0 110px;display:flex;flex-direction:column;gap:10px;position:relative}
.trail::before{content:"";position:absolute;left:50%;top:0;bottom:60px;width:0;border-left:3px dashed var(--line2);transform:translateX(-50%);z-index:0}
.trail>*{position:relative;z-index:1}
.unit{margin:4px 20px 6px;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:12px;border:2px solid var(--primary);background:linear-gradient(135deg,#6450B8 0%,var(--primary) 55%,#3F2E82 100%);color:var(--white);box-shadow:0 10px 24px rgba(80,60,157,.28);overflow:hidden}
.unit::after{content:"";position:absolute;right:-30px;top:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.unit.locked{background:var(--white);color:var(--muted);border-color:var(--line);box-shadow:none}
.unit.locked::after{display:none}
.unit .guide{width:44px;height:44px;border-radius:10px;border:2px solid var(--lilac);display:flex;align-items:center;justify-content:center;color:inherit}
.unit.locked .guide{border-color:var(--line)}
.divider{margin:14px 20px 4px;display:flex;align-items:center;gap:10px;color:var(--muted)}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line)}
.divider span{font-size:8px;white-space:nowrap}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.nodeinner{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:72px;height:72px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.node:hover{transform:translateY(-2px)}
.crown{position:absolute;right:-8px;bottom:-6px;min-width:26px;height:26px;padding:0 5px;border-radius:13px;background:var(--gold);border:2px solid var(--gold-d);color:var(--gold-dd);font-size:8px;display:flex;align-items:center;justify-content:center;gap:2px}
.startlbl{background:var(--white);border:2px solid var(--primary);border-radius:8px;padding:7px 9px;font-size:8px;color:var(--primary)}
.mascot-side{position:absolute;left:100%;top:50%;transform:translate(14px,-50%);width:92px!important;pointer-events:none}
.mascot-side.left{left:auto;right:100%;transform:translate(-14px,-50%)}
.pop-card{margin:2px 20px 6px;position:relative}
.pop-card .caret{position:absolute;top:-8px;width:14px;height:14px;border-left:2px solid;border-top:2px solid;transform:translateX(-7px) rotate(45deg)}
.pop-card .box{border:2px solid;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--white);border:2px solid var(--primary);color:var(--primary);display:flex;align-items:center;justify-content:center;--sh:var(--primary);z-index:5}

.lhead{gap:10px}
.lprog{height:14px;background:var(--line);overflow:hidden;box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
.lprog>i{display:block;height:100%;background:var(--primary);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25);transition:width .35s}
.tag{font-size:8px;border:1px solid var(--primary);border-radius:2px;padding:4px 6px}
.combo{display:flex;align-items:center;gap:5px;background:var(--teal);border-radius:2px;padding:4px 7px;font-size:8px}
.q{margin:0;font-size:20px;font-weight:700;line-height:1.3;text-wrap:balance;font-family:var(--f-display)}
.qimg{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line)}
.opt{min-height:54px;border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--white);border:2px solid var(--line);border-bottom-width:4px;width:100%}
.opt .letter{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:14px;border:1.5px solid var(--primary)}
.opt .txt{font-size:17px;font-family:var(--f-display);font-weight:500;flex:1}
.opt.sel{border-color:var(--primary);background:var(--lav)}
.opt.sel .letter{background:var(--primary);color:var(--white)}
.opt.ok{border-color:var(--green-d);background:var(--green-l)}
.opt.bad{border-color:var(--red-d);background:var(--red-l)}
.chip{min-height:44px;padding:6px 14px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--white);font-family:var(--f-display);font-weight:600;font-size:16px}
.chip.used{background:var(--lav);color:transparent;border-color:var(--lav)}
.chip.sel{border-color:var(--primary);background:var(--lav)}
.chip.ok{border-color:var(--green-d);background:var(--green-l)}
.chip.bad{border-color:var(--red-d);background:var(--red-l)}
.chip.gone{background:var(--lav);color:var(--line2);border-color:var(--line2)}
.slot{min-width:110px;min-height:36px;padding:2px 10px;border-radius:8px;border:2px solid var(--line2);border-bottom-width:3px;background:var(--lav);font-family:var(--f-display);font-weight:600;font-size:16px;vertical-align:middle}
.slot.filled{background:var(--white);border-color:var(--primary)}
.slot.ok{border-color:var(--green-d);background:var(--green-l)}
.slot.bad{border-color:var(--red-d);background:var(--red-l)}
.bankline{margin:0;font-size:17px;line-height:2.1;font-family:var(--f-display)}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:10px;border-top:2px solid var(--line)}
.orderbox{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px;border:2px dashed var(--line2);border-radius:12px}
.matchgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.matchgrid .col{display:flex;flex-direction:column;gap:10px}
.matchgrid .chip{min-height:56px;font-size:15px;line-height:1.2;width:100%}
.stmt{padding:22px 18px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.3}
.tfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tfgrid .chip{height:60px;font-weight:700;font-size:17px}
.checkbar{flex-shrink:0;padding:12px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:10px;background:var(--bg)}
.banner{flex-shrink:0;padding:14px 20px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:slideup .2s ease-out}
.banner.ok{background:var(--green-b);color:var(--green-dd)}
.banner.bad{background:var(--red-b);color:var(--red-dd)}
.banner .ic{width:40px;height:40px;border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.sheet-bg{position:absolute;inset:0;background:rgba(1,15,46,.55);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:22px 22px 0 0;padding:14px 20px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -4px 0 var(--primary);z-index:21;animation:slideup .25s ease-out}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line2);align-self:center}
.overlay{position:absolute;inset:0;background:rgba(244,244,254,.85);z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600;color:var(--primary)}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--lav);border-top-color:var(--primary)}

.fullpurple{background:var(--primary);background-image:radial-gradient(520px 320px at 50% 0%,rgba(255,211,106,.22),transparent 70%),linear-gradient(180deg,#6450B8 0%,var(--primary) 45%,#2D2160 100%);color:var(--white)}
.statbox{border:2px solid;border-radius:14px;background:var(--white);color:var(--navy);overflow:hidden;display:flex;flex-direction:column;text-align:center}
.statbox .lbl{font-size:7px;padding:7px 4px}
.statbox .val{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 4px;font-family:var(--f-display);font-weight:700;font-size:22px}

.toast{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:rgba(1,15,46,.94);backdrop-filter:blur(8px);color:var(--white);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;z-index:40;box-shadow:4px 4px 0 var(--teal),0 10px 30px rgba(0,0,0,.25);animation:pop .25s ease-out}
.opt,.chip{box-shadow:0 1px 2px rgba(1,15,46,.04)}
.subjbtn{background:var(--white);box-shadow:0 2px 8px rgba(80,60,157,.12)}
.fab{box-shadow:4px 4px 0 var(--primary),0 10px 24px rgba(80,60,157,.25)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal span{height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:13px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--white);border-left:4px solid transparent}
.lrow.me{background:var(--lav);border-left-color:var(--primary);font-weight:700}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.zone{display:flex;align-items:center;gap:8px;padding:10px 20px;font-size:7px}
.zone::before,.zone::after{content:"";flex:1;height:2px;background:currentColor}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;background-image:radial-gradient(420px 260px at 50% -40px,rgba(142,127,207,.35),transparent 70%)}
.auth h1{font-family:var(--f-display);font-size:clamp(24px,6.5vw,28px);margin:0;line-height:1.2}

function isRight(e, a) {

  if (e.t === 'bank') return a.slots[0] === e.a[0] && a.slots[1] === e.a[1];

}

    case 'subject': { S.perfil.materia = x; V.open = null; sb.from('perfis').update({materia_atual: x}).eq('user_id', sessao.user.id).then(() => {}); const T = trilha(materiaAtual()); if (T.cur >= 0) V.open = 'L' + T.flat[T.cur].lic.id; return go('jornada', {scrollTo: true}); }
    case 'tier': V.tier = +x; return render();
    case 'share': if (navigator.share) navigator.share({title: 'Findout Jornada', text: `Estou com ${streak()} dias de ofensiva na Findout Jornada!`, url: location.origin + location.pathname}).catch(() => {}); return;
    case 'edit-nome': V.editNome = true; return render();
    case 'after': { const r = lastResult; if (r && r.streakUp) { go('ofensiva', {celebrate: true}); SND.streak(); confetti(70); return; } if (r && ['errors', 'unitreview', 'flash'].includes(r.mode)) return go('praticar'); abrirAtual(); return go('jornada', {scrollTo: true}); }
    case 'after-streak': return go('missoes', {celebrate: false});
    /* lição */
    case 'quit': V.sheet = 'quit'; return render();
    case 'stay': V.sheet = null; return render();
    case 'exit': L = null; return go('jornada', {scrollTo: true});
    case 'mc': SND.tap(); L.ans.pick = +x; return render();
    case 'tf': SND.tap(); L.ans.pick = x === 'true'; return render();
    case 'word': { SND.tap(); const e = L.queue[L.i], w = e.words[+x], s = L.ans.slots, i = s[0] === null ? 0 : s[1] === null ? 1 : -1; if (i >= 0) s[i] = w; return render(); }
    case 'slot': if (L.result === null) { SND.tap(); L.ans.slots[+x] = null; } return render();
    case 'order': { SND.tap(); const e = L.queue[L.i]; L.ans.order.push(e.items[+x]); return render(); }
    case 'unorder': if (L.result === null) { SND.tap(); L.ans.order.splice(+x, 1); } return render();
    case 'match': {
      const e = L.queue[L.i], side = x, t = (side === 'L' ? e.left : e.right)[+y], an = L.ans;
      if (!an.sel || an.sel.side === side) { SND.tap(); an.sel = {side, t}; L.miss = false; return render(); }
      const Lt = side === 'L' ? t : an.sel.t, Rt = side === 'R' ? t : an.sel.t;
      an.sel = null;
      if (e.map[Lt] === Rt) { an.matched.push('L' + Lt, 'R' + Rt); L.miss = false; if (an.matched.length === e.left.length * 2) return grade(true); SND.match(); return render(); }
      L.miss = true; L.missCount = (L.missCount || 0) + 1; SND.bad(); return render();
    }
    case 'check': return grade(isRight(L.queue[L.i], L.ans));
    case 'skip': { const e = L.queue[L.i]; L.result = 'err'; L.combo = 0; L.errors++; L.lostHeart = false; L.erradas.add(e.id); L.acertadas.delete(e.id); if (requeues() && QI[e.id]) { const again = exercicio(QI[e.id]); L.wrongKeys.add(again.id + '#' + L.queue.length); L.queue.push(again); } render(); SND.bad(); return; }
    case 'next': return next();
  }
}
app.addEventListener('click', ev => { const el = ev.target.closest('[data-a]'); if (!el || el.disabled || !S) return; act(el.dataset.a).catch(e => { console.error(e); toast('Algo deu errado. Tente de novo.'); }); });
app.addEventListener('submit', async ev => {
  if (ev.target.id !== 'f-nome') return;
  ev.preventDefault();
  const nome = document.getElementById('nome-inp').value.trim(); if (!nome) return;
  const {error} = await sb.from('perfis').update({nome}).eq('user_id', sessao.user.id);
  if (error) return toast(traduz(error.message));
  S.perfil.nome = nome; V.editNome = false; toast('Nome atualizado.');
});

/* ---------- relógios ---------- */
let ultimoDia = dkey();
setInterval(() => {
  if (!S) return;
  if (L && L.mode === 'flash') {
    const t = document.getElementById('flash-t');
    if (Date.now() >= L.deadline && L.result === null && !V.salvando) { finish(true); return; }
    if (t) t.lastChild.textContent = mmss(L.deadline - Date.now());
  }
  const ht = document.getElementById('heart-t'); if (ht) ht.textContent = 'PRÓXIMO CORAÇÃO EM ' + hms(nextHeartMs());
  const mt = document.getElementById('mid-t'); if (mt) { const m = new Date(); m.setHours(24, 0, 0, 0); mt.textContent = 'renovam em ' + hms(m - Date.now()); }
  if (!plus() && S.economia.proximoCoracaoEm && nextHeartMs() <= 0 && !V.salvando) { S.economia.proximoCoracaoEm = null; recarregarEstado(); }
  if (dkey() !== ultimoDia) { ultimoDia = dkey(); if (!L) recarregarEstado(); }
  if (!L && !document.hidden && ++tiques % 90 === 0) recarregarEstado();
}, 1000);
let tiques = 0;
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && !L) recarregarEstado(); });

/* ---------- início ---------- */
telaCarregando('Abrindo…');
sb.auth.onAuthStateChange((ev, s) => {
  if (ev === 'PASSWORD_RECOVERY') { mostrando = 'recuperar'; telaNovaSenha(); return; }
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(s);
});
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => rota(null));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
