<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#503C9D">
<title>Findout Jornada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Jost:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#F4F4FE;--surface:#fff;--line:#E4DFF7;--line2:#C5C9E3;--fg:#010F2E;--fg2:#444D69;--muted:#6F7172;--primary:#503C9D;--primary-d:#3A2A72;--primary-l:#EAEDFF;--teal:#4CC3C1;--teal-d:#0B6E6C;--red:#E0475B;--red-d:#B8313F;--red-l:#FBE4E6;--green-l:#EAF3DF;--green-d:#2F5A14;--gold:#FFD36A;--gold-d:#8A6207;--orange:#F08A24;--orange-d:#C8571D}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#D9DCF2;color:var(--fg);font-family:Roboto,system-ui,sans-serif;font-size:15px}
#app{min-height:100%;max-width:460px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
h1{font-family:Jost,sans-serif;font-size:26px;margin:0;line-height:1.2}
.px{font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:.02em}
label{font-size:12px;font-weight:600;color:var(--fg2);display:block;margin-bottom:5px}
input{width:100%;height:48px;padding:0 14px;border:2px solid var(--line2);border-radius:12px;font:inherit;background:#fff}
input:focus{outline:0;border-color:var(--primary)}
button{font:inherit;cursor:pointer}
.btn{height:54px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.pxbtn{box-shadow:4px 4px 0 var(--sh,#010F2E)}.pxbtn:active{transform:translate(4px,4px);box-shadow:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:#fff;border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:600;font-size:14px;height:44px}
.btn:disabled{opacity:.6;cursor:default}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.4}
.msg.err{background:var(--red-l);color:var(--red-d)}.msg.ok{background:var(--green-l);color:var(--green-d)}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line2)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:Jost,sans-serif;font-weight:700;font-size:22px}
.stat small{font-size:11px;color:var(--muted);font-family:Roboto,sans-serif;font-weight:500}
.col{display:flex;flex-direction:column;gap:14px}
.mascot{width:140px;height:auto;align-self:center}
</style>
</head>
<body>
<div id="app"><div class="col" id="view" style="flex:1;justify-content:center"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const sb = supabase.createClient(FJ_CONFIG.supabaseUrl, FJ_CONFIG.supabaseAnonKey);
const view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G = '<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.5L6.4 10c.8-2.3 3-4 5.6-4z"/></svg>';
function traduz(m) {
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/already registered/i.test(m)) return 'Este e-mail já tem conta. Entre com a senha.';
  if (/email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos.';
  if (/password should be/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Espere um minuto.';
  return m;
}

function telaEntrar(modo = 'entrar', msg = '') {
  const cadastro = modo === 'cadastro';
  view.innerHTML = `
    <div class="col" style="text-align:center;gap:8px">
      <span class="px" style="color:var(--primary)">★ FINDOUT JORNADA ★</span>
      <h1>${cadastro ? 'Criar sua conta' : 'Bem-vindo de volta'}</h1>
      <p style="margin:0;color:var(--muted);font-size:14px">${cadastro ? 'Leva 20 segundos. Depois é só começar a trilha.' : 'Entre para continuar sua ofensiva.'}</p>
    </div>
    ${msg}
    <form id="f" class="col" style="gap:12px">
      ${cadastro ? '<div><label for="nome">Como quer ser chamado</label><input id="nome" autocomplete="nickname" required maxlength="30" placeholder="Ex.: Ana"></div>' : ''}
      <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="senha">Senha</label><input id="senha" type="password" autocomplete="${cadastro ? 'new-password' : 'current-password'}" required minlength="6" placeholder="mínimo 6 caracteres"></div>
      <button class="btn btn-primary pxbtn" id="ok">${cadastro ? 'Criar conta' : 'Entrar'}</button>
      <div class="sep">ou</div>
      <button type="button" class="btn btn-outline" id="google">${G}Continuar com Google</button>
      <button type="button" class="btn-ghost" id="trocar">${cadastro ? 'Já tenho conta' : 'Criar uma conta'}</button>
      ${cadastro ? '' : '<button type="button" class="btn-ghost" id="esqueci" style="height:32px">Esqueci a senha</button>'}
    </form>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const b = document.getElementById('ok'); b.disabled = true; b.textContent = 'Um momento…';
    const em = document.getElementById('email').value.trim(), pw = document.getElementById('senha').value;
    let error;
    if (cadastro) {
      const nome = document.getElementById('nome').value.trim();
      const r = await sb.auth.signUp({email: em, password: pw, options: {data: {nome}}});
      error = r.error;
      if (!error && !r.data.session) return telaEntrar('entrar', '<div class="msg ok">Conta criada! Confirme pelo link que enviamos ao seu e-mail e depois entre.</div>');
    } else {
      error = (await sb.auth.signInWithPassword({email: em, password: pw})).error;
    }
    if (error) telaEntrar(modo, `<div class="msg err">${esc(traduz(error.message))}</div>`);
  };
  document.getElementById('google').onclick = () => sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  document.getElementById('trocar').onclick = () => telaEntrar(cadastro ? 'entrar' : 'cadastro');
  const esq = document.getElementById('esqueci');
  if (esq) esq.onclick = async () => {
    const em = document.getElementById('email').value.trim();
    if (!em) return telaEntrar('entrar', '<div class="msg err">Digite o e-mail e toque de novo em "Esqueci a senha".</div>');
    const {error} = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname});
    telaEntrar('entrar', error ? `<div class="msg err">${esc(traduz(error.message))}</div>` : '<div class="msg ok">Enviamos um link para redefinir a senha.</div>');
  };
}

async function telaInicio(session) {
  view.innerHTML = '<div class="msg">Carregando seu progresso…</div>';
  const {data: S, error} = await sb.rpc('estado_aluno');
  if (error) { view.innerHTML = `<div class="msg err">Não consegui carregar: ${esc(error.message)}</div><button class="btn btn-outline" id="sair">Sair</button>`; document.getElementById('sair').onclick = () => sb.auth.signOut(); return; }
  const e = S.economia, o = S.ofensiva;
  view.innerHTML = `
    <div class="col" style="text-align:center;gap:6px">
      <span class="px" style="color:var(--primary)">★ SEMANA 1 · BANCO LIGADO ★</span>
      <h1>Oi, ${esc(S.perfil.nome)}!</h1>
      <p style="margin:0;color:var(--muted);font-size:14px">Sua conta está criada e o servidor já guarda seu progresso.</p>
    </div>
    <div class="stats">
      <div class="stat" style="color:var(--red-d)">${S.perfil.plus ? '∞' : e.coracoes}<small>corações</small></div>
      <div class="stat" style="color:var(--gold-d)">${e.moedas}<small>moedas</small></div>
      <div class="stat" style="color:var(--orange-d)">${o.dias}<small>ofensiva</small></div>
    </div>
    <div class="card col" style="gap:8px;font-size:14px">
      <b>Missões de hoje</b>
      ${S.dia.missoes.map(m => `<div style="display:flex;justify-content:space-between"><span>${esc(m.texto)}</span><span style="color:var(--muted)">${m.progresso}/${m.meta}</span></div>`).join('') || '<span style="color:var(--muted)">Nenhuma missão ativa.</span>'}
    </div>
    <div class="card col" style="gap:8px;font-size:14px">
      <b>Liga ${S.parametros.ligas.niveis[S.liga.nivel]}</b>
      ${S.liga.ranking.map((p, i) => `<div style="display:flex;gap:10px"><span style="width:20px;color:var(--muted)">${i + 1}</span><span style="flex:1;font-weight:${p.eu ? 700 : 400}">${esc(p.nome)}${p.eu ? ' (você)' : ''}</span><span>${p.xp} XP</span></div>`).join('')}
    </div>
    <p style="margin:0;color:var(--muted);font-size:13px;text-align:center">Conteúdo publicado: ${S.versaoConteudo ? 'versão ' + S.versaoConteudo : 'nenhum ainda'}. As trilhas e lições entram nas semanas 4 a 6.</p>
    <button class="btn-ghost" id="sair">Sair</button>`;
  document.getElementById('sair').onclick = () => sb.auth.signOut();
}

let mostrando = '';
function rota(session) { const alvo = session ? 'inicio:' + session.user.id : 'login'; if (alvo === mostrando) return; mostrando = alvo; if (session) telaInicio(session); else telaEntrar(); }
rota(null);
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => {});
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(session); });
})();
</script>
</body>
</html>
