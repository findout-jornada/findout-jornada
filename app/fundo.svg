<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
<!-- Papel de parede do app (estilo WhatsApp): ícones de educação em marca-d'água. Repetido pelo CSS de #app. -->
<g fill="none" stroke="#2D4FD6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".13">
  <!-- livro aberto -->
  <g transform="translate(28 30) rotate(-8)"><path d="M0 4q10-6 20 0v26q-10-6-20 0z"/><path d="M20 4q10-6 20 0v26q-10-6-20 0"/><path d="M5 11h10M5 17h10M25 11h10M25 17h10"/></g>
  <!-- lápis -->
  <g transform="translate(100 18) rotate(35)"><rect x="0" y="0" width="10" height="34" rx="1.5"/><path d="M0 34l5 9 5-9M0 7h10"/></g>
  <!-- número 7 -->
  <text x="158" y="48" font-family="Jost, Arial, sans-serif" font-size="30" font-weight="700" fill="#2D4FD6" stroke="none">7</text>
  <!-- átomo (física) -->
  <g transform="translate(228 36)"><ellipse rx="22" ry="8"/><ellipse rx="22" ry="8" transform="rotate(60)"/><ellipse rx="22" ry="8" transform="rotate(120)"/><circle r="3" fill="#2D4FD6" stroke="none"/></g>
  <!-- sinal de mais -->
  <path d="M290 28v24M278 40h24"/>
  <!-- balão de química -->
  <g transform="translate(40 110)"><path d="M8 0h12M11 0v12L0 32a4 4 0 0 0 3 6h22a4 4 0 0 0 3-6L17 12V0"/><path d="M6 28h16"/><circle cx="12" cy="33" r="1.5" fill="#2D4FD6" stroke="none"/><circle cx="18" cy="31" r="1" fill="#2D4FD6" stroke="none"/></g>
  <!-- raiz quadrada -->
  <path d="M96 118l6 14 8-30h22"/>
  <!-- caderno -->
  <g transform="translate(150 96) rotate(6)"><rect x="0" y="0" width="28" height="36" rx="3"/><path d="M6 0v36M11 8h12M11 14h12M11 20h8"/><path d="M-3 7h6M-3 15h6M-3 23h6M-3 31h6"/></g>
  <!-- sinal de multiplicação -->
  <path d="M212 108l18 18M230 108l-18 18"/>
  <!-- DNA (biologia) -->
  <g transform="translate(272 96)"><path d="M0 0c20 12 20 28 0 40M24 0c-20 12-20 28 0 40"/><path d="M4 6h16M2 14h20M2 26h20M4 34h16"/></g>
  <!-- caneta -->
  <g transform="translate(20 190) rotate(-40)"><path d="M0 0h10l2 28-7 10-7-10z"/><path d="M5 38v8M0 4h10"/></g>
  <!-- número 3 -->
  <text x="76" y="216" font-family="Jost, Arial, sans-serif" font-size="30" font-weight="700" fill="#2D4FD6" stroke="none">3</text>
  <!-- igual -->
  <path d="M112 196h26M112 206h26"/>
  <!-- régua -->
  <g transform="translate(160 180) rotate(30)"><rect x="0" y="0" width="44" height="12" rx="2"/><path d="M8 0v5M16 0v8M24 0v5M32 0v8M40 0v5"/></g>
  <!-- pi -->
  <text x="222" y="212" font-family="Georgia, serif" font-size="30" fill="#2D4FD6" stroke="none">π</text>
  <!-- tubo de ensaio -->
  <g transform="translate(276 176) rotate(20)"><path d="M0 0h12M2 0v30a4 4 0 0 0 8 0V0"/><path d="M2 18h8"/></g>
  <!-- folha (biologia) -->
  <g transform="translate(36 264) rotate(-20)"><path d="M0 28C0 10 12 0 30 0c0 18-10 30-28 30z"/><path d="M2 28C8 18 16 10 26 4"/></g>
  <!-- divisão -->
  <g transform="translate(104 272)"><path d="M0 8h24"/><circle cx="12" cy="1" r="1.6" fill="#2D4FD6" stroke="none"/><circle cx="12" cy="15" r="1.6" fill="#2D4FD6" stroke="none"/></g>
  <!-- chapéu de formatura -->
  <g transform="translate(150 258)"><path d="M0 10L22 0l22 10-22 10z"/><path d="M10 15v10q12 8 24 0V15M44 10v12"/></g>
  <!-- lupa -->
  <g transform="translate(222 258)"><circle cx="12" cy="12" r="11"/><path d="M20 20l12 12"/></g>
  <!-- lâmpada (ideia) -->
  <g transform="translate(272 254)"><path d="M12 0a12 12 0 0 0-7 21v6h14v-6a12 12 0 0 0-7-21z"/><path d="M8 31h8M9 12l3 4 3-4"/></g>
  <!-- menos e percentual, pequenos preenchendo vazios -->
  <path d="M62 160h16"/>
  <g transform="translate(250 150)"><path d="M0 16L16 0"/><circle cx="3" cy="3" r="2.5"/><circle cx="13" cy="13" r="2.5"/></g>
</g>
</svg>
