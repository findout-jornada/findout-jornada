<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010F2E">
<title>Painel · Findout Jornada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#F4F4FE;--surface:#FFFFFF;--surface2:#EAEDFF;--line:#E4DFF7;--line2:#C5C9E3;
  --fg:#010F2E;--fg2:#444D69;--muted:#6F7172;
  --primary:#503C9D;--primary-d:#3A2A72;--primary-l:#EAEDFF;--navy:#010F2E;
  --teal:#4CC3C1;--teal-d:#0B6E6C;--teal-l:#DDF3F3;--green:#8FB569;--green-d:#2F5A14;--green-l:#EAF3DF;
  --gold:#FFD36A;--gold-d:#8A6207;--gold-l:#FFF8E1;--red:#E0475B;--red-d:#B8313F;--red-l:#FBE4E6;--orange:#F08A24;--orange-d:#C8571D;
  --blue:#4C86E8;--blue-d:#2763CE;--blue-l:#E1EBFC;
  --side:#010F2E;--side-fg:#C5C9E3;--side-active:#503C9D;
  --topbar:rgba(255,255,255,.85);--shadow:rgba(1,15,46,.05);
  --f-display:'Jost',system-ui,sans-serif;--f-body:'Roboto',system-ui,sans-serif;--f-pixel:'Press Start 2P',monospace;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1026;--surface:#151B3B;--surface2:#1E2549;--line:#272F58;--line2:#3B4474;
    --fg:#EDEFFC;--fg2:#BCC3E0;--muted:#8E95B8;
    --primary:#A294E8;--primary-d:#B9ADF2;--primary-l:rgba(162,148,232,.16);
    --teal-d:#7FDBD9;--teal-l:rgba(76,195,193,.14);--green-d:#B5D694;--green-l:rgba(143,181,105,.16);
    --gold-d:#FFDF96;--gold-l:rgba(255,211,106,.13);--red-d:#F2899A;--red-l:rgba(224,71,91,.15);--orange-d:#F7B370;
    --blue-d:#8FB7F5;--blue-l:rgba(76,134,232,.16);
    --side-fg:#9FA6CB;--topbar:rgba(11,16,38,.82);--shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1026;--surface:#151B3B;--surface2:#1E2549;--line:#272F58;--line2:#3B4474;
  --fg:#EDEFFC;--fg2:#BCC3E0;--muted:#8E95B8;
  --primary:#A294E8;--primary-d:#B9ADF2;--primary-l:rgba(162,148,232,.16);
  --teal-d:#7FDBD9;--teal-l:rgba(76,195,193,.14);--green-d:#B5D694;--green-l:rgba(143,181,105,.16);
  --gold-d:#FFDF96;--gold-l:rgba(255,211,106,.13);--red-d:#F2899A;--red-l:rgba(224,71,91,.15);--orange-d:#F7B370;
  --blue-d:#8FB7F5;--blue-l:rgba(76,134,232,.16);
  --side-fg:#9FA6CB;--topbar:rgba(11,16,38,.82);--shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.55}
a{color:var(--primary)}
code{font-size:12px;background:var(--surface2);padding:2px 5px;border-radius:5px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:600}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.px{font-family:var(--f-pixel);font-size:8px;letter-spacing:.02em}
[hidden]{display:none!important}

#shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
#shell.auth{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{width:100%;max-width:400px;padding:28px;display:flex;flex-direction:column;gap:16px}
.login .brand{color:var(--fg);padding:0 0 4px}
.login .brand small{color:var(--muted)}
.login h1{font-size:22px}
aside{background:linear-gradient(180deg,#070C22 0%,var(--side) 40%,#1A1F4B 100%);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--side-fg)}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--side-fg);width:100%;text-align:left;font-weight:500}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.navbtn .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:10px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--side-fg);padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.sidefoot button{color:var(--side-fg);text-align:left;text-decoration:underline}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
body{background-image:radial-gradient(700px 300px at 70% -80px,rgba(142,127,207,.16),transparent 70%)}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;border:1.5px solid transparent}
.btn-primary{background:linear-gradient(180deg,#6450B8,var(--primary) 60%,#47358C);color:#fff;box-shadow:0 4px 12px rgba(80,60,157,.25)}
.btn-primary:hover{background:linear-gradient(180deg,#5A47B0,var(--primary-d))}
.btn-outline{border-color:var(--primary);color:var(--primary);background:var(--surface)}
.btn-ghost{color:var(--fg2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-danger{color:var(--red-d);border-color:var(--red-d)}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn-xs{height:24px;padding:0 6px;font-size:11px;border-radius:6px}
.btn-teal{background:var(--teal);color:var(--navy)}
.btn.full{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 16px var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 16px var(--shadow);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--teal),var(--primary))}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.tile .hint{font-size:12px;color:var(--fg2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:var(--surface2)}
.tbl-wrap{overflow-x:auto}
.alunos{display:flex;flex-direction:column}
.aluno{display:flex;align-items:center;gap:14px 18px;padding:14px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.aluno>input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);flex-shrink:0}
.aluno .who{display:flex;align-items:center;gap:12px;flex:1 1 250px;min-width:0}
.aluno .av{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary-l),var(--teal-l));color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:16px;flex-shrink:0}
.aluno .who .meta{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aluno .stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--fg2)}
.stat svg{width:13px;height:13px;flex-shrink:0}
.stat .num{font-size:13px}
.stat.s-xp{background:var(--primary-l);color:var(--primary)}
.stat.s-mo{background:var(--gold-l);color:var(--gold-d)}
.stat.s-co{background:var(--red-l);color:var(--red-d)}
.stat.s-li{background:var(--teal-l);color:var(--teal-d)}
.stat.s-of{background:rgba(240,138,36,.14);color:var(--orange-d)}
.stat.s-cg{background:var(--blue-l);color:var(--blue-d)}
.aluno .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
@media (max-width:820px){.aluno .acts{margin-left:54px}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.pub{background:var(--green-l);color:var(--green-d)}
.pill.draft{background:var(--gold-l);color:var(--gold-d)}
.pill.off{background:var(--surface2);color:var(--muted)}
.pill.type{background:var(--primary-l);color:var(--primary)}
.pill.on{background:var(--teal-l);color:var(--teal-d)}
.abbr{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-pixel);font-size:8px;color:#fff;flex-shrink:0}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:12px;font-weight:600;color:var(--fg2)}
.inp{height:38px;padding:0 11px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px var(--primary-l)}
.inp.sm{height:32px;font-size:13px}
input[type=color].inp{padding:2px 4px;width:48px}
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.toggle{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line2);flex-shrink:0;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--teal)}
.toggle[aria-checked="true"]::after{left:21px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column}
.list>button,.list>div.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list>button:hover{background:var(--surface2)}
.list>button[aria-current="true"]{background:var(--primary-l);font-weight:600}
.list>:last-child{border-bottom:0}
.tree{display:flex;flex-direction:column;gap:10px}
.sec{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface2);flex-wrap:wrap}
.unit{padding:8px 14px 10px 28px;border-top:1px solid var(--line)}
.unit-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.lesson{display:flex;align-items:center;gap:8px;padding:6px 0 6px 22px;font-size:13px;flex-wrap:wrap}
.lesson .qn{font-size:11px;color:var(--muted)}
.lesson .qn.warn{color:var(--orange-d);font-weight:600}
.inline-edit{border:0;border-bottom:1.5px dashed var(--line2);background:transparent;padding:2px 4px;min-width:120px;flex:1}
.inline-edit:focus{border-bottom-color:var(--primary);outline:0}
.mv{display:inline-flex;gap:2px}
.mv button{width:22px;height:22px;border-radius:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.mv button:hover{background:var(--surface2);color:var(--fg)}

.drawer-bg{position:fixed;inset:0;background:rgba(1,15,46,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:21;display:grid;grid-template-columns:1fr 360px;overflow:hidden;box-shadow:-8px 0 30px rgba(1,15,46,.25)}
@media (max-width:860px){.drawer{grid-template-columns:1fr}.drawer .prevcol{display:none}}
.drawer .formcol{overflow-y:auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:16px}
.drawer .prevcol{background:var(--surface2);border-left:1px solid var(--line);padding:22px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.drawer-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drawer-h .right{margin-left:auto;display:flex;gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.typebtn{border:1.5px solid var(--line2);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.typebtn b{font-size:13px}.typebtn span{font-size:11px;color:var(--muted)}
.typebtn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-l)}
.imgbox{border:1.5px dashed var(--line2);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.imgbox img{max-width:180px;max-height:120px;border-radius:8px;border:1px solid var(--line)}
.imgbox .hint{font-size:12px;color:var(--muted)}

.phone{width:300px;background:#F4F4FE;color:#010F2E;border:8px solid #010F2E;border-radius:30px;overflow:hidden;font-family:var(--f-body);display:flex;flex-direction:column;min-height:520px;flex-shrink:0}
.phone .ph{padding:12px 12px 8px;background:#fff;border-bottom:1px solid #E4DFF7;display:flex;align-items:center;gap:8px}
.phone .pb{flex:1;height:10px;background:#E4DFF7}.phone .pb i{display:block;width:45%;height:100%;background:#503C9D}
.phone .pm{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.phone .tag{font-family:var(--f-pixel);font-size:7px;border:1px solid #503C9D;border-radius:2px;padding:3px 5px;align-self:flex-start}
.phone .q{font-size:15px;font-weight:700;line-height:1.3}
.phone .qimg{width:100%;max-height:150px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid #E4DFF7}
.phone .opt{min-height:40px;border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #E4DFF7;border-bottom-width:4px;font-size:13px}
.phone .opt.ok{border-color:#5E8A3B;background:#EAF3DF}
.phone .opt .lt{width:22px;height:22px;border-radius:6px;border:1.5px solid #503C9D;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:11px;flex-shrink:0}
.phone .chip{display:inline-flex;align-items:center;min-height:32px;padding:4px 10px;border-radius:8px;border:2px solid #E4DFF7;border-bottom-width:3px;background:#fff;font-family:var(--f-display);font-weight:600;font-size:13px}
.phone .chips{display:flex;flex-wrap:wrap;gap:6px}
.phone .stmt{background:#fff;border:1px solid #E4DFF7;border-radius:12px;padding:14px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.phone .foot{padding:10px 14px;border-top:2px solid #E4DFF7;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.phone .foot span{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.phone .mg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phone .slot{display:inline-block;min-width:70px;border-bottom:2px solid #503C9D;background:#EAEDFF;border-radius:6px;padding:0 6px;font-weight:600;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.14);padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:4px 4px 0 var(--teal);max-width:calc(100% - 32px)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.barrow .bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.barrow .bar i{display:block;height:100%;background:var(--primary);border-radius:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv b{font-family:var(--f-display)}
pre.json{margin:0;background:var(--navy);color:#C5C9E3;padding:14px;border-radius:10px;font-size:11.5px;line-height:1.45;overflow:auto;max-height:420px}
.checklist{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:8px}
.checklist label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.checklist label:hover{background:var(--surface2)}
.checklist input{accent-color:var(--primary);width:16px;height:16px}
.warnbox{background:var(--gold-l);color:var(--gold-d);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.okbox{background:var(--teal-l);color:var(--teal-d)}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4;background:var(--surface2)}
.msg.err{background:var(--red-l);color:var(--red-d)}.msg.ok{background:var(--green-l);color:var(--green-d)}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;padding:0;font-size:13px}
.modal{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));z-index:30;padding:20px;display:flex;flex-direction:column;gap:14px}

@media (max-width:760px){
  #shell{grid-template-columns:1fr}
  aside{position:sticky;top:0;z-index:15;height:auto;flex-direction:row;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:10px 12px;gap:4px;scrollbar-width:none}
  aside::-webkit-scrollbar{display:none}
  .brand{width:auto;padding:0 10px 0 2px;flex-shrink:0}
  .brand small{display:none}
  .brand b{font-size:16px}
  .navbtn{width:auto;padding:8px 10px;font-size:13px;flex-shrink:0;white-space:nowrap}.navbtn .cnt{display:none}
  .sidefoot{display:none}
  .topbar{position:static;padding:14px 16px;gap:10px}
  h1{font-size:20px}
  .topbar .sub{font-size:12px}
  .topbar .actions{margin-left:0;width:100%}
  .topbar .actions .btn{flex:1}

// Assuntos de uma questão: os cadastrados (opcionais) mais o título da unidade, que vale como assunto implícito
const assuntosDe = q => { const u = unidadeInfo(q.unidade_id); const s = new Set(q.assuntos || []); if (u) s.add(u.u.titulo); return [...s]; };
const temAssunto = (q, a) => assuntosDe(q).some(x => x.localeCompare(a, 'pt-BR', {sensitivity: 'base'}) === 0);
const textoBusca = q => (q.enunciado + ' ' + JSON.stringify(q.dados || {}) + ' ' + (q.explicacao || '') + ' ' + assuntosDe(q).join(' ')).toLowerCase();
const todosAssuntos = (qs = D.questoes) => { const s = new Map(); qs.forEach(q => assuntosDe(q).forEach(a => { const k = a.toLowerCase(); if (!s.has(k)) s.set(k, a); })); return [...s.values()].sort((a, b) => a.localeCompare(b, 'pt-BR')); };

/* helpers de árvore */
const materiaPorId = id => D.materias.find(m => m.id === id);
const secoesDe = mid => D.secoes.filter(s => s.materia_id === mid);
const unidadesDe = sid => D.unidades.filter(u => u.secao_id === sid);
const licoesDe = uid => D.licoes.filter(l => l.unidade_id === uid);
const questoesDaLicao = lid => D.licaoQuestoes.filter(x => x.licao_id === lid).sort((a, b) => a.ordem - b.ordem).map(x => x.questao_id);
function unidadeInfo(uid) { const u = D.unidades.find(x => x.id === uid); if (!u) return null; const s = D.secoes.find(x => x.id === u.secao_id); const m = s && materiaPorId(s.materia_id); return m ? {m, s, u} : null; }
const todasUnidades = () => D.materias.flatMap(m => secoesDe(m.id).flatMap(s => unidadesDe(s.id).map(u => ({m, s, u}))));
function licaoInfo(lid) { const l = D.licoes.find(x => x.id === lid); const x = l && unidadeInfo(l.unidade_id); return x ? {...x, l} : null; }
const todasLicoes = () => todasUnidades().flatMap(x => licoesDe(x.u.id).map(l => ({...x, l})));
const tamLicao = () => Math.max(1, +D.param.economia.tamanhoLicao || 5);
const proximaOrdem = arr => arr.reduce((n, x) => Math.max(n, (x.ordem ?? -1) + 1), 0);

/* =====================================================================
   Pacote publicado (contrato lido pelo app)
   ===================================================================== */
function montarPacote() {
  const pub = D.questoes.filter(q => q.status === 'publicada');
  const ids = new Set(pub.map(q => q.id));
  return {
    materias: D.materias.filter(m => m.ativa).map(m => ({id: m.id, nome: m.nome, sigla: m.sigla, cor: m.cor,
      secoes: secoesDe(m.id).map(s => ({id: s.id, titulo: s.titulo,
        unidades: unidadesDe(s.id).map(u => ({id: u.id, titulo: u.titulo,
          licoes: licoesDe(u.id).map(l => ({id: l.id, titulo: l.titulo, descricao: l.descricao || '', questoes: questoesDaLicao(l.id).filter(id => ids.has(id))}))}))}))})),
    questoes: pub.map(q => ({id: q.id, materia: q.materia_id, unidade: q.unidade_id, tipo: q.tipo, enunciado: q.enunciado, imagem: q.imagem_url || null, dados: q.dados, explicacao: q.explicacao})),
    missoes: {diarias: D.missoes.filter(x => x.ativa).map(x => ({id: x.id, texto: x.texto, tipo: x.tipo, meta: x.meta})), ...D.param.missoes},
    economia: D.param.economia,
    ligas: D.param.ligas,
    loja: D.loja.filter(i => i.ativo).map(i => ({codigo: i.codigo, nome: i.nome, tipo: i.tipo, preco: i.preco, rotulo: i.rotulo_preco || null}))
  };
}
function alteracoesPendentes() {
  if (!D) return false;
  if (!D.ultimoPacote) return D.materias.length > 0;
  const limpo = p => { const {geradoEm, versao, ...resto} = p; return resto; };
  return canon(limpo(montarPacote())) !== canon(limpo(D.ultimoPacote));
}

function telaAuth(conteudo) {
  shell.className = 'auth';

}
function telaLogin(msg = '') {
  telaAuth(`${msg}
    <form id="f" class="form" style="gap:12px">
      <div class="field"><label for="email">E-mail</label><input id="email" class="inp" type="email" autocomplete="username" required></div>
      <div class="field"><label for="senha">Senha</label><input id="senha" class="inp" type="password" autocomplete="current-password" required minlength="6"></div>
      <button class="btn btn-primary full" id="entrar">Entrar</button>
      <div class="sep">ou</div>
      <button type="button" class="btn btn-outline full" id="google" style="border-color:var(--line2);color:var(--fg)">${I.google}Entrar com Google</button>
      <button type="button" class="link" id="esqueci">Esqueci a senha</button>
    </form>`);
  const email = document.getElementById('email'), senha = document.getElementById('senha');
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const b = document.getElementById('entrar'); b.disabled = true; b.textContent = 'Entrando…';

    if (error) { const v = email.value; telaLogin(`<div class="msg err">${esc(traduzErro(error.message))}</div>`); document.getElementById('email').value = v; }
  };
  document.getElementById('google').onclick = () => sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  document.getElementById('esqueci').onclick = async () => {
    const em = email.value.trim();
    if (!em) return telaLogin('<div class="msg err">Digite o e-mail primeiro e clique de novo em "Esqueci a senha".</div>');
    const {error} = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname});
    telaLogin(error ? `<div class="msg err">${esc(traduzErro(error.message))}</div>` : '<div class="msg ok">Enviamos um link para redefinir a senha. Confira seu e-mail.</div>');
  };

function telaNovaSenha(msg = '') {
  telaAuth(`${msg}<form id="f" class="form" style="gap:12px"><div class="field"><label for="ns">Nova senha</label><input id="ns" class="inp" type="password" autocomplete="new-password" required minlength="6"></div><button class="btn btn-primary full" id="ok">Salvar nova senha</button></form>`);
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const {error} = await sb.auth.updateUser({password: document.getElementById('ns').value});
    if (error) return telaNovaSenha(`<div class="msg err">${esc(traduzErro(error.message))}</div>`);
    toast('Senha alterada.'); mostrando = ''; const {data} = await sb.auth.getSession(); rota(data.session);
  };
}
async function rota(s) {
  const alvo = s ? 'in:' + s.user.id : 'out';
  if (alvo === mostrando) return; mostrando = alvo;
  if (!s) { sessao = null; D = null; admin = false; const h = new URLSearchParams((location.hash || '').replace(/^#/, '')), q = new URLSearchParams(location.search); const e = h.get('error_description') || q.get('error_description') || h.get('error') || q.get('error'); if (e) { try { history.replaceState(null, '', location.pathname); } catch (x) {} } return telaLogin(e ? `<div class="msg err">Não foi possível entrar: ${esc(e.replace(/\+/g, ' '))}</div>` : ''); }
  sessao = s;
  telaAuth('<div class="msg">Verificando permissões…</div>');
  const [ra, rp] = await Promise.all([sb.from('admins').select('user_id').eq('user_id', s.user.id).maybeSingle(), sb.from('perfis').select('papel').eq('user_id', s.user.id).maybeSingle()]);
  admin = !!ra.data && !ra.error;
  papel = rp.data && rp.data.papel ? rp.data.papel : 'aluno';
  if (!educador()) {
    telaAuth(`<div class="msg err">Login ok, mas <b>${esc(s.user.email)}</b> não é administrador, professor nem coordenador.<br><br>Peça a um administrador para definir seu papel na aba <b>Alunos</b> do painel. Para criar o primeiro admin, rode no SQL Editor do Supabase:<br><code>insert into public.admins (user_id) select id from auth.users where email = '${esc(s.user.email)}' on conflict do nothing;</code></div><button class="btn btn-outline full" id="sair">Sair</button>`);
    document.getElementById('sair').onclick = () => sb.auth.signOut();
    return;
  }
  if (!admin) { autoPub = false; V.view = 'turmas'; }
  telaAuth('<div class="msg">Carregando conteúdo…</div>');
  try { await carregar(); await carregarTurmas(); }
  catch (e) {
    telaAuth(`<div class="msg err">Erro ao carregar: ${esc(traduzErro(e.message))}</div><button class="btn btn-primary full" id="denovo">Tentar de novo</button><button class="btn btn-outline full" id="sair">Sair</button>`);
    document.getElementById('denovo').onclick = () => { mostrando = ''; rota(s); };
    document.getElementById('sair').onclick = () => sb.auth.signOut();
    return;
  }
  shell.className = ''; render(); if (admin) carregarMetricas();
  agendarPublicacao();
}

function resumoQ(q) {
  const x = q.dados || {};
  if (q.tipo === 'tf') return esc(x.stmt);
  if (q.tipo === 'mc') return 'Correta: ' + esc((x.opts || [])[x.a || 0]);
  if (q.tipo === 'bank') return 'Lacunas: ' + esc((x.a || []).join(', '));
  if (q.tipo === 'order') return esc((x.items || []).join(' → '));
  if (q.tipo === 'match') return esc((x.pairs || []).map(p => p[0] + ' ↔ ' + p[1]).join(' · '));
  return '';
}

async function buscarAlunos() {
  V.alunos.carregando = true; V.alunos.erro = null; V.alunos.sel = {}; render();
  const {data, error} = await sb.rpc('alunos_admin', {p_busca: V.alunos.busca.trim(), p_limite: 100});
  V.alunos.carregando = false;
  if (error) { V.alunos.erro = traduzErro(error.message); V.alunos.lista = []; } else V.alunos.lista = data || [];
  render();
}
function darRecursos(ids) {
  const alunos = (V.alunos.lista || []).filter(a => ids.includes(a.user_id));
  const quem = alunos.length === 1 ? alunos[0].nome : alunos.length + ' alunos';
  const mx = D.param.economia.coracoes;
  V.modal = {titulo: 'Adicionar moedas e corações', texto: `Para <b>${esc(quem)}</b>. Deixe em branco o que não quiser mudar; valores negativos tiram. Corações ficam entre 0 e ${mx}; moedas nunca ficam abaixo de 0.`, ok: 'Aplicar', campos: [
    {k: 'moedas', label: 'Moedas', tipo: 'number', placeholder: 'ex.: 100'},
    {k: 'coracoes', label: `Corações (máx. ${mx})`, tipo: 'number', placeholder: 'ex.: 1'}
  ], fn: async v => {
    const moedas = Math.trunc(+v.moedas) || 0, coracoes = Math.trunc(+v.coracoes) || 0;

    await db(sb.rpc('conceder_recursos', {p_users: ids, p_moedas: moedas, p_coracoes: coracoes}));
    const partes = [];
    if (moedas) partes.push(`${moedas > 0 ? '+' : ''}${moedas} moeda${Math.abs(moedas) === 1 ? '' : 's'}`);
    if (coracoes) partes.push(`${coracoes > 0 ? '+' : ''}${coracoes} coraç${Math.abs(coracoes) === 1 ? 'ão' : 'ões'}`);
    toast(`${partes.join(' e ')} para ${quem}.`);

}

function setCampo(path, value) {
  const p = path.split('.');
  switch (p[0]) {
    case 'qf': V.qf[p[1]] = value; if (p[1] === 'materia') V.qf.unidade = ''; return 'ui';
    case 'atribuirBusca': V.atribuirBusca = value; return 'ui';
    case 'ativBusca': V.ativBusca[p[1]] = value; if (p[1] === 'materia') V.ativBusca.unidade = ''; return 'ui';
    case 'ativFiltroTurma': V.ativFiltroTurma = value; return 'ui';
    case 'ativ': { if (!V.ativ) return 'nada'; if (p[1] === 'questoes') { const q = V.ativ.questoes[+p[2]]; if (q && p[3] === 'valor') q.valor = Math.max(0, +String(value).replace(',', '.') || 0); return 'nada'; } V.ativ[p[1]] = value; return 'nada'; }
    case 'turma': { const t = turmaPorId(p[1]); if (!t) return 'nada'; t[p[2]] = value; agendar(path, () => db(sb.from('turmas').update({[p[2]]: value}).eq('id', t.id))); return 'dados'; }
    case 'alunos': V.alunos.busca = value; return 'nada';
    case 'notaPub': V.notaPub = value; return 'nada';
    case 'rascunho': setIn(V.rascunho, p.slice(1), value); return 'rascunho';
    case 'materia': { const m = materiaPorId(V.materia); if (!m) return 'nada'; m[p[1]] = value; agendar(path, () => db(sb.from('materias').update({[p[1]]: value}).eq('id', m.id))); return 'dados'; }
    case 'secao': case 'unidade': case 'licao': {
      const tabela = {secao: 'secoes', unidade: 'unidades', licao: 'licoes'}[p[0]]; const r = D[tabela].find(x => x.id === p[1]); if (!r) return 'nada';
      r[p[2]] = value; agendar(path, () => db(sb.from(tabela).update({[p[2]]: value}).eq('id', p[1]))); return 'dados';
    }
    case 'missao': { const r = D.missoes.find(x => x.id === p[1]); if (!r) return 'nada'; const v = p[2] === 'meta' ? Math.max(1, +value || 1) : value; r[p[2]] = v; agendar(path, () => db(sb.from('missoes').update({[p[2]]: v}).eq('id', r.id))); return 'dados'; }
    case 'loja': { const r = D.loja.find(x => x.id === p[1]); if (!r) return 'nada'; const v = p[2] === 'preco' ? Math.max(0, +value || 0) : value; r[p[2]] = v; agendar(path, () => db(sb.from('itens_loja').update({[p[2]]: v}).eq('id', r.id))); return 'dados'; }
    case 'param': { const g = p[1]; setIn(D.param[g], p.slice(2), value); agendar('param.' + g, () => salvarParam(g)); return 'dados'; }
  }
  return 'nada';
}
const salvarParam = g => db(sb.from('parametros').upsert({chave: g, valor: D.param[g], atualizado_em: agora()}));

   ===================================================================== */
function reduzirImagem(file) {
  return new Promise(resolve => {
    if (file.type === 'image/gif' || file.size < 400 * 1024) return resolve(file);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = file.type === 'image/png';
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b ? new File([b], file.name, {type: png ? 'image/png' : 'image/jpeg'}) : file); }, png ? 'image/png' : 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function enviarImagem(file) {
  if (!V.rascunho) return;
  if (file.size > 3 * 1024 * 1024) return toast('Imagem acima de 3 MB. Reduza antes de enviar.');
  V.rascunho.enviando = true; render();
  try {
    const f = await reduzirImagem(file);
    const ext = f.type === 'image/png' ? 'png' : f.type === 'image/webp' ? 'webp' : f.type === 'image/gif' ? 'gif' : 'jpg';
    const caminho = `questoes/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const {error} = await sb.storage.from('imagens').upload(caminho, f, {contentType: f.type, cacheControl: '31536000', upsert: false});
    if (error) throw error;
    const {data} = sb.storage.from('imagens').getPublicUrl(caminho);

  } catch (e) { toast('Erro ao enviar imagem: ' + traduzErro(e.message)); }

   ===================================================================== */
async function importarSeed() {
  const S = window.FJ_SEED; if (!S) return toast('Arquivo seed.js não carregou.');
  if (D.materias.length) return toast('O banco já tem matérias. A importação só funciona com o banco vazio.');
  toast('Importando… isso leva alguns segundos.');
  const chaves = {};
  await db(sb.from('materias').insert(S.materias.map(({id, nome, sigla, cor, ativa, ordem}) => ({id, nome, sigla, cor, ativa, ordem}))));
  const unidadesCriadas = [];
  for (const m of S.materias) for (const [si, sec] of m.secoes.entries()) {
    const s = await db(sb.from('secoes').insert({materia_id: m.id, titulo: sec.titulo, ordem: si}).select().single());
    for (const [ui, un] of sec.unidades.entries()) {
      const u = await db(sb.from('unidades').insert({secao_id: s.id, titulo: un.titulo, ordem: ui}).select().single());
      if (un.chave) chaves[un.chave] = u.id;
      let licoes = [];
      if (un.licoes.length) licoes = ordenar(await db(sb.from('licoes').insert(un.licoes.map((t, i) => ({unidade_id: u.id, titulo: t, ordem: i}))).select()));
      unidadesCriadas.push({id: u.id, licoes});
    }
  }
  const qs = await db(sb.from('questoes').insert(S.questoes.map(q => ({materia_id: q.materia, unidade_id: chaves[q.unidade] || null, tipo: q.tipo, enunciado: q.enunciado, dados: q.dados, explicacao: q.explicacao, status: q.status || 'publicada'}))).select());
  const lq = [];
  for (const un of unidadesCriadas) {
    const pool = qs.filter(q => q.unidade_id === un.id && q.status === 'publicada');
    if (!pool.length || !un.licoes.length) continue;
    un.licoes.forEach((l, i) => {
      const minhas = pool.length <= 8 ? pool : pool.filter((_, k) => k % un.licoes.length === i);
      minhas.forEach((q, j) => lq.push({licao_id: l.id, questao_id: q.id, ordem: j}));
    });
  }
  if (lq.length) await db(sb.from('licao_questoes').insert(lq));
  await carregar(); toast('Conteúdo inicial importado.'); render();
}

async function moverItem(tabela, id, dir) {
  const arr = D[tabela]; const r = arr.find(x => x.id === id); if (!r) return;
  const pai = {secoes: 'materia_id', unidades: 'secao_id', licoes: 'unidade_id'}[tabela];
  const irmaos = arr.filter(x => !pai || x[pai] === r[pai]);
  const i = irmaos.indexOf(r), j = i + dir; if (j < 0 || j >= irmaos.length) return;
  const antes = new Map(irmaos.map(x => [x.id, x.ordem]));
  irmaos.forEach((x, k) => { x.ordem = k; }); r.ordem = j; irmaos[j].ordem = i;
  ordenar(arr); render();
  const nome = tabela === 'loja' ? 'itens_loja' : tabela;
  const mudados = irmaos.filter(x => antes.get(x.id) !== x.ordem);
  await Promise.all(mudados.map(x => db(sb.from(nome).update({ordem: x.ordem}).eq('id', x.id))));
}

    /* missões */
    case 'nova-missao': { const row = await db(sb.from('missoes').insert({texto: 'Nova missão', tipo: 'xp', meta: 20, ativa: false, ordem: proximaOrdem(D.missoes)}).select().single()); D.missoes.push(row); return render(); }
    case 'toggle-missao': { const m = D.missoes.find(m => m.id === x); m.ativa = !m.ativa; render(); return db(sb.from('missoes').update({ativa: m.ativa}).eq('id', m.id)); }
    case 'excluir-missao': return confirmar('Excluir missão?', 'Ela deixa de ser sorteada a partir de amanhã.', async () => { await db(sb.from('missoes').delete().eq('id', x)); D.missoes = D.missoes.filter(m => m.id !== x); });
    case 'toggle-param': { const p = y.split('.'); let o = D.param[x]; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = !o[p[p.length - 1]]; render(); return salvarParam(x); }

    /* loja */
    case 'novo-item': V.modal = {titulo: 'Novo item da loja', texto: 'O código identifica o item no app. Só <code>congelador</code>, <code>recarga</code> e <code>plus</code> têm efeito hoje; outros códigos precisam de programação.', campos: [{k: 'codigo', label: 'Código (sem espaços)', placeholder: 'ex.: relampago_extra', obrigatorio: true}, {k: 'nome', label: 'Nome que o aluno vê', obrigatorio: true}], ok: 'Criar', fn: async v => {
      const codigo = v.codigo.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'item';
      if (D.loja.some(i => i.codigo === codigo)) return toast('Já existe um item com esse código.');
      const row = await db(sb.from('itens_loja').insert({codigo, nome: v.nome.trim(), tipo: 'moedas', preco: 100, ativo: false, ordem: proximaOrdem(D.loja)}).select().single());
      D.loja.push(row); toast('Item criado (fora da loja até você ativar).');
    }}; return render();
    case 'toggle-item': { const it = D.loja.find(i => i.id === x); it.ativo = !it.ativo; render(); return db(sb.from('itens_loja').update({ativo: it.ativo}).eq('id', it.id)); }
    case 'excluir-item': return confirmar('Excluir item da loja?', 'Se o app usa esse código, a compra deixa de funcionar.', async () => { await db(sb.from('itens_loja').delete().eq('id', x)); D.loja = D.loja.filter(i => i.id !== x); });

    /* alunos */
    case 'buscar-alunos': return buscarAlunos();
    case 'plus': { await db(sb.rpc('ativar_plus', {p_user: x, p_dias: +y})); toast(+y > 0 ? `Findout+ ativado por ${y} dias.` : 'Findout+ removido.'); return buscarAlunos(); }
    case 'sel-aluno': V.alunos.sel[x] = el.checked; return render();
    case 'sel-todos': { const marca = el.checked; (V.alunos.lista || []).forEach(a => { V.alunos.sel[a.user_id] = marca; }); return render(); }
    case 'dar': return darRecursos([x]);
    case 'dar-lote': { const ids = (V.alunos.lista || []).filter(a => V.alunos.sel[a.user_id]).map(a => a.user_id); if (!ids.length) return toast('Marque ao menos um aluno na lista.'); return darRecursos(ids); }
    case 'bloq': {
      const alvo = (V.alunos.lista || []).find(a => a.user_id === x), nome = alvo ? alvo.nome : 'o aluno';
      const fazer = async () => {
        const {error} = await sb.functions.invoke('bloquear-aluno', {body: {user_id: x, bloquear: y === '1'}});
        if (error) { let msg = 'Não deu para alterar. A função bloquear-aluno está publicada no Supabase?'; try { msg = (await error.context.json()).erro || msg; } catch (e) {} return toast(msg); }
        toast(y === '1' ? `${nome} foi bloqueado.` : `${nome} foi liberado.`); return buscarAlunos();
      };
      if (y === '1') return confirmar(`Bloquear ${nome}?`, 'A pessoa não consegue mais entrar no app, mas todos os dados (XP, moedas, progresso) ficam guardados. Dá para liberar de novo quando quiser.', fazer, 'Bloquear');
      return fazer();
    }
    case 'novo-aluno': V.modal = {titulo: 'Novo aluno', texto: 'A conta nasce confirmada, sem gastar e-mail do Supabase. Anote a senha e repasse ao aluno — ele pode trocá-la depois com "Esqueci a senha".', ok: 'Criar conta', campos: [
      {k: 'nome', label: 'Nome do aluno', obrigatorio: true, maxlength: 30},
      {k: 'email', label: 'E-mail', tipo: 'email', obrigatorio: true},
      {k: 'senha', label: 'Senha (mínimo 8 caracteres)', obrigatorio: true}
    ], fn: async v => {
      if (v.senha.length < 8) return toast('A senha precisa de pelo menos 8 caracteres.');
      const {error} = await sb.functions.invoke('criar-aluno', {body: {nome: v.nome.trim(), email: v.email.trim(), senha: v.senha}});
      if (error) { let msg = 'Não deu para criar a conta. A função "criar-aluno" está publicada no Supabase?'; try { msg = (await error.context.json()).erro || msg; } catch (e) {} return toast(msg); }
      toast(`Conta criada para ${v.nome.trim()}.`); return buscarAlunos();
    }}; return render();
    case 'admin': {
      const a = (V.alunos.lista || []).find(t => t.user_id === x); const nome = a ? a.nome : 'esta pessoa';
      if (y === '1') return confirmar(`Tornar ${nome} administrador?`, 'Ela poderá editar todo o conteúdo, publicar e gerenciar alunos neste painel.', async () => { await db(sb.rpc('definir_admin', {p_user: x, p_admin: true})); toast('Agora é administrador.'); await buscarAlunos(); }, 'Tornar admin');
      return confirmar(`Tirar o acesso de ${nome}?`, 'Ela continua como aluna no app, mas não entra mais no painel.', async () => { await db(sb.rpc('definir_admin', {p_user: x, p_admin: false})); toast('Acesso ao painel removido.'); await buscarAlunos(); }, 'Tirar acesso');
    }

    /* publicar */
    case 'publicar': return publicar(V.notaPub.trim());
    case 'toggle-autopub': autoPub = !autoPub; try { localStorage.setItem('fj-autopub', autoPub ? '1' : '0'); } catch (e) {} if (autoPub) agendarPublicacao(); return render();
    case 'ver-json': {
      if (x === 'atual') { V.jsonVersao = null; V.jsonTexto = ''; return render(); }
      const row = await db(sb.from('publicacoes').select('pacote').eq('versao', +x).single());
      V.jsonVersao = +x; V.jsonTexto = JSON.stringify(row.pacote, null, 2); return render();
    }
    case 'restaurar': return confirmar(`Voltar à versão ${x}?`, `Uma nova versão igual à v${x} será publicada e o app passa a ler esse conteúdo.`, async () => {
      const row = await db(sb.from('publicacoes').select('pacote').eq('versao', +x).single());
      const pacote = {...row.pacote, geradoEm: agora()};
      const nova = await db(sb.from('publicacoes').insert({pacote, nota: `Restaurada da v${x}`, criada_por: sessao.user.id}).select('versao, nota, criada_em').single());
      D.publicacoes.unshift(nova); D.ultimoPacote = pacote; V.jsonVersao = null; toast(`Versão ${nova.versao} publicada (igual à v${x}).`);
    }, 'Voltar');
    case 'copiar-json': { const t = document.getElementById('jsonout').textContent; (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('JSON copiado.')).catch(() => { const r = document.createRange(); r.selectNodeContents(document.getElementById('jsonout')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecionado: use Ctrl+C para copiar.'); }); return; }

    /* modais */
    case 'modal-cancelar': V.modal = null; return render();
    case 'modal-ok': { const Mo = V.modal; if (!Mo) return; const v = {}; Mo.campos.forEach(c => { v[c.k] = document.getElementById('md-' + c.k).value; }); if (Mo.campos.some(c => c.obrigatorio && !String(v[c.k]).trim())) return toast('Preencha todos os campos.'); V.modal = null; await Mo.fn(v); return render(); }
    case 'confirmar-nao': V.confirmar = null; return render();
    case 'confirmar-sim': { const C = V.confirmar; V.confirmar = null; render(); await C.fn(); return render(); }
  }
}
shell.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled || !D) return;
  if (el.tagName === 'SELECT') return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { act(el.dataset.a, el).catch(e => console.error(e)); return; }
  if (el.tagName === 'TR' && ev.target.closest('button, input, select, a')) return;
  if (el.tagName === 'FORM' || el.tagName === 'LABEL') return;
  if (el.type === 'submit' && el.dataset.a === 'modal-ok') return;
  act(el.dataset.a, el).catch(e => console.error(e));
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || !D) return;
  if (V.modal || V.confirmar || V.modalPrev) { V.modal = null; V.confirmar = null; V.modalPrev = null; return render(); }
  if (V.rascunho || V.licaoAtribuir) { V.rascunho = null; V.licaoAtribuir = null; return render(); }
  if (V.ativ) { V.ativ = null; return render(); }
});

/* =====================================================================
   Início
   ===================================================================== */
telaAuth('<div class="msg">Carregando…</div>');
sb.auth.onAuthStateChange((ev, s) => {
  if (ev === 'PASSWORD_RECOVERY') { mostrando = 'recuperar'; telaNovaSenha(); return; }
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(s);
});
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => rota(null));
})();
</script>
</body>
