<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Findout Jornada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{--bg:#F4F4FE;--surface:#fff;--line:#E4DFF7;--line2:#C5C9E3;--fg:#010F2E;--fg2:#444D69;--muted:#6F7172;--primary:#503C9D;--primary-d:#3A2A72;--primary-l:#EAEDFF;--teal:#4CC3C1;--teal-d:#0B6E6C;--red-d:#B8313F;--red-l:#FBE4E6;--green-l:#EAF3DF;--green-d:#2F5A14}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center;padding:24px 16px}
h1{font-family:Jost,sans-serif;font-size:22px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:40px;height:40px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',Jost,monospace;font-weight:700;font-size:13px}
.brand small{display:block;color:var(--muted);font-size:12px}
label{font-size:12px;font-weight:600;color:var(--fg2);display:block;margin-bottom:5px}
input{width:100%;height:42px;padding:0 12px;border:1.5px solid var(--line2);border-radius:10px;font:inherit}
input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-l)}
button{font:inherit;cursor:pointer}
.btn{height:44px;border-radius:10px;border:1.5px solid transparent;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-d)}
.btn-outline{background:#fff;border-color:var(--line2);color:var(--fg)}
.btn:disabled{opacity:.6;cursor:default}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4}
.msg.err{background:var(--red-l);color:var(--red-d)}.msg.ok{background:var(--green-l);color:var(--green-d)}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}.kv b{color:var(--muted);font-weight:500}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;padding:0;font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="app">
  <div class="brand"><span class="mark">FJ</span><div><h1>Painel Findout</h1><small>Jornada · gestão de conteúdo</small></div></div>
  <div id="view"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(() => {
'use strict';
const sb = supabase.createClient(FJ_CONFIG.supabaseUrl, FJ_CONFIG.supabaseAnonKey);
const view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function telaLogin(msg = '') {
  view.innerHTML = `
    ${msg}
    <form id="f" style="display:flex;flex-direction:column;gap:12px">
      <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required minlength="6"></div>
      <button class="btn btn-primary" id="entrar">Entrar</button>
      <div class="sep">ou</div>
      <button type="button" class="btn btn-outline" id="google"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-3.9V7.5H3.1a10 10 0 0 0 0 9z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.5L6.4 10c.8-2.3 3-4 5.6-4z"/></svg>Entrar com Google</button>
      <button type="button" class="link" id="esqueci">Esqueci a senha</button>
    </form>`;
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const b = document.getElementById('entrar'); b.disabled = true; b.textContent = 'Entrando…';
    const {error} = await sb.auth.signInWithPassword({email: email.value.trim(), password: senha.value});
    if (error) { telaLogin(`<div class="msg err">${esc(traduz(error.message))}</div>`); document.getElementById('email').value = email.value; }
  };
  document.getElementById('google').onclick = () => sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  document.getElementById('esqueci').onclick = async () => {
    const em = document.getElementById('email').value.trim();
    if (!em) return telaLogin('<div class="msg err">Digite o e-mail primeiro e clique de novo em "Esqueci a senha".</div>');
    const {error} = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname});
    telaLogin(error ? `<div class="msg err">${esc(traduz(error.message))}</div>` : '<div class="msg ok">Enviamos um link para redefinir a senha. Confira seu e-mail.</div>');
  };
}
function traduz(m) {
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Espere um minuto.';
  return m;
}

async function telaLogado(session) {
  view.innerHTML = '<div class="msg">Verificando permissões…</div>';
  const {data: admin} = await sb.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  const [{count: nq}, {count: nm}, {data: pub}] = await Promise.all([
    sb.from('questoes').select('*', {count: 'exact', head: true}),
    sb.from('materias').select('*', {count: 'exact', head: true}),
    sb.from('publicacoes').select('versao, criada_em').order('versao', {ascending: false}).limit(1).maybeSingle()
  ]);
  view.innerHTML = `
    <div class="msg ${admin ? 'ok' : 'err'}">${admin ? 'Você é administrador. Login e banco funcionando.' : 'Login ok, mas este usuário não é administrador. Rode o INSERT em public.admins para o e-mail ' + esc(session.user.email) + '.'}</div>
    <div class="kv">
      <b>Usuário</b><span>${esc(session.user.email)}</span>
      <b>Matérias</b><span>${nm ?? '—'}</span>
      <b>Questões</b><span>${nq ?? '—'}</span>
      <b>Conteúdo publicado</b><span>${pub ? 'v' + pub.versao : 'nenhuma versão ainda'}</span>
    </div>
    <p style="margin:0;color:var(--muted);font-size:13px">O painel completo (trilhas, questões, missões, publicar) entra nas semanas 2 e 3.</p>
    <button class="btn btn-outline" id="sair">Sair</button>`;
  document.getElementById('sair').onclick = () => sb.auth.signOut();
}

let mostrando = '';
function rota(session) { const alvo = session ? 'inicio:' + session.user.id : 'login'; if (alvo === mostrando) return; mostrando = alvo; if (session) telaLogado(session); else telaLogin(); }
rota(null);
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => {});
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(session); });
})();
</script>
</body>
</html>
