<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#010F2E">
<title>Painel · Findout Jornada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#F4F4FE;--surface:#FFFFFF;--surface2:#EAEDFF;--line:#E4DFF7;--line2:#C5C9E3;
  --fg:#010F2E;--fg2:#444D69;--muted:#6F7172;
  --primary:#503C9D;--primary-d:#3A2A72;--primary-l:#EAEDFF;--navy:#010F2E;
  --teal:#4CC3C1;--teal-d:#0B6E6C;--teal-l:#DDF3F3;--green:#8FB569;--green-d:#2F5A14;--green-l:#EAF3DF;
  --gold:#FFD36A;--gold-d:#8A6207;--gold-l:#FFF8E1;--red:#E0475B;--red-d:#B8313F;--red-l:#FBE4E6;--orange:#F08A24;--orange-d:#C8571D;
  --side:#010F2E;--side-fg:#C5C9E3;--side-active:#503C9D;
  --f-display:'Jost',system-ui,sans-serif;--f-body:'Roboto',system-ui,sans-serif;--f-pixel:'Press Start 2P',monospace;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.55}
a{color:var(--primary)}
code{font-size:12px;background:var(--surface2);padding:2px 5px;border-radius:5px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:600}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.px{font-family:var(--f-pixel);font-size:8px;letter-spacing:.02em}
[hidden]{display:none!important}

#shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
#shell.auth{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{width:100%;max-width:400px;padding:28px;display:flex;flex-direction:column;gap:16px}
.login .brand{color:var(--fg);padding:0 0 4px}
.login .brand small{color:var(--muted)}
.login h1{font-size:22px}
aside{background:linear-gradient(180deg,#070C22 0%,var(--side) 40%,#1A1F4B 100%);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--side-fg)}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--side-fg);width:100%;text-align:left;font-weight:500}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.navbtn .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:10px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--side-fg);padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px}
.sidefoot button{color:var(--side-fg);text-align:left;text-decoration:underline}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
body{background-image:radial-gradient(700px 300px at 70% -80px,rgba(142,127,207,.16),transparent 70%)}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;border:1.5px solid transparent}
.btn-primary{background:linear-gradient(180deg,#6450B8,var(--primary) 60%,#47358C);color:#fff;box-shadow:0 4px 12px rgba(80,60,157,.25)}
.btn-primary:hover{background:linear-gradient(180deg,#5A47B0,var(--primary-d))}
.btn-outline{border-color:var(--primary);color:var(--primary);background:var(--surface)}
.btn-ghost{color:var(--fg2)}
.btn-ghost:hover{background:var(--surface2)}
.btn-danger{color:var(--red-d);border-color:var(--red-d)}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn-xs{height:24px;padding:0 6px;font-size:11px;border-radius:6px}
.btn-teal{background:var(--teal);color:var(--navy)}
.btn.full{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 16px rgba(1,15,46,.05)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 16px rgba(1,15,46,.05);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--teal),var(--primary))}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.tile .hint{font-size:12px;color:var(--fg2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.rowbtn{cursor:pointer}
tr.rowbtn:hover td{background:var(--surface2)}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.pub{background:var(--green-l);color:var(--green-d)}
.pill.draft{background:var(--gold-l);color:var(--gold-d)}
.pill.off{background:var(--surface2);color:var(--muted)}
.pill.type{background:var(--primary-l);color:var(--primary)}
.pill.on{background:var(--teal-l);color:var(--teal-d)}
.abbr{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-pixel);font-size:8px;color:#fff;flex-shrink:0}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}

.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:12px;font-weight:600;color:var(--fg2)}
.inp{height:38px;padding:0 11px;border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);width:100%;min-width:0}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--primary);outline:0;box-shadow:0 0 0 3px var(--primary-l)}
.inp.sm{height:32px;font-size:13px}
input[type=color].inp{padding:2px 4px;width:48px}
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.toggle{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line2);flex-shrink:0;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--teal)}
.toggle[aria-checked="true"]::after{left:21px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .inp{width:auto}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column}
.list>button,.list>div.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.list>button:hover{background:var(--surface2)}
.list>button[aria-current="true"]{background:var(--primary-l);font-weight:600}
.list>:last-child{border-bottom:0}
.tree{display:flex;flex-direction:column;gap:10px}
.sec{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sec-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface2);flex-wrap:wrap}
.unit{padding:8px 14px 10px 28px;border-top:1px solid var(--line)}
.unit-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.lesson{display:flex;align-items:center;gap:8px;padding:6px 0 6px 22px;font-size:13px;flex-wrap:wrap}
.lesson .qn{font-size:11px;color:var(--muted)}
.lesson .qn.warn{color:var(--orange-d);font-weight:600}
.inline-edit{border:0;border-bottom:1.5px dashed var(--line2);background:transparent;padding:2px 4px;min-width:120px;flex:1}
.inline-edit:focus{border-bottom-color:var(--primary);outline:0}
.mv{display:inline-flex;gap:2px}
.mv button{width:22px;height:22px;border-radius:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.mv button:hover{background:var(--surface2);color:var(--fg)}

.drawer-bg{position:fixed;inset:0;background:rgba(1,15,46,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--bg);z-index:21;display:grid;grid-template-columns:1fr 360px;overflow:hidden;box-shadow:-8px 0 30px rgba(1,15,46,.25)}
@media (max-width:860px){.drawer{grid-template-columns:1fr}.drawer .prevcol{display:none}}
.drawer .formcol{overflow-y:auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:16px}
.drawer .prevcol{background:var(--surface2);border-left:1px solid var(--line);padding:22px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.drawer-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drawer-h .right{margin-left:auto;display:flex;gap:8px}
.optrow{display:flex;align-items:center;gap:8px}
.optrow input[type=radio]{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
.typegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.typebtn{border:1.5px solid var(--line2);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.typebtn b{font-size:13px}.typebtn span{font-size:11px;color:var(--muted)}
.typebtn[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-l)}
.imgbox{border:1.5px dashed var(--line2);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.imgbox img{max-width:180px;max-height:120px;border-radius:8px;border:1px solid var(--line)}
.imgbox .hint{font-size:12px;color:var(--muted)}

.phone{width:300px;background:#F4F4FE;color:#010F2E;border:8px solid #010F2E;border-radius:30px;overflow:hidden;font-family:var(--f-body);display:flex;flex-direction:column;min-height:520px;flex-shrink:0}
.phone .ph{padding:12px 12px 8px;background:#fff;border-bottom:1px solid #E4DFF7;display:flex;align-items:center;gap:8px}
.phone .pb{flex:1;height:10px;background:#E4DFF7}.phone .pb i{display:block;width:45%;height:100%;background:#503C9D}
.phone .pm{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.phone .tag{font-family:var(--f-pixel);font-size:7px;border:1px solid #503C9D;border-radius:2px;padding:3px 5px;align-self:flex-start}
.phone .q{font-size:15px;font-weight:700;line-height:1.3}
.phone .qimg{width:100%;max-height:150px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid #E4DFF7}
.phone .opt{min-height:40px;border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #E4DFF7;border-bottom-width:4px;font-size:13px}
.phone .opt.ok{border-color:#5E8A3B;background:#EAF3DF}
.phone .opt .lt{width:22px;height:22px;border-radius:6px;border:1.5px solid #503C9D;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:11px;flex-shrink:0}
.phone .chip{display:inline-flex;align-items:center;min-height:32px;padding:4px 10px;border-radius:8px;border:2px solid #E4DFF7;border-bottom-width:3px;background:#fff;font-family:var(--f-display);font-weight:600;font-size:13px}
.phone .chips{display:flex;flex-wrap:wrap;gap:6px}
.phone .stmt{background:#fff;border:1px solid #E4DFF7;border-radius:12px;padding:14px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.phone .foot{padding:10px 14px;border-top:2px solid #E4DFF7;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.phone .foot span{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.phone .mg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.phone .slot{display:inline-block;min-width:70px;border-bottom:2px solid #503C9D;background:#EAEDFF;border-radius:6px;padding:0 6px;font-weight:600;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:4px 4px 0 var(--teal);max-width:calc(100% - 32px)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.barrow .bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.barrow .bar i{display:block;height:100%;background:var(--primary);border-radius:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px}
.kv b{font-family:var(--f-display)}
pre.json{margin:0;background:var(--navy);color:#C5C9E3;padding:14px;border-radius:10px;font-size:11.5px;line-height:1.45;overflow:auto;max-height:420px}
.checklist{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:8px}
.checklist label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.checklist label:hover{background:var(--surface2)}
.checklist input{accent-color:var(--primary);width:16px;height:16px}
.warnbox{background:var(--gold-l);color:var(--gold-d);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.okbox{background:var(--teal-l);color:var(--teal-d)}
.msg{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.4;background:var(--surface2)}
.msg.err{background:var(--red-l);color:var(--red-d)}.msg.ok{background:var(--green-l);color:var(--green-d)}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.link{background:none;border:0;color:var(--primary);text-decoration:underline;padding:0;font-size:13px}
.modal{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));z-index:30;padding:20px;display:flex;flex-direction:column;gap:14px}

@media (max-width:760px){
  #shell{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px 16px;gap:4px}
  .brand{width:100%;padding-bottom:8px}
  .navbtn{width:auto;padding:8px 10px;font-size:13px}.navbtn .cnt{display:none}
  .sidefoot{display:none}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .barrow{grid-template-columns:100px 1fr 36px}
}
</style>
</head>
<body>
<div id="shell" class="auth"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script>
(() => {
'use strict';
const sb = supabase.createClient(FJ_CONFIG.supabaseUrl, FJ_CONFIG.supabaseAnonKey);
const shell = document.getElementById('shell');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = iso => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}); };
const fmtDia = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';
const agora = () => new Date().toISOString();
const TIPOS = {mc: 'Múltipla escolha', tf: 'Verdadeiro ou falso', bank: 'Completar a frase', order: 'Ordenar', match: 'Associar pares'};
const TIPO_DESC = {mc: '4 alternativas, 1 correta', tf: 'Afirmação para julgar', bank: '2 lacunas + banco de palavras', order: 'Itens na ordem certa', match: '4 pares para ligar'};
const TIPOS_MISSAO = {xp: 'Ganhar XP', combo: 'Acertos seguidos', materias: 'Matérias diferentes', licoes: 'Lições concluídas', perfeita: 'Lições perfeitas', revisao: 'Revisão diária', minutos: 'Minutos praticando'};
const DIFICULDADES = {1: 'Fácil', 2: 'Média', 3: 'Difícil'};
const PADRAO = {
  economia: {coracoes: 5, horasCoracao: 5, custoRecarga: 350, custoCongelador: 200, maxCongeladores: 2, xpLicao: 15, xpPratica: 5, xpExercicio: 10, comboAPartirDe: 3, bonusCombo: 5, bonusPerfeita: 5, moedasLicao: 10, moedasBau: 25, xpLendaria: 40, moedasLendaria: 100, xpPular: 20, moedasPular: 20, acertosPular: 4, questoesPular: 5, tamanhoLicao: 5, segundosRelampago: 120, multiplicadorRelampago: 2, xpRevisao: 20, moedasRevisao: 10, tamanhoRevisao: 8, xpErros: 10, moedasIniciais: 100},
  ligas: {tamanho: 15, sobem: 7, caem: 5, moedasTop3: 200, niveis: ['Bronze', 'Prata', 'Ouro', 'Safira', 'Rubi', 'Esmeralda', 'Diamante']},
  missoes: {porDia: 3, moedasBauDiario: 50, mensal: {titulo: 'Desafio do mês', metaXp: 1500, moedas: 150, distintivo: 'Mensal', ativo: true}, dupla: {ativo: false, licoes: 20, dias: 5, moedas: 100}, revisao: {ativo: true, tamanho: 8, xp: 20}}
};

const I = {
  home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>',
  path: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M6 7.5v3a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3"/></svg>',
  q: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
  target: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',

let toastTimer;

  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }

function traduzErro(m) {
  m = String(m || '');
  if (/jwt expired/i.test(m)) return 'Sua sessão expirou. Saia e entre de novo.';
  if (/row-level security|permission denied|42501/i.test(m)) return 'Sem permissão. Este usuário é administrador?';
  if (/function .* does not exist|schema cache/i.test(m)) return 'Função não existe no banco. Rode a migration 0003 no SQL Editor.';
  if (/column .* does not exist/i.test(m)) return 'Coluna não existe no banco. Rode a migration 0003 no SQL Editor.';
  if (/bucket not found/i.test(m)) return 'Bucket de imagens não existe. Rode a migration 0003 no SQL Editor.';
  if (/invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'Confirme seu e-mail antes de entrar.';
  if (/rate limit/i.test(m)) return 'Muitas tentativas. Espere um minuto.';
  if (/failed to fetch|networkerror/i.test(m)) return 'Sem conexão com o servidor.';
  return m;
}
function statusHtml() {

}

/* Publicação automática: qualquer alteração vira uma nova versão alguns segundos depois */

}
async function publicar(nota) {

const pendentes = new Map();
function agendar(chave, fn) { clearTimeout(pendentes.get(chave)); pendentes.set(chave, setTimeout(() => { pendentes.delete(chave); fn().catch(() => {}); }, 600)); }
function ordenar(arr) { arr.sort((a, b) => (a.ordem - b.ordem) || String(a.titulo || a.nome || a.texto || '').localeCompare(String(b.titulo || b.nome || b.texto || ''), 'pt-BR')); return arr; }
function canon(v) { if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']'; if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}'; return JSON.stringify(v); }
function setIn(obj, p, value) { let o = obj; for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; } const k = p[p.length - 1]; o[k] = typeof o[k] === 'number' ? +value : (typeof o[k] === 'boolean' ? value === '1' || value === true : value); }
function slug(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

async function carregar() {
  const r = await Promise.all([
    sb.from('materias').select('*').order('ordem').order('nome'),
    sb.from('secoes').select('*').order('ordem'),
    sb.from('unidades').select('*').order('ordem'),
    sb.from('licoes').select('*').order('ordem'),
    sb.from('questoes').select('*').order('criada_em', {ascending: false}),
    sb.from('licao_questoes').select('*').order('ordem'),
    sb.from('missoes').select('*').order('ordem'),
    sb.from('itens_loja').select('*').order('ordem'),
    sb.from('parametros').select('*'),
    sb.from('publicacoes').select('versao, nota, criada_em').order('versao', {ascending: false}).limit(30),
    sb.from('publicacoes').select('versao, pacote').order('versao', {ascending: false}).limit(1).maybeSingle()
  ]);
  const erro = r.find(x => x.error); if (erro) throw erro.error;
  const [m, s, u, l, q, lq, mi, lo, pa, pu, ult] = r.map(x => x.data);
  const param = {};
  pa.forEach(p => { param[p.chave] = p.valor; });
  ['economia', 'ligas', 'missoes'].forEach(k => { param[k] = Object.assign(JSON.parse(JSON.stringify(PADRAO[k])), param[k] || {}); });
  D = {materias: m, secoes: s, unidades: u, licoes: l, questoes: q, licaoQuestoes: lq, missoes: mi, loja: lo, param, publicacoes: pu, ultimoPacote: ult ? ult.pacote : null};
  if (!V.materia || !D.materias.some(x => x.id === V.materia)) V.materia = D.materias[0] ? D.materias[0].id : null;
}
async function carregarMetricas() {
  const {data, error} = await sb.rpc('metricas_admin');
  V.metricas = error ? null : data; V.metricasErro = error ? traduzErro(error.message) : null;
  if (V.view === 'inicio') render();
}

/* helpers de árvore */
const materiaPorId = id => D.materias.find(m => m.id === id);
const secoesDe = mid => D.secoes.filter(s => s.materia_id === mid);
const unidadesDe = sid => D.unidades.filter(u => u.secao_id === sid);
const licoesDe = uid => D.licoes.filter(l => l.unidade_id === uid);
const questoesDaLicao = lid => D.licaoQuestoes.filter(x => x.licao_id === lid).sort((a, b) => a.ordem - b.ordem).map(x => x.questao_id);
function unidadeInfo(uid) { const u = D.unidades.find(x => x.id === uid); if (!u) return null; const s = D.secoes.find(x => x.id === u.secao_id); const m = s && materiaPorId(s.materia_id); return m ? {m, s, u} : null; }
const todasUnidades = () => D.materias.flatMap(m => secoesDe(m.id).flatMap(s => unidadesDe(s.id).map(u => ({m, s, u}))));
function licaoInfo(lid) { const l = D.licoes.find(x => x.id === lid); const x = l && unidadeInfo(l.unidade_id); return x ? {...x, l} : null; }
const todasLicoes = () => todasUnidades().flatMap(x => licoesDe(x.u.id).map(l => ({...x, l})));
const tamLicao = () => Math.max(1, +D.param.economia.tamanhoLicao || 5);
const proximaOrdem = arr => arr.reduce((n, x) => Math.max(n, (x.ordem ?? -1) + 1), 0);

/* =====================================================================
   Pacote publicado (contrato lido pelo app)
   ===================================================================== */
function montarPacote() {
  const pub = D.questoes.filter(q => q.status === 'publicada');
  const ids = new Set(pub.map(q => q.id));
  return {
    materias: D.materias.filter(m => m.ativa).map(m => ({id: m.id, nome: m.nome, sigla: m.sigla, cor: m.cor,
      secoes: secoesDe(m.id).map(s => ({id: s.id, titulo: s.titulo,
        unidades: unidadesDe(s.id).map(u => ({id: u.id, titulo: u.titulo,
          licoes: licoesDe(u.id).map(l => ({id: l.id, titulo: l.titulo, descricao: l.descricao || '', questoes: questoesDaLicao(l.id).filter(id => ids.has(id))}))}))}))})),
    questoes: pub.map(q => ({id: q.id, materia: q.materia_id, unidade: q.unidade_id, tipo: q.tipo, enunciado: q.enunciado, imagem: q.imagem_url || null, dados: q.dados, explicacao: q.explicacao})),
    missoes: {diarias: D.missoes.filter(x => x.ativa).map(x => ({id: x.id, texto: x.texto, tipo: x.tipo, meta: x.meta})), ...D.param.missoes},
    economia: D.param.economia,
    ligas: D.param.ligas,
    loja: D.loja.filter(i => i.ativo).map(i => ({codigo: i.codigo, nome: i.nome, tipo: i.tipo, preco: i.preco, rotulo: i.rotulo_preco || null}))
  };
}
function alteracoesPendentes() {
  if (!D) return false;
  if (!D.ultimoPacote) return D.materias.length > 0;
  const limpo = p => { const {geradoEm, versao, ...resto} = p; return resto; };
  return canon(limpo(montarPacote())) !== canon(limpo(D.ultimoPacote));
}

async function rota(s) {
  const alvo = s ? 'in:' + s.user.id : 'out';
  if (alvo === mostrando) return; mostrando = alvo;
  if (!s) { sessao = null; D = null; admin = false; const h = new URLSearchParams((location.hash || '').replace(/^#/, '')), q = new URLSearchParams(location.search); const e = h.get('error_description') || q.get('error_description') || h.get('error') || q.get('error'); if (e) { try { history.replaceState(null, '', location.pathname); } catch (x) {} } return telaLogin(e ? `<div class="msg err">Não foi possível entrar: ${esc(e.replace(/\+/g, ' '))}</div>` : ''); }

  if (q.tipo === 'bank') return 'Lacunas: ' + esc((x.a || []).join(', '));
  if (q.tipo === 'order') return esc((x.items || []).join(' → '));

function novoRascunho(tipo = 'mc', materia_id = null, unidade_id = null) {
  return {id: null, tipo, materia_id, unidade_id, status: 'rascunho', enunciado: '', explicacao: '', imagem_url: null, fonte: '', dificuldade: 2, opts: ['', '', '', ''], a: 0, stmt: '', parts: ['', '', ''], ans: ['', ''], extra: ['', ''], items: ['', '', '', ''], pairs: [['', ''], ['', ''], ['', ''], ['', '']], enviando: false};
}
function rascunhoDe(q) {
  const d = novoRascunho(q.tipo, q.materia_id, q.unidade_id); const x = q.dados || {};
  d.id = q.id; d.status = q.status; d.enunciado = q.enunciado || ''; d.explicacao = q.explicacao || ''; d.imagem_url = q.imagem_url || null; d.fonte = x.fonte || ''; d.dificuldade = x.dificuldade || 2;
  const completa = (arr, min, vazio) => { const a = (arr || []).map(v => Array.isArray(v) ? v.slice() : v); while (a.length < min) a.push(Array.isArray(vazio) ? vazio.slice() : vazio); return a; };
  if (q.tipo === 'mc') { d.opts = completa(x.opts, 4, ''); d.a = +x.a || 0; }
  if (q.tipo === 'tf') { d.stmt = x.stmt || ''; d.a = !!x.a; }
  if (q.tipo === 'bank') { d.parts = completa(x.parts, 3, ''); d.ans = completa(x.a, 2, ''); d.extra = completa(x.extra, 2, ''); }
  if (q.tipo === 'order') d.items = completa(x.items, 4, '');
  if (q.tipo === 'match') d.pairs = completa(x.pairs, 4, ['', '']);
  return d;
}
function rascunhoParaLinha(d, status) {
  const t = s => String(s || '').trim();
  let dados;
  if (d.tipo === 'mc') dados = {opts: d.opts.map(t), a: +d.a || 0};
  else if (d.tipo === 'tf') dados = {stmt: t(d.stmt), a: !!d.a};
  else if (d.tipo === 'bank') dados = {parts: d.parts.map(p => String(p || '')), a: d.ans.map(t), extra: d.extra.map(t).filter(Boolean)};
  else if (d.tipo === 'order') dados = {items: d.items.map(t).filter(Boolean)};
  else dados = {pairs: d.pairs.map(p => [t(p[0]), t(p[1])]).filter(p => p[0] && p[1])};
  if (t(d.fonte)) dados.fonte = t(d.fonte);
  if (+d.dificuldade) dados.dificuldade = +d.dificuldade;
  return {materia_id: d.materia_id, unidade_id: d.unidade_id || null, tipo: d.tipo, enunciado: t(d.enunciado), explicacao: t(d.explicacao), imagem_url: d.imagem_url || null, dados, status, atualizada_em: agora()};
}
function validar(d) {
  const e = []; const t = s => String(s || '').trim();
  if (!t(d.enunciado)) e.push('Escreva o enunciado.');
  if (!d.materia_id) e.push('Escolha a matéria.');
  if (!d.unidade_id) e.push('Escolha a unidade.');
  if (d.tipo === 'mc' && d.opts.some(o => !t(o))) e.push('Preencha as 4 alternativas.');
  if (d.tipo === 'tf' && !t(d.stmt)) e.push('Escreva a afirmação a ser julgada.');
  if (d.tipo === 'bank' && (d.ans.some(x => !t(x)) || !t(d.parts[0]))) e.push('Preencha o texto e as duas respostas das lacunas.');
  if (d.tipo === 'order' && d.items.filter(x => t(x)).length < 3) e.push('Ordenar precisa de pelo menos 3 itens.');
  if (d.tipo === 'match' && d.pairs.filter(p => t(p[0]) && t(p[1])).length < 3) e.push('Associar precisa de pelo menos 3 pares.');
  if (!t(d.explicacao)) e.push('Escreva a explicação que aparece quando o aluno erra.');
  return e;
}

  return `<div class="phone"><div class="ph"><span>✕</span><span class="pb"><i></i></span><span style="color:#B8313F;font-weight:700;font-family:var(--f-display)">♥ 4</span></div>
    <div class="pm"><span class="tag">${TIPOS[d.tipo].toUpperCase()}</span><span class="q">${esc(d.enunciado) || '<i style="color:#9AA0BC">Enunciado da questão</i>'}</span>${d.imagem_url ? `<img class="qimg" src="${esc(d.imagem_url)}" alt="">` : ''}${corpo}</div>
    <div class="foot"><span style="border:2px solid #C5C9E3;color:#6F7172">Pular</span><span style="background:#503C9D;color:#fff">Verificar</span></div></div>`;
}

  if (d.tipo === 'order') formTipo = `<div class="field"><span class="lab">Itens na ordem correta (o app embaralha)</span>${d.items.map((x, i) => `<div class="optrow"><b class="num" style="width:16px;color:var(--muted)">${i + 1}</b><input class="inp sm" value="${esc(x)}" data-f="rascunho.items.${i}" placeholder="Item ${i + 1}"></div>`).join('')}<div><button class="btn btn-ghost btn-sm" data-a="rascunho-mais-item">${I.plus}Mais um item</button></div></div>`;
  if (d.tipo === 'match') formTipo = `<div class="field"><span class="lab">Pares (esquerda ↔ direita)</span>${d.pairs.map((p, i) => `<div class="optrow"><input class="inp sm" value="${esc(p[0])}" data-f="rascunho.pairs.${i}.0" placeholder="Esquerda ${i + 1}"><span style="color:var(--muted)">↔</span><input class="inp sm" value="${esc(p[1])}" data-f="rascunho.pairs.${i}.1" placeholder="Direita ${i + 1}"></div>`).join('')}</div>`;
  return `<div class="drawer-bg" data-a="fechar"></div><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dq-t">
    <div class="formcol">
      <div class="drawer-h"><h2 id="dq-t">${d.id ? 'Editar questão' : 'Nova questão'}</h2><span class="pill ${d.status === 'publicada' ? 'pub' : 'draft'}">${d.status === 'publicada' ? 'publicada' : 'rascunho'}</span><span class="right"><button class="btn btn-ghost" data-a="fechar" aria-label="Fechar">${I.close}</button></span></div>
      <div class="field"><span class="lab">Tipo de exercício</span><div class="typegrid">${Object.keys(TIPOS).map(t => `<button class="typebtn" aria-pressed="${d.tipo === t}" data-a="rascunho-tipo:${t}"><b>${TIPOS[t]}</b><span>${TIPO_DESC[t]}</span></button>`).join('')}</div></div>
      <div class="frow"><div class="field"><label for="f-mat">Matéria</label><select id="f-mat" class="inp" data-f="rascunho.materia_id">${D.materias.map(m => `<option value="${m.id}" ${d.materia_id === m.id ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}</select></div>
        <div class="field"><label for="f-uni">Unidade</label><select id="f-uni" class="inp" data-f="rascunho.unidade_id">${unidades.map(x => `<option value="${x.u.id}" ${d.unidade_id === x.u.id ? 'selected' : ''}>${esc(x.s.titulo)} · ${esc(x.u.titulo)}</option>`).join('')}${unidades.length ? '' : '<option value="">Esta matéria não tem unidades</option>'}</select></div></div>
      <div class="field"><label for="f-q">Enunciado</label><textarea id="f-q" class="inp" data-f="rascunho.enunciado" placeholder="Pergunta que o aluno vê">${esc(d.enunciado)}</textarea></div>
      <div class="field"><span class="lab">Imagem (opcional: gráfico, tabela, figura)</span><div class="imgbox">
        ${d.imagem_url ? `<img src="${esc(d.imagem_url)}" alt="Imagem da questão"><div style="display:flex;flex-direction:column;gap:6px"><button class="btn btn-outline btn-sm" data-a="trocar-imagem">Trocar imagem</button><button class="btn btn-ghost btn-sm btn-danger" style="border:0" data-a="remover-imagem">${I.trash}Remover</button></div>` : `<button class="btn btn-outline btn-sm" data-a="trocar-imagem" ${d.enviando ? 'disabled' : ''}>${d.enviando ? 'Enviando…' : 'Enviar imagem'}</button><span class="hint">PNG, JPG ou WebP até 3 MB. Imagens grandes são reduzidas automaticamente.</span>`}
        <input type="file" id="f-img" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      </div></div>
      ${formTipo}
      <div class="field"><label for="f-why">Explicação quando erra</label><textarea id="f-why" class="inp" data-f="rascunho.explicacao" placeholder="Resposta correta e o porquê, em uma ou duas frases">${esc(d.explicacao)}</textarea></div>
      <div class="frow"><div class="field"><label for="f-fonte">Fonte (opcional)</label><input id="f-fonte" class="inp sm" value="${esc(d.fonte)}" data-f="rascunho.fonte" placeholder="Ex.: ENEM 2019, adaptada"></div>
        <div class="field"><label for="f-dif">Dificuldade</label><select id="f-dif" class="inp sm" data-f="rascunho.dificuldade">${Object.entries(DIFICULDADES).map(([k, v]) => `<option value="${k}" ${+d.dificuldade === +k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
      <div class="warnbox" id="qerros" ${errs.length ? '' : 'hidden'}>${I.warn}<span>${errs.join(' ')}</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-primary" data-a="salvar-q:publicada" ${errs.length ? 'disabled' : ''}>${I.check}Salvar e publicar</button>
        <button class="btn btn-outline" data-a="salvar-q:rascunho">Salvar como rascunho</button>
        ${d.id ? `<button class="btn btn-ghost btn-danger" style="margin-left:auto" data-a="excluir-q">${I.trash}Excluir</button>` : ''}
      </div>
      <p style="margin:0;font-size:12px;color:var(--muted)">Questões publicadas entram no pacote na próxima vez que você clicar em Publicar. Rascunhos ficam só no painel.</p>
    </div>
    <div class="prevcol"><span class="lab" style="font-size:12px;font-weight:600;color:var(--fg2);align-self:flex-start">Prévia no celular</span><div id="qprev">${previaCelular(d)}</div><span style="font-size:12px;color:var(--muted);text-align:center">A alternativa verde é a correta. O app embaralha alternativas, itens e pares.</span></div>
  </div>`;
}
function drawerAtribuir() {
  const x = licaoInfo(V.licaoAtribuir); if (!x) return '';
  const atuais = questoesDaLicao(x.l.id);
  const busca = (V.atribuirBusca || '').trim().toLowerCase();
  const bate = q => !busca || (q.enunciado + ' ' + JSON.stringify(q.dados || {}) + ' ' + (q.explicacao || '')).toLowerCase().includes(busca);
  const pool = D.questoes.filter(q => q.unidade_id === x.u.id && bate(q));
  const outras = D.questoes.filter(q => q.materia_id === x.m.id && q.unidade_id !== x.u.id && bate(q));
  const demais = D.questoes.filter(q => q.materia_id !== x.m.id && bate(q));
  const ondeQ = q => { const u = unidadeInfo(q.unidade_id); const m = materiaPorId(q.materia_id); return `<span style="font-size:11px;color:var(--muted);white-space:nowrap">${m ? esc(m.sigla) : ''}${u ? ' · ' + esc(u.u.titulo) : ''}</span>`; };
  const linha = q => `<label><input type="checkbox" ${atuais.includes(q.id) ? 'checked' : ''} data-a="atribuir-toggle:${q.id}"><span class="pill type" style="font-size:10px">${TIPOS[q.tipo] || q.tipo}</span><span style="flex:1">${esc(q.enunciado)}${q.tipo === 'tf' ? ' · ' + esc((q.dados || {}).stmt) : ''}</span>${q.materia_id !== x.m.id || q.unidade_id !== x.u.id ? ondeQ(q) : ''}${q.status === 'rascunho' ? '<span class="pill draft">rascunho</span>' : ''}</label>`;
  return `<div class="drawer-bg" data-a="fechar"></div><div class="drawer" role="dialog" aria-modal="true" style="grid-template-columns:1fr;width:min(640px,100%)"><div class="formcol">
    <div class="drawer-h"><div><h2>Questões da lição</h2><div style="font-size:13px;color:var(--muted)">${esc(x.m.nome)} · ${esc(x.u.titulo)} · <b>${esc(x.l.titulo)}</b></div></div><span class="right"><button class="btn btn-ghost" data-a="fechar" aria-label="Fechar">${I.close}</button></span></div>
    <div class="field"><label for="f-ldesc">Descrição curta da lição (aparece no app)</label><input id="f-ldesc" class="inp sm" value="${esc(x.l.descricao || '')}" data-f="licao.${x.l.id}.descricao" placeholder="Ex.: Aprenda a somar frações com denominadores diferentes"></div>
    <div class="kv" style="background:var(--surface2);padding:10px 14px;border-radius:10px"><span>Selecionadas</span><b class="num">${atuais.length}</b><span>Tamanho da lição no app</span><b class="num">${tamLicao()}</b></div>
    ${atuais.length < tamLicao() ? `<div class="warnbox">${I.warn}<span>Com menos de ${tamLicao()} questões, o app completa a lição com outras questões publicadas da mesma unidade.</span></div>` : ''}
    <div class="field"><label for="f-abusca">Buscar no banco de questões</label><input id="f-abusca" class="inp sm" value="${esc(V.atribuirBusca || '')}" data-f="atribuirBusca" placeholder="Digite parte do enunciado, de uma alternativa ou da explicação"></div>
    <div class="field"><span class="lab">Desta unidade (${pool.length})</span><div class="checklist">${pool.map(linha).join('') || '<div class="empty">Nenhuma questão nesta unidade ainda.</div>'}</div></div>
    <div class="field"><span class="lab">Outras unidades de ${esc(x.m.nome)} (${outras.length})</span><div class="checklist">${outras.map(linha).join('') || '<div class="empty">Nenhuma.</div>'}</div></div>
    <div class="field"><span class="lab">Outras matérias (${demais.length})</span><div class="checklist">${demais.slice(0, 80).map(linha).join('') || '<div class="empty">Nenhuma.</div>'}${demais.length > 80 ? '<div class="empty">Mostrando 80. Use a busca para achar as outras.</div>' : ''}</div></div>
    <p style="margin:0;font-size:12px;color:var(--muted)">Uma questão pode estar em várias lições. Marque e desmarque à vontade; salva na hora.</p>
    <div style="display:flex;gap:8px"><button class="btn btn-primary" data-a="fechar">${I.check}Concluir</button><button class="btn btn-outline" data-a="nova-q-unidade:${x.u.id}">${I.plus}Nova questão nesta unidade</button></div>
  </div></div>`;
}

        ${D.missoes.map(m => `<tr><td>${toggle(m.ativa, 'toggle-missao:' + m.id, 'Missão ativa')}</td><td><input class="inline-edit" style="min-width:220px" value="${esc(m.texto)}" data-f="missao.${m.id}.texto" aria-label="Texto da missão"></td>
          <td><select class="inp sm" data-f="missao.${m.id}.tipo" aria-label="Tipo">${Object.entries(TIPOS_MISSAO).map(([k, v]) => `<option value="${k}" ${m.tipo === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
          <td><input type="number" min="1" class="inp sm" style="width:70px" value="${m.meta}" data-f="missao.${m.id}.meta" aria-label="Meta"></td>

      </tbody></table></div>
      <div class="card-b" style="padding-top:0;font-size:12px;color:var(--muted)">Toda missão concluída conta para o baú do dia. Quando o aluno completa as ${P.porDia} sorteadas, ganha ${P.moedasBauDiario} moedas.</div></div>
    <div class="grid2">
      <div class="card"><div class="card-h"><h2>Desafio do mês</h2><span class="right">${toggle(P.mensal.ativo, 'toggle-param:missoes:mensal.ativo', 'Desafio do mês ativo')}</span></div><div class="card-b form">
        <div class="field"><label for="mo-t">Título</label><input id="mo-t" class="inp" value="${esc(P.mensal.titulo)}" data-f="param.missoes.mensal.titulo"></div>
        <div class="frow">${numField('Meta de XP no mês', 'param.missoes.mensal.metaXp', P.mensal.metaXp)}${numField('Moedas ao concluir', 'param.missoes.mensal.moedas', P.mensal.moedas)}<div class="field"><label for="mo-b">Nome do distintivo</label><input id="mo-b" class="inp" value="${esc(P.mensal.distintivo)}" data-f="param.missoes.mensal.distintivo"></div></div>
      </div></div>
      <div class="card"><div class="card-h"><h2>Revisão diária</h2><span class="right">${toggle(P.revisao.ativo, 'toggle-param:missoes:revisao.ativo', 'Revisão diária ativa')}</span></div><div class="card-b form">
        <div class="frow">${numField('Exercícios por revisão', 'param.missoes.revisao.tamanho', P.revisao.tamanho)}${numField('XP ao concluir', 'param.missoes.revisao.xp', P.revisao.xp)}</div>
        <p style="margin:0;font-size:12px;color:var(--muted)">Mistura questões publicadas de todas as matérias ativas, priorizando erros recentes do aluno.</p>
      </div></div>
      <div class="card"><div class="card-h"><h2>Missão em dupla</h2><span class="right"><span class="pill off">depois do lançamento</span>${toggle(P.dupla.ativo, 'toggle-param:missoes:dupla.ativo', 'Missão em dupla ativa')}</span></div><div class="card-b form">
        <div class="frow">${numField('Lições em dupla', 'param.missoes.dupla.licoes', P.dupla.licoes)}${numField('Prazo (dias)', 'param.missoes.dupla.dias', P.dupla.dias)}${numField('Moedas para cada', 'param.missoes.dupla.moedas', P.dupla.moedas)}</div>

function setCampo(path, value) {
  const p = path.split('.');
  switch (p[0]) {
    case 'qf': V.qf[p[1]] = value; if (p[1] === 'materia') V.qf.unidade = ''; return 'ui';
    case 'atribuirBusca': V.atribuirBusca = value; return 'ui';
    case 'alunos': V.alunos.busca = value; return 'nada';
    case 'notaPub': V.notaPub = value; return 'nada';
    case 'rascunho': setIn(V.rascunho, p.slice(1), value); return 'rascunho';
    case 'materia': { const m = materiaPorId(V.materia); if (!m) return 'nada'; m[p[1]] = value; agendar(path, () => db(sb.from('materias').update({[p[1]]: value}).eq('id', m.id))); return 'dados'; }
    case 'secao': case 'unidade': case 'licao': {
      const tabela = {secao: 'secoes', unidade: 'unidades', licao: 'licoes'}[p[0]]; const r = D[tabela].find(x => x.id === p[1]); if (!r) return 'nada';
      r[p[2]] = value; agendar(path, () => db(sb.from(tabela).update({[p[2]]: value}).eq('id', p[1]))); return 'dados';
    }
    case 'missao': { const r = D.missoes.find(x => x.id === p[1]); if (!r) return 'nada'; const v = p[2] === 'meta' ? Math.max(1, +value || 1) : value; r[p[2]] = v; agendar(path, () => db(sb.from('missoes').update({[p[2]]: v}).eq('id', r.id))); return 'dados'; }
    case 'loja': { const r = D.loja.find(x => x.id === p[1]); if (!r) return 'nada'; const v = p[2] === 'preco' ? Math.max(0, +value || 0) : value; r[p[2]] = v; agendar(path, () => db(sb.from('itens_loja').update({[p[2]]: v}).eq('id', r.id))); return 'dados'; }
    case 'param': { const g = p[1]; setIn(D.param[g], p.slice(2), value); agendar('param.' + g, () => salvarParam(g)); return 'dados'; }
  }
  return 'nada';
}

   ===================================================================== */
function reduzirImagem(file) {
  return new Promise(resolve => {
    if (file.type === 'image/gif' || file.size < 400 * 1024) return resolve(file);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = file.type === 'image/png';
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b ? new File([b], file.name, {type: png ? 'image/png' : 'image/jpeg'}) : file); }, png ? 'image/png' : 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function enviarImagem(file) {
  if (!V.rascunho) return;
  if (file.size > 3 * 1024 * 1024) return toast('Imagem acima de 3 MB. Reduza antes de enviar.');
  V.rascunho.enviando = true; render();
  try {
    const f = await reduzirImagem(file);
    const ext = f.type === 'image/png' ? 'png' : f.type === 'image/webp' ? 'webp' : f.type === 'image/gif' ? 'gif' : 'jpg';
    const caminho = `questoes/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const {error} = await sb.storage.from('imagens').upload(caminho, f, {contentType: f.type, cacheControl: '31536000', upsert: false});
    if (error) throw error;
    const {data} = sb.storage.from('imagens').getPublicUrl(caminho);
    V.rascunho.imagem_url = data.publicUrl; toast('Imagem enviada.');
  } catch (e) { toast('Erro ao enviar imagem: ' + traduzErro(e.message)); }
  V.rascunho.enviando = false; render();
}
shell.addEventListener('change', ev => { if (ev.target.id === 'f-img' && ev.target.files && ev.target.files[0]) enviarImagem(ev.target.files[0]); });

async function importarSeed() {
  const S = window.FJ_SEED; if (!S) return toast('Arquivo seed.js não carregou.');
  if (D.materias.length) return toast('O banco já tem matérias. A importação só funciona com o banco vazio.');
  toast('Importando… isso leva alguns segundos.');
  const chaves = {};
  await db(sb.from('materias').insert(S.materias.map(({id, nome, sigla, cor, ativa, ordem}) => ({id, nome, sigla, cor, ativa, ordem}))));
  const unidadesCriadas = [];
  for (const m of S.materias) for (const [si, sec] of m.secoes.entries()) {
    const s = await db(sb.from('secoes').insert({materia_id: m.id, titulo: sec.titulo, ordem: si}).select().single());
    for (const [ui, un] of sec.unidades.entries()) {
      const u = await db(sb.from('unidades').insert({secao_id: s.id, titulo: un.titulo, ordem: ui}).select().single());
      if (un.chave) chaves[un.chave] = u.id;
      let licoes = [];
      if (un.licoes.length) licoes = ordenar(await db(sb.from('licoes').insert(un.licoes.map((t, i) => ({unidade_id: u.id, titulo: t, ordem: i}))).select()));
      unidadesCriadas.push({id: u.id, licoes});
    }
  }
  const qs = await db(sb.from('questoes').insert(S.questoes.map(q => ({materia_id: q.materia, unidade_id: chaves[q.unidade] || null, tipo: q.tipo, enunciado: q.enunciado, dados: q.dados, explicacao: q.explicacao, status: q.status || 'publicada'}))).select());
  const lq = [];
  for (const un of unidadesCriadas) {
    const pool = qs.filter(q => q.unidade_id === un.id && q.status === 'publicada');
    if (!pool.length || !un.licoes.length) continue;
    un.licoes.forEach((l, i) => {
      const minhas = pool.length <= 8 ? pool : pool.filter((_, k) => k % un.licoes.length === i);
      minhas.forEach((q, j) => lq.push({licao_id: l.id, questao_id: q.id, ordem: j}));
    });
  }
  if (lq.length) await db(sb.from('licao_questoes').insert(lq));
  await carregar(); toast('Conteúdo inicial importado.'); render();
}

async function moverItem(tabela, id, dir) {
  const arr = D[tabela]; const r = arr.find(x => x.id === id); if (!r) return;
  const pai = {secoes: 'materia_id', unidades: 'secao_id', licoes: 'unidade_id'}[tabela];
  const irmaos = arr.filter(x => !pai || x[pai] === r[pai]);
  const i = irmaos.indexOf(r), j = i + dir; if (j < 0 || j >= irmaos.length) return;
  const antes = new Map(irmaos.map(x => [x.id, x.ordem]));
  irmaos.forEach((x, k) => { x.ordem = k; }); r.ordem = j; irmaos[j].ordem = i;
  ordenar(arr); render();
  const nome = tabela === 'loja' ? 'itens_loja' : tabela;
  const mudados = irmaos.filter(x => antes.get(x.id) !== x.ordem);
  await Promise.all(mudados.map(x => db(sb.from(nome).update({ordem: x.ordem}).eq('id', x.id))));
}
function confirmar(titulo, corpo, fn, sim) { V.confirmar = {titulo, corpo, fn, sim}; render(); }
async function act(a, el) {
  const [k, x, y, z] = a.split(':');
  const M = materiaPorId(V.materia);
  switch (k) {
    case 'view': V.view = x; V.rascunho = null; V.licaoAtribuir = null; V.jsonVersao = null; window.scrollTo(0, 0); render(); if (x === 'alunos' && !V.alunos.lista) buscarAlunos(); if (x === 'inicio') carregarMetricas(); return;
    case 'sair': return sb.auth.signOut();
    case 'importar-seed': return importarSeed();

    /* questões */
    case 'nova-q': { if (!D.materias.length) return toast('Crie uma matéria primeiro.'); const u = todasUnidades().find(t => t.m.id === (V.qf.materia || D.materias[0].id)) || todasUnidades()[0]; V.rascunho = novoRascunho('mc', u ? u.m.id : D.materias[0].id, u ? u.u.id : null); return render(); }
    case 'nova-q-unidade': { const u = unidadeInfo(x); V.licaoAtribuir = null; V.rascunho = novoRascunho('mc', u ? u.m.id : null, x); return render(); }
    case 'editar-q': { const q = D.questoes.find(q => q.id === x); if (q) V.rascunho = rascunhoDe(q); return render(); }
    case 'rascunho-tipo': { const d = V.rascunho; d.tipo = x; if (x === 'tf') d.a = !!d.a; else if (typeof d.a === 'boolean') d.a = 0; return render(); }
    case 'rascunho-mais-item': V.rascunho.items.push(''); return render();
    case 'trocar-imagem': { const inp = document.getElementById('f-img'); if (inp) inp.click(); return; }
    case 'remover-imagem': V.rascunho.imagem_url = null; return render();
    case 'salvar-q': {
      const d = V.rascunho; if (x === 'publicada' && validar(d).length) return;
      if (!d.unidade_id) return toast('Escolha uma unidade (a matéria precisa ter unidades).');
      const linha = rascunhoParaLinha(d, x);
      if (d.id) {
        const row = await db(sb.from('questoes').update(linha).eq('id', d.id).select().single());
        const i = D.questoes.findIndex(q => q.id === d.id); if (i >= 0) D.questoes[i] = row;
      } else {
        const row = await db(sb.from('questoes').insert(linha).select().single());
        D.questoes.unshift(row);
        if (row.status === 'publicada') {
          const l = licoesDe(row.unidade_id).find(l => questoesDaLicao(l.id).length < tamLicao());
          if (l) { const lq = {licao_id: l.id, questao_id: row.id, ordem: questoesDaLicao(l.id).length}; await db(sb.from('licao_questoes').insert(lq)); D.licaoQuestoes.push(lq); }
        }
      }
      V.rascunho = null; toast(x === 'publicada' ? 'Questão salva. Lembre de Publicar para chegar ao app.' : 'Rascunho salvo.'); return render();
    }
    case 'excluir-q': return confirmar('Excluir questão?', 'Ela sai de todas as lições em que está e dos erros dos alunos. Não dá para desfazer.', async () => {
      const id = V.rascunho.id; await db(sb.from('questoes').delete().eq('id', id));
      D.questoes = D.questoes.filter(q => q.id !== id); D.licaoQuestoes = D.licaoQuestoes.filter(q => q.questao_id !== id); V.rascunho = null; toast('Questão excluída.');
    });
    case 'fechar': V.rascunho = null; V.licaoAtribuir = null; return render();
    case 'atribuir': V.licaoAtribuir = x; V.rascunho = null; V.atribuirBusca = ''; return render();
    case 'atribuir-toggle': {
      const lid = V.licaoAtribuir;
      if (el.checked) { const lq = {licao_id: lid, questao_id: x, ordem: questoesDaLicao(lid).length}; D.licaoQuestoes.push(lq); render(); await db(sb.from('licao_questoes').insert(lq)); }
      else { D.licaoQuestoes = D.licaoQuestoes.filter(q => !(q.licao_id === lid && q.questao_id === x)); render(); await db(sb.from('licao_questoes').delete().eq('licao_id', lid).eq('questao_id', x)); }
      return;
    }

    /* trilhas */
    case 'trilha': V.materia = x; return render();
    case 'toggle-materia': if (!M) return; M.ativa = !M.ativa; render(); return db(sb.from('materias').update({ativa: M.ativa}).eq('id', M.id));
    case 'nova-materia': V.modal = {titulo: 'Nova matéria', campos: [{k: 'nome', label: 'Nome', placeholder: 'Ex.: História', obrigatorio: true}, {k: 'sigla', label: 'Sigla (2 letras)', placeholder: 'HI', maxlength: 2, obrigatorio: true}, {k: 'cor', label: 'Cor', tipo: 'color', valor: '#503C9D'}], ok: 'Criar', fn: async v => {
      let id = slug(v.nome).slice(0, 3) || 'mat'; let n = 1; const base = id; while (materiaPorId(id)) id = base + (++n);
      const row = await db(sb.from('materias').insert({id, nome: v.nome.trim(), sigla: v.sigla.trim().toUpperCase(), cor: v.cor, ativa: false, ordem: proximaOrdem(D.materias)}).select().single());
      D.materias.push(row); V.materia = row.id; V.view = 'trilhas';
      const sec = await db(sb.from('secoes').insert({materia_id: row.id, titulo: 'Seção 1', ordem: 0}).select().single()); D.secoes.push(sec);
      toast('Matéria criada (invisível no app até você ativar).');
    }}; return render();
    case 'excluir-materia': if (!M) return; return confirmar(`Excluir ${M.nome}?`, 'As seções, unidades, lições e questões desta matéria também serão excluídas.', async () => {
      await db(sb.from('materias').delete().eq('id', M.id)); await carregar(); toast('Matéria excluída.');
    });
    case 'nova-secao': { if (!M) return; const row = await db(sb.from('secoes').insert({materia_id: M.id, titulo: 'Nova seção', ordem: proximaOrdem(secoesDe(M.id))}).select().single()); D.secoes.push(row); return render(); }
    case 'excluir-secao': return confirmar('Excluir seção?', 'As unidades e lições dentro dela também somem. As questões ficam no banco sem unidade.', async () => { await db(sb.from('secoes').delete().eq('id', x)); await carregar(); });
    case 'nova-unidade': { const row = await db(sb.from('unidades').insert({secao_id: x, titulo: 'Nova unidade', ordem: proximaOrdem(unidadesDe(x))}).select().single()); D.unidades.push(row); const l = await db(sb.from('licoes').insert({unidade_id: row.id, titulo: 'Lição 1', ordem: 0}).select().single()); D.licoes.push(l); return render(); }
    case 'excluir-unidade': return confirmar('Excluir unidade?', 'As lições somem; as questões ficam no banco sem unidade.', async () => { await db(sb.from('unidades').delete().eq('id', x)); await carregar(); });
    case 'nova-licao': { const row = await db(sb.from('licoes').insert({unidade_id: x, titulo: 'Lição ' + (licoesDe(x).length + 1), ordem: proximaOrdem(licoesDe(x))}).select().single()); D.licoes.push(row); return render(); }
    case 'excluir-licao': return confirmar('Excluir lição?', 'O progresso dos alunos nesta lição também é apagado.', async () => { await db(sb.from('licoes').delete().eq('id', x)); D.licoes = D.licoes.filter(l => l.id !== x); D.licaoQuestoes = D.licaoQuestoes.filter(q => q.licao_id !== x); });
    case 'mover': return moverItem(x, y, +z);

    /* missões */
    case 'nova-missao': { const row = await db(sb.from('missoes').insert({texto: 'Nova missão', tipo: 'xp', meta: 20, ativa: false, ordem: proximaOrdem(D.missoes)}).select().single()); D.missoes.push(row); return render(); }
    case 'toggle-missao': { const m = D.missoes.find(m => m.id === x); m.ativa = !m.ativa; render(); return db(sb.from('missoes').update({ativa: m.ativa}).eq('id', m.id)); }
    case 'excluir-missao': return confirmar('Excluir missão?', 'Ela deixa de ser sorteada a partir de amanhã.', async () => { await db(sb.from('missoes').delete().eq('id', x)); D.missoes = D.missoes.filter(m => m.id !== x); });
    case 'toggle-param': { const p = y.split('.'); let o = D.param[x]; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = !o[p[p.length - 1]]; render(); return salvarParam(x); }

    /* loja */
    case 'novo-item': V.modal = {titulo: 'Novo item da loja', texto: 'O código identifica o item no app. Só <code>congelador</code>, <code>recarga</code> e <code>plus</code> têm efeito hoje; outros códigos precisam de programação.', campos: [{k: 'codigo', label: 'Código (sem espaços)', placeholder: 'ex.: relampago_extra', obrigatorio: true}, {k: 'nome', label: 'Nome que o aluno vê', obrigatorio: true}], ok: 'Criar', fn: async v => {
      const codigo = v.codigo.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'item';
      if (D.loja.some(i => i.codigo === codigo)) return toast('Já existe um item com esse código.');
      const row = await db(sb.from('itens_loja').insert({codigo, nome: v.nome.trim(), tipo: 'moedas', preco: 100, ativo: false, ordem: proximaOrdem(D.loja)}).select().single());
      D.loja.push(row); toast('Item criado (fora da loja até você ativar).');
    }}; return render();
    case 'toggle-item': { const it = D.loja.find(i => i.id === x); it.ativo = !it.ativo; render(); return db(sb.from('itens_loja').update({ativo: it.ativo}).eq('id', it.id)); }
    case 'excluir-item': return confirmar('Excluir item da loja?', 'Se o app usa esse código, a compra deixa de funcionar.', async () => { await db(sb.from('itens_loja').delete().eq('id', x)); D.loja = D.loja.filter(i => i.id !== x); });

    /* alunos */
    case 'buscar-alunos': return buscarAlunos();
    case 'plus': { await db(sb.rpc('ativar_plus', {p_user: x, p_dias: +y})); toast(+y > 0 ? `Findout+ ativado por ${y} dias.` : 'Findout+ removido.'); return buscarAlunos(); }
    case 'admin': {
      const a = (V.alunos.lista || []).find(t => t.user_id === x); const nome = a ? a.nome : 'esta pessoa';
      if (y === '1') return confirmar(`Tornar ${nome} administrador?`, 'Ela poderá editar todo o conteúdo, publicar e gerenciar alunos neste painel.', async () => { await db(sb.rpc('definir_admin', {p_user: x, p_admin: true})); toast('Agora é administrador.'); await buscarAlunos(); }, 'Tornar admin');
      return confirmar(`Tirar o acesso de ${nome}?`, 'Ela continua como aluna no app, mas não entra mais no painel.', async () => { await db(sb.rpc('definir_admin', {p_user: x, p_admin: false})); toast('Acesso ao painel removido.'); await buscarAlunos(); }, 'Tirar acesso');
    }

    /* publicar */
    case 'publicar': return publicar(V.notaPub.trim());
    case 'toggle-autopub': autoPub = !autoPub; try { localStorage.setItem('fj-autopub', autoPub ? '1' : '0'); } catch (e) {} if (autoPub) agendarPublicacao(); return render();
    case 'ver-json': {
      if (x === 'atual') { V.jsonVersao = null; V.jsonTexto = ''; return render(); }
      const row = await db(sb.from('publicacoes').select('pacote').eq('versao', +x).single());
      V.jsonVersao = +x; V.jsonTexto = JSON.stringify(row.pacote, null, 2); return render();
    }
    case 'restaurar': return confirmar(`Voltar à versão ${x}?`, `Uma nova versão igual à v${x} será publicada e o app passa a ler esse conteúdo.`, async () => {
      const row = await db(sb.from('publicacoes').select('pacote').eq('versao', +x).single());
      const pacote = {...row.pacote, geradoEm: agora()};
      const nova = await db(sb.from('publicacoes').insert({pacote, nota: `Restaurada da v${x}`, criada_por: sessao.user.id}).select('versao, nota, criada_em').single());
      D.publicacoes.unshift(nova); D.ultimoPacote = pacote; V.jsonVersao = null; toast(`Versão ${nova.versao} publicada (igual à v${x}).`);
    }, 'Voltar');
    case 'copiar-json': { const t = document.getElementById('jsonout').textContent; (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('JSON copiado.')).catch(() => { const r = document.createRange(); r.selectNodeContents(document.getElementById('jsonout')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecionado: use Ctrl+C para copiar.'); }); return; }

    /* modais */
    case 'modal-cancelar': V.modal = null; return render();
    case 'modal-ok': { const Mo = V.modal; if (!Mo) return; const v = {}; Mo.campos.forEach(c => { v[c.k] = document.getElementById('md-' + c.k).value; }); if (Mo.campos.some(c => c.obrigatorio && !String(v[c.k]).trim())) return toast('Preencha todos os campos.'); V.modal = null; await Mo.fn(v); return render(); }
    case 'confirmar-nao': V.confirmar = null; return render();
    case 'confirmar-sim': { const C = V.confirmar; V.confirmar = null; render(); await C.fn(); return render(); }
  }
}
shell.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled || !D) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { act(el.dataset.a, el).catch(e => console.error(e)); return; }
  if (el.tagName === 'TR' && ev.target.closest('button, input, select, a')) return;
  if (el.tagName === 'FORM' || el.tagName === 'LABEL') return;
  if (el.type === 'submit' && el.dataset.a === 'modal-ok') return;
  act(el.dataset.a, el).catch(e => console.error(e));
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && D && (V.rascunho || V.licaoAtribuir || V.modal || V.confirmar)) { V.rascunho = null; V.licaoAtribuir = null; V.modal = null; V.confirmar = null; render(); } });

/* =====================================================================
   Início
   ===================================================================== */
telaAuth('<div class="msg">Carregando…</div>');
sb.auth.onAuthStateChange((ev, s) => {
  if (ev === 'PASSWORD_RECOVERY') { mostrando = 'recuperar'; telaNovaSenha(); return; }
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(s);
});
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => rota(null));
})();
</script>
</body>
</html>
