<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010F2E">
<!-- Segurança: o painel só carrega script do CDN do Supabase, fontes do Google e fala só com o Supabase; nada de iframes, plugins ou envio para outros domínios -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Painel · Findout Jornada</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='21' font-family='system-ui,sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3EFJ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#F2F7FF;--surface:#FFFFFF;--surface2:#E3EEFF;--line:#D8E4F7;--line2:#B9CBE8;
  --fg:#010F2E;--fg2:#444D69;--muted:#6F7172;
  --primary:#2563EB;--primary-d:#1A47B8;--primary-l:#E3EEFF;--navy:#010F2E;
  --teal:#F7941E;--teal-d:#B85E08;--teal-l:#FFEBD2;--green:#8FB569;--green-d:#2F5A14;--green-l:#EAF3DF;
  --gold:#FFD36A;--gold-d:#8A6207;--gold-l:#FFF8E1;--red:#E0475B;--red-d:#B8313F;--red-l:#FBE4E6;--orange:#F08A24;--orange-d:#C8571D;
  --blue:#4C86E8;--blue-d:#2763CE;--blue-l:#E1EBFC;
  --side:#010F2E;--side-fg:#C5C9E3;--side-active:#2563EB;
  --topbar:rgba(255,255,255,.85);--shadow:rgba(1,15,46,.05);
  --f-display:'Jost',system-ui,sans-serif;--f-body:'Roboto',system-ui,sans-serif;--f-pixel:'Press Start 2P',monospace;
  --radius:14px;
  --sombra:0 1px 2px var(--shadow),0 10px 28px -10px var(--shadow);
  --sombra-up:0 4px 10px var(--shadow),0 18px 40px -12px var(--shadow);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1026;--surface:#151B3B;--surface2:#1E2549;--line:#272F58;--line2:#3B4474;
    --fg:#EDEFFC;--fg2:#BCC3E0;--muted:#8E95B8;
    --primary:#7FA8F7;--primary-d:#9FBDF9;--primary-l:rgba(127,168,247,.16);
    --teal-d:#FFB873;--teal-l:rgba(247,148,30,.14);--green-d:#B5D694;--green-l:rgba(143,181,105,.16);
    --gold-d:#FFDF96;--gold-l:rgba(255,211,106,.13);--red-d:#F2899A;--red-l:rgba(224,71,91,.15);--orange-d:#F7B370;
    --blue-d:#8FB7F5;--blue-l:rgba(76,134,232,.16);
    --side-fg:#9FA6CB;--topbar:rgba(11,16,38,.82);--shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1026;--surface:#151B3B;--surface2:#1E2549;--line:#272F58;--line2:#3B4474;
  --fg:#EDEFFC;--fg2:#BCC3E0;--muted:#8E95B8;
  --primary:#7FA8F7;--primary-d:#9FBDF9;--primary-l:rgba(127,168,247,.16);
  --teal-d:#FFB873;--teal-l:rgba(247,148,30,.14);--green-d:#B5D694;--green-l:rgba(143,181,105,.16);
  --gold-d:#FFDF96;--gold-l:rgba(255,211,106,.13);--red-d:#F2899A;--red-l:rgba(224,71,91,.15);--orange-d:#F7B370;
  --blue-d:#8FB7F5;--blue-l:rgba(76,134,232,.16);
  --side-fg:#9FA6CB;--topbar:rgba(11,16,38,.82);--shadow:rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.55}
a{color:var(--primary)}
code{font-size:12px;background:var(--surface2);padding:2px 5px;border-radius:5px}
:focus-visible{outline:3px solid var(--teal-d);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:600}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.px{font-family:var(--f-pixel);font-size:8px;letter-spacing:.02em}
[hidden]{display:none!important}

#shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
#shell.auth{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{width:100%;max-width:400px;padding:28px;display:flex;flex-direction:column;gap:16px}
.login .brand{color:var(--fg);padding:0 0 4px}
.login .brand small{color:var(--muted)}
.login h1{font-size:22px}
/* Barra lateral em três faixas: topo e rodapé fixos, só a navegação rola */
aside{background:linear-gradient(180deg,#070C22 0%,var(--side) 40%,#1A1F4B 100%);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid rgba(255,255,255,.05);overflow:hidden}
.sidehead{display:flex;align-items:center;gap:8px;padding:18px 16px 12px;flex-shrink:0}
.sidenav{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:3px;padding:0 10px 10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.sidenav::-webkit-scrollbar{width:6px}
.sidenav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border:0;border-radius:6px}
.sidenav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.32)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.brand>div{min-width:0}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--side-fg)}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--side-fg);width:100%;text-align:left;font-weight:500;font-size:13.5px;flex-shrink:0;transition:background-color .15s,color .15s,transform .12s,box-shadow .18s}
.navbtn svg{flex-shrink:0}
.navbtn:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
.navbtn[aria-current="page"]{background:linear-gradient(135deg,#4A7FF0,var(--side-active));color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.45),inset 0 1px 0 rgba(255,255,255,.14)}
.navbtn .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:10px}
.sidefoot{flex-shrink:0;font-size:12px;color:var(--side-fg);padding:12px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1);background:rgba(3,8,26,.42);display:flex;flex-direction:column;gap:9px}
.sidestat{display:flex;flex-direction:column;gap:5px;font-size:11px;padding:0 3px}
.sidestat>span{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.sidestat b{color:#fff}
.sideacts{display:flex;gap:6px}
.sideact{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.07);color:var(--side-fg);font-weight:600;font-size:12px;transition:background-color .15s,color .15s,border-color .15s}
.sideact:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)}
.sideact svg{width:15px;height:15px}
.navsec{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(197,201,227,.55);padding:12px 12px 6px;margin:6px 2px 0;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.who{display:flex;gap:9px;align-items:center;min-width:0;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.06)}
/* Celular: cabeçalho fixo com o botão do menu e a lateral virando gaveta */
.mobbar{display:none;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;background:linear-gradient(135deg,#070C22,var(--side));color:#fff;border-bottom:1px solid rgba(255,255,255,.08);z-index:16}
.mobico{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;transition:background-color .15s}
.mobico:hover{background:rgba(255,255,255,.18)}
.sideclose,.sideback{display:none}
.who-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,var(--teal),#2E9B99);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--f-display);flex-shrink:0}
.who-info{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.who-info b{color:#fff;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.abas{display:flex;gap:6px;flex-wrap:wrap}
.aba{height:32px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--fg2);display:inline-flex;align-items:center;gap:6px;transition:background-color .15s,border-color .15s,color .15s,box-shadow .18s,transform .12s}
.aba:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.aba[aria-current="true"]{background:linear-gradient(135deg,#4A7FF0,var(--primary));border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.aba[aria-current="true"]:hover{color:#fff}
.aba .cnt{font-size:11px;background:var(--surface2);color:var(--fg2);padding:1px 7px;border-radius:10px}
.aba[aria-current="true"] .cnt{background:rgba(255,255,255,.2);color:#fff}
.tree-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 16px}
.tree-h .seta{transition:transform .15s;color:var(--muted);flex-shrink:0}
.tree-h[aria-expanded="true"] .seta{transform:rotate(90deg)}
.tree-b{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.tree-t{border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.tree-t>.tree-h{padding:10px 12px}
.tree-t>.tree-b{padding:0 12px 12px}
.checkgroup{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.chk{display:flex;gap:9px;align-items:center;font-size:13px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--primary);flex-shrink:0}
.dinwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:18px;align-items:start}
.dinopts{display:flex;flex-direction:column;gap:8px}
.dinopt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.dinopt .lt{width:30px;height:30px;border-radius:9px;background:var(--primary-l);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.dinopt.ok{border-color:var(--green-d);background:rgba(85,170,110,.1);font-weight:600}
.dinopt.ok .lt{background:var(--green-d);color:#fff}
.dinopt.fraca{opacity:.5}
.dinlac{padding:2px 10px;border-bottom:2.5px solid var(--primary);margin:0 4px;white-space:nowrap}
.dinlac.ok{color:var(--green-d);border-color:var(--green-d)}
.dintimer{font-size:26px;font-weight:700;color:var(--primary);margin-left:auto}
.dintimer.urgente{color:var(--red-d)}
.dintimer.esgotado{font-size:14px;color:var(--red-d)}
.dingrp{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.dinenun{font-size:24px;line-height:1.4;margin:0}
/* Entrada suave ao trocar de tela (só no render da troca, não a cada tecla) */
@keyframes fjView{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.view-anim .topbar{animation:fjView .22s ease both}
main.view-anim .content{animation:fjView .3s ease both}
@keyframes fjBarra{from{width:0}}
.bar i{animation:fjBarra .7s cubic-bezier(.2,.7,.3,1)}
.topbar h1{color:var(--fg)}
.tbl-wrap tbody tr:nth-child(even) td{background:rgba(127,127,190,.05)}
/* Acentos coloridos dos cartões do dashboard */
.tile.tcor::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--cor-t,var(--primary));opacity:.9}
.tile.tcor .val{color:var(--cor-v,var(--fg))}
.t-roxo{--cor-t:linear-gradient(90deg,var(--primary),#8E7FCF);--cor-v:var(--primary)}
.t-teal{--cor-t:var(--teal);--cor-v:var(--teal-d)}
.t-verde{--cor-t:var(--green);--cor-v:var(--green-d)}
.t-ouro{--cor-t:var(--gold);--cor-v:var(--gold-d)}
.t-rosa{--cor-t:var(--red);--cor-v:var(--red-d)}
.t-azul{--cor-t:var(--blue);--cor-v:var(--blue-d)}
.secdash{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:10px;margin:6px 0 -8px}
.secdash::after{content:"";flex:1;height:1px;background:var(--line)}
/* Modo telão: sem menu, tela cheia e letras grandes para projetar no quadro */
#shell.telao{grid-template-columns:1fr}
#shell.telao aside,#shell.telao .mobbar,#shell.telao .sideback{display:none}
#shell.telao main>.topbar{display:none}
#shell.telao .content{padding:30px clamp(28px,3vw,72px);width:100%}
#shell.telao .dinenun{font-size:38px;line-height:1.35}
#shell.telao .dinopt{font-size:26px;padding:16px 20px;border-radius:14px;gap:16px}
#shell.telao .dinopt .lt{width:42px;height:42px;font-size:19px;border-radius:11px}
#shell.telao .dintimer{font-size:48px}
#shell.telao .dinlac{border-bottom-width:3px}
#shell.telao .pill{font-size:13px}
#shell.telao .card-h h2{font-size:19px}
#shell.telao .dingrp b.num{font-size:52px}
#shell.telao .dingrp{padding:20px}
.telao-sair{position:fixed;right:18px;bottom:18px;z-index:60;opacity:.55}
.telao-sair:hover,.telao-sair:focus-visible{opacity:1}
/* Telão com cara de sala de aula: papel de parede de educação, lousa no topo, placar com medalhas e pódio */
.telao main{background:var(--bg) url(fundo.svg) repeat;background-size:320px 320px}
.lousa{position:relative;overflow:hidden;background:#1F4D3A;color:#F4F7F2;border-radius:18px;padding:18px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:inset 0 0 0 6px #8B5A2B,inset 0 0 0 8px #C68642,0 14px 34px rgba(0,0,0,.25);font-family:var(--f-display)}
.lousa::before{content:"";position:absolute;inset:8px;background:url(fundo.svg) repeat;background-size:320px 320px;filter:brightness(0) invert(1);opacity:.35;pointer-events:none}
.lousa>*{position:relative}
.lousa .tit{font-size:28px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.lousa .sub{font-size:15px;opacity:.85;display:flex;align-items:center;gap:8px}
.lousa .passos{margin-left:auto;display:flex;gap:6px;align-items:center}
.lousa .passos i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:inline-block}
.lousa .passos i.ok{background:#FFD36A;border-color:#FFD36A}
.lousa .passos i.cur{background:#fff;border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.dinrank{display:grid;grid-template-columns:44px 40px 1fr auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;transition:background-color .2s}
.dinrank.top{background:linear-gradient(90deg,rgba(255,211,106,.22),transparent)}
.dinrank.eu{outline:2px solid var(--primary-l)}
.dinrank .pos{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.dinrank .av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,#5B7CFF,#2D4FD6);box-shadow:0 4px 10px rgba(45,79,214,.25)}
.dinrank.top .av{background:linear-gradient(135deg,#FFD36A,#E8A33D);color:#5A3F03}
.dinrank .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.dinrank .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dinrank .bar{height:8px}
.dinrank .pts{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg)}
.dinrank .pts svg{color:var(--green-d)}
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;padding:10px 6px 0;max-width:760px;margin-inline:auto}
.podio .col{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.podio .col b{font-family:var(--f-display);font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podio .bloco{width:100%;border-radius:12px 12px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:22px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.podio .p1 .bloco{height:118px;background:linear-gradient(180deg,#FFD36A,#E8A33D);color:#5A3F03}
.podio .p2 .bloco{height:88px;background:linear-gradient(180deg,#C9D1E3,#8E9AB8);color:#1F2740}
.podio .p3 .bloco{height:66px;background:linear-gradient(180deg,#D9A46F,#B9773B);color:#3E2410}
.podio .av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#5B7CFF,#2D4FD6)}
@keyframes podio-sobe{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.podio .col{animation:podio-sobe .5s cubic-bezier(.2,.8,.2,1) both}.podio .p2{animation-delay:.1s}.podio .p1{animation-delay:.25s}.podio .p3{animation-delay:.4s}
.telao .dinrank{grid-template-columns:56px 52px 1fr auto;padding:10px 12px}
.telao .dinrank .bar{height:14px}
.telao .dinrank .nm b{font-size:22px}.telao .dinrank .pts{font-size:24px}.telao .dinrank .av{width:52px;height:52px;font-size:18px}
.telao .podio .col b{font-size:20px}.telao .podio .bloco{font-size:30px}.telao .podio .p1 .bloco{height:160px}.telao .podio .p2 .bloco{height:120px}.telao .podio .p3 .bloco{height:90px}
.telao .lousa .tit{font-size:36px}.telao .lousa .sub{font-size:18px}
.dinpill{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:reduce){.podio .col{animation:none}}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px clamp(24px,2.2vw,52px);border-bottom:1px solid var(--line);background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
body{background-image:radial-gradient(700px 300px at 70% -80px,rgba(142,127,207,.16),transparent 70%),radial-gradient(640px 320px at -8% 108%,rgba(76,195,193,.10),transparent 70%);background-attachment:fixed}
html{scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
::-webkit-scrollbar-track{background:transparent}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

          licoes: licoesDe(u.id).map(l => ({id: l.id, titulo: l.titulo, descricao: l.descricao || '', questoes: questoesDaLicao(l.id).filter(id => ids.has(id))}))}))}))})),
    questoes: pub.map(q => ({id: q.id, materia: q.materia_id, unidade: q.unidade_id, tipo: q.tipo, enunciado: q.enunciado, imagem: q.imagem_url || null, dados: q.dados, explicacao: q.explicacao})),
    missoes: {diarias: D.missoes.filter(x => x.ativa).map(x => ({id: x.id, texto: x.texto, tipo: x.tipo, meta: x.meta})), ...D.param.missoes},
    economia: D.param.economia,

  };
}
function licoesDoPacote(pkg) {

  (pkg.materias || []).forEach(m => (m.secoes || []).forEach(sec => (sec.unidades || []).forEach(u => (u.licoes || []).forEach(l => ids.add(l.id)))));
  return ids;
}
/* Resumo do que esta publicacao muda para o aluno, comparando o pacote novo com o ultimo publicado */
function resumoPublicacao() {
  const novo = montarPacote(), velho = D.ultimoPacote;
  const alunos = V.metricas && typeof V.metricas.alunos === 'number' ? V.metricas.alunos + (V.metricas.alunos === 1 ? ' aluno' : ' alunos') : 'todos os alunos';
  if (!velho) return novo.questoes.length + ' questões e ' + licoesDoPacote(novo).size + ' lições vão para o app. É a primeira publicação.';
  const dif = (a, b) => { let mais = 0, menos = 0; a.forEach(x => { if (!b.has(x)) mais++; }); b.forEach(x => { if (!a.has(x)) menos++; }); return [mais, menos]; };
  const ids = (arr, k) => new Set((arr || []).map(x => k ? x[k] : x.id));
  const partes = [];
  const linha = ([mais, menos], um, muitos) => { if (mais) partes.push('+' + mais + ' ' + (mais === 1 ? um : muitos)); if (menos) partes.push('−' + menos + ' ' + (menos === 1 ? um : muitos)); };
  linha(dif(ids(novo.materias), ids(velho.materias)), 'matéria', 'matérias');
  linha(dif(licoesDoPacote(novo), licoesDoPacote(velho)), 'lição', 'lições');
  linha(dif(ids(novo.questoes), ids(velho.questoes)), 'questão', 'questões');
  const o = partes.length ? partes.join(' · ') : 'Nada entrou nem saiu: mudou o conteúdo de itens que já estavam no ar';
  return o + '. Vai para ' + alunos + ' na próxima abertura do app.';
}
function alteracoesPendentes() {
  if (!D) return false;
  if (!D.ultimoPacote) return D.materias.length > 0;
  const limpo = p => { const {geradoEm, versao, ...resto} = p; return resto; };
  return canon(limpo(montarPacote())) !== canon(limpo(D.ultimoPacote));
}

const REFERENCIAIS = {bncc: 'BNCC', enem: 'ENEM', propria: 'Própria'};

/* Sincroniza os vínculos questão↔habilidades a partir do campo de códigos do editor */
async function salvarHabilidadesQuestao(qid, texto) {
  const ids = [], naoAchadas = [];
  String(texto || '').split(/[,;]/).map(s => s.trim()).filter(Boolean).forEach(c => {
    const h = habPorCodigo(c); if (h) { if (!ids.includes(h.id)) ids.push(h.id); } else naoAchadas.push(c);
  });
  const atuais = D.qhab.filter(l => l.questao_id === qid).map(l => l.habilidade_id);
  const tirar = atuais.filter(id => !ids.includes(id)), por = ids.filter(id => !atuais.includes(id));
  if (tirar.length) { await db(sb.from('questao_habilidades').delete().eq('questao_id', qid).in('habilidade_id', tirar)); D.qhab = D.qhab.filter(l => !(l.questao_id === qid && tirar.includes(l.habilidade_id))); }
  if (por.length) { const rows = por.map(h => ({questao_id: qid, habilidade_id: h})); await db(sb.from('questao_habilidades').insert(rows)); D.qhab.push(...rows); }
  if (naoAchadas.length) toast('Habilidade(s) não cadastrada(s), ignoradas: ' + naoAchadas.join(', ') + '. Cadastre na aba Habilidades.');
}

async function carregarDashboard() {
  const Dh = V.dash; if (Dh.carregando) return;
  Dh.carregando = true; Dh.erro = null; render();
  const {data, error} = await sb.rpc('dashboard_admin');
  Dh.carregando = false;
  if (error) Dh.erro = traduzErro(error.message); else Dh.data = data;
  render();
  if (!error) animarNumeros();
}
/* Contagem animada dos números dos cartões (uma vez, ao carregar) */
function animarNumeros() {
  shell.querySelectorAll('[data-anim]').forEach(el => {
    const fim = +el.dataset.anim || 0; if (!fim) return;
    const t0 = performance.now(), dur = 650;
    const passo = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(fim * (1 - Math.pow(1 - k, 3))).toLocaleString('pt-BR'); if (k < 1 && el.isConnected) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
}

  if (q.tipo === 'bank') return 'Lacunas: ' + esc((x.a || []).join(', '));
  if (q.tipo === 'order') return esc((x.items || []).join(' → '));

}

function novoRascunho(tipo = 'mc', materia_id = null, unidade_id = null) {
  return {id: null, tipo, materia_id, unidade_id, status: 'rascunho', enunciado: '', explicacao: '', imagem_url: null, fonte: '', dificuldade: 2, assuntos: '', habilidades: '', segmentos: [], destino: 'banco', opts: ['', '', '', ''], a: 0, stmt: '', parts: ['', '', ''], ans: ['', ''], extra: ['', ''], items: ['', '', '', ''], pairs: [['', ''], ['', ''], ['', ''], ['', '']], enviando: false};
}
const listaAssuntos = s => [...new Set(String(s || '').split(/[,;]/).map(a => a.trim().replace(/\s+/g, ' ')).filter(Boolean))];
function rascunhoDe(q) {
  const d = novoRascunho(q.tipo, q.materia_id, q.unidade_id); const x = q.dados || {};
  d.id = q.id; d.status = q.status; d.enunciado = q.enunciado || ''; d.explicacao = q.explicacao || ''; d.imagem_url = q.imagem_url || null; d.fonte = x.fonte || ''; d.dificuldade = x.dificuldade || 2; d.assuntos = (q.assuntos || []).join(', '); d.segmentos = (q.segmentos || []).slice();
  d.habilidades = (D.qhab || []).filter(l => l.questao_id === q.id).map(l => (habPorId(l.habilidade_id) || {}).codigo).filter(Boolean).join(', ');
  const completa = (arr, min, vazio) => { const a = (arr || []).map(v => Array.isArray(v) ? v.slice() : v); while (a.length < min) a.push(Array.isArray(vazio) ? vazio.slice() : vazio); return a; };
  if (q.tipo === 'mc') { d.opts = completa(x.opts, 4, ''); d.a = +x.a || 0; }
  if (q.tipo === 'tf') { d.stmt = x.stmt || ''; d.a = !!x.a; }
  if (q.tipo === 'bank') { d.parts = completa(x.parts, 3, ''); d.ans = completa(x.a, 2, ''); d.extra = completa(x.extra, 2, ''); }
  if (q.tipo === 'order') d.items = completa(x.items, 4, '');
  if (q.tipo === 'match') d.pairs = completa(x.pairs, 4, ['', '']);
  return d;
}
function rascunhoParaLinha(d, status) {
  const t = s => String(s || '').trim();

  if (d.tipo === 'mc') dados = {opts: d.opts.map(t), a: +d.a || 0};
  else if (d.tipo === 'tf') dados = {stmt: t(d.stmt), a: !!d.a};
  else if (d.tipo === 'bank') dados = {parts: d.parts.map(p => String(p || '')), a: d.ans.map(t), extra: d.extra.map(t).filter(Boolean)};
  else if (d.tipo === 'order') dados = {items: d.items.map(t).filter(Boolean)};

  if (t(d.fonte)) dados.fonte = t(d.fonte);
  if (+d.dificuldade) dados.dificuldade = +d.dificuldade;
  return {materia_id: d.materia_id, unidade_id: d.unidade_id || null, tipo: d.tipo, enunciado: t(d.enunciado), explicacao: t(d.explicacao), imagem_url: d.imagem_url || null, dados, status, assuntos: listaAssuntos(d.assuntos), segmentos: (d.segmentos || []).slice(), atualizada_em: agora()};
}
function validar(d) {
  const e = []; const t = s => String(s || '').trim();
  if (!t(d.enunciado)) e.push('Escreva o enunciado.');
  if (!d.materia_id) e.push('Escolha a matéria.');
  if (!d.unidade_id && d.destino !== 'atividade') e.push('Escolha a unidade.');
  if (d.tipo === 'mc' && d.opts.some(o => !t(o))) e.push('Preencha as 4 alternativas.');
  if (d.tipo === 'tf' && !t(d.stmt)) e.push('Escreva a afirmação a ser julgada.');
  if (d.tipo === 'bank' && (d.ans.some(x => !t(x)) || !t(d.parts[0]))) e.push('Preencha o texto e as duas respostas das lacunas.');
  if (d.tipo === 'order' && d.items.filter(x => t(x)).length < 3) e.push('Ordenar precisa de pelo menos 3 itens.');
  if (d.tipo === 'match' && d.pairs.filter(p => t(p[0]) && t(p[1])).length < 3) e.push('Associar precisa de pelo menos 3 pares.');
  if (!t(d.explicacao)) e.push('Escreva a explicação que aparece quando o aluno erra.');
  return e;
}

  return `<div class="phone"><div class="ph"><span>✕</span><span class="pb"><i></i></span><span style="color:#B8313F;font-weight:700;font-family:var(--f-display)">♥ 4</span></div>
    <div class="pm"><span class="tag">${TIPOS[d.tipo].toUpperCase()}</span><span class="q">${esc(d.enunciado) || '<i style="color:#9AA0BC">Enunciado da questão</i>'}</span>${d.imagem_url ? `<img class="qimg" src="${esc(d.imagem_url)}" alt="">` : ''}${corpo}</div>
    <div class="foot"><span style="border:2px solid #C5C9E3;color:#6F7172">Pular</span><span style="background:#2563EB;color:#fff">Verificar</span></div></div>`;
}

async function buscarAlunos() {
  V.alunos.carregando = true; V.alunos.erro = null; V.alunos.sel = {}; render();
  if (V.alunos.busca.trim()) auditar('busca', 'alunos', null, 'Buscou alunos: ' + V.alunos.busca.trim());
  // super: toda a plataforma (alunos_admin). Admin/coordenador da escola: só a escola dele (pessoas_da_escola, migration 0052), com a busca aplicada aqui.
  let data, error;
  if (admin) ({data, error} = await sb.rpc('alunos_admin', {p_busca: V.alunos.busca.trim(), p_limite: 200}));
  else {
    const minhas = minhasEscolas(); const eid = minhas.some(e => e.id === V.alunosFiltro.escola) ? V.alunosFiltro.escola : (minhas[0] || {}).id;
    if (!eid) { data = []; error = null; }
    else {
      const partes = await Promise.all((V.alunosFiltro.escola ? [eid] : minhas.map(e => e.id)).map(id => sb.rpc('pessoas_da_escola', {p_escola: id})));
      error = (partes.find(p => p.error) || {}).error; const vis = {}; partes.forEach(p => (p.data || []).forEach(x => { vis[x.user_id] = x; })); data = Object.values(vis);
      const q = V.alunos.busca.trim().toLowerCase(); if (q) data = data.filter(x => (x.nome || '').toLowerCase().includes(q) || (x.email || '').toLowerCase().includes(q));
    }
  }
  V.alunos.carregando = false;
  if (error) { V.alunos.erro = traduzErro(error.message); V.alunos.lista = []; } else V.alunos.lista = data || [];
  // disciplina dos professores (coluna da migration 0016; se não existir, segue sem)
  const profs = V.alunos.lista.filter(a => a.papel === 'professor').map(a => a.user_id);
  if (profs.length) { const r = await sb.from('perfis').select('user_id,disciplina_id').in('user_id', profs); if (!r.error) (r.data || []).forEach(p => { const a = V.alunos.lista.find(x => x.user_id === p.user_id); if (a) a.disciplina_id = p.disciplina_id; }); }
  render();
}

  const mx = D.param.economia.coracoes;
  V.modal = {titulo: 'Adicionar moedas e corações', texto: `Para <b>${esc(quem)}</b>. Deixe em branco o que não quiser mudar; valores negativos tiram. Corações ficam entre 0 e ${mx}; moedas nunca ficam abaixo de 0.`, ok: 'Aplicar', campos: [

    case 'atribuirBusca': V.atribuirBusca = value; return 'ui';
    case 'ativBusca': V.ativBusca[p[1]] = value; if (p[1] === 'materia') V.ativBusca.unidade = ''; return 'ui';
    case 'aud': V.aud.f[p[1]] = value; return 'nada';
    case 'relf': { const R = V.rel; R.f[p[1]] = value; if (p[1] === 'escola') { R.f.seg = ''; R.f.turma = ''; } if (p[1] === 'seg') R.f.turma = ''; if (p[1] === 'turma' && value) { carregarRelAlunos(value); auditar('relatorio', 'turmas', value, 'Abriu o relatório da turma'); } return 'ui'; }
    case 'ativFiltroTurma': V.ativFiltroTurma = value; return 'ui';

    case 'ativFiltroEscola': V.ativFiltroEscola = value; V.ativFiltroTurma = ''; return 'ui';

    case 'ativ': { if (!V.ativ) return 'nada'; if (p[1] === 'questoes') { const q = V.ativ.questoes[+p[2]]; if (q && p[3] === 'valor') q.valor = Math.max(0, +String(value).replace(',', '.') || 0); return 'nada'; } V.ativ[p[1]] = value; return 'nada'; }
    case 'turma': { const t = turmaPorId(p[1]); if (!t) return 'nada'; const v = p[2] === 'segmento_id' ? (value || null) : value; t[p[2]] = v; agendar(path, () => db(sb.from('turmas').update({[p[2]]: v}).eq('id', t.id))); return 'dados'; }
    case 'segmento': { const s = D.segmentos.find(s => s.id === p[1]); if (!s) return 'nada'; s[p[2]] = value; agendar(path, () => db(sb.from('segmentos').update({[p[2]]: value}).eq('id', s.id))); return 'dados'; }

    case 'secao': case 'unidade': case 'licao': {
      const tabela = {secao: 'secoes', unidade: 'unidades', licao: 'licoes'}[p[0]]; const r = D[tabela].find(x => x.id === p[1]); if (!r) return 'nada';
      r[p[2]] = value; agendar(path, () => db(sb.from(tabela).update({[p[2]]: value}).eq('id', p[1]))); return 'dados';
    }
    case 'missao': { const r = D.missoes.find(x => x.id === p[1]); if (!r) return 'nada'; const v = p[2] === 'meta' ? Math.max(1, +value || 1) : value; r[p[2]] = v; agendar(path, () => db(sb.from('missoes').update({[p[2]]: v}).eq('id', r.id))); return 'dados'; }
    case 'habF': V.habF[p[1]] = value; return 'ui';
    case 'habilidade': { const h = (D.habilidades || []).find(x => x.id === p[1]); if (!h) return 'nada'; const v = p[2] === 'materia_id' ? (value || null) : value; h[p[2]] = v; agendar(path, () => db(sb.from('habilidades').update({[p[2]]: v}).eq('id', h.id))); return 'dados'; }

   Imagens
   ===================================================================== */
function reduzirImagem(file) {
  return new Promise(resolve => {
    if (file.type === 'image/gif' || file.size < 400 * 1024) return resolve(file);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const png = file.type === 'image/png';
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b ? new File([b], file.name, {type: png ? 'image/png' : 'image/jpeg'}) : file); }, png ? 'image/png' : 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
async function enviarImagem(file) {
  if (!V.rascunho) return;
  if (file.size > 3 * 1024 * 1024) return toast('Imagem acima de 3 MB. Reduza antes de enviar.');
  V.rascunho.enviando = true; render();
  try {
    const f = await reduzirImagem(file);
    const ext = f.type === 'image/png' ? 'png' : f.type === 'image/webp' ? 'webp' : f.type === 'image/gif' ? 'gif' : 'jpg';
    const caminho = `questoes/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const {error} = await sb.storage.from('imagens').upload(caminho, f, {contentType: f.type, cacheControl: '31536000', upsert: false});
    if (error) throw error;
    const {data} = sb.storage.from('imagens').getPublicUrl(caminho);
    V.rascunho.imagem_url = data.publicUrl; toast('Imagem enviada.');
  } catch (e) { toast('Erro ao enviar imagem: ' + traduzErro(e.message)); }
  V.rascunho.enviando = false; render();
}

   Importação do conteúdo inicial
   ===================================================================== */
async function importarSeed() {
  const S = window.FJ_SEED; if (!S) return toast('Arquivo seed.js não carregou.');
  if (D.materias.length) return toast('O banco já tem matérias. A importação só funciona com o banco vazio.');
  toast('Importando… isso leva alguns segundos.');
  const chaves = {};
  await db(sb.from('materias').insert(S.materias.map(({id, nome, sigla, cor, ativa, ordem}) => ({id, nome, sigla, cor, ativa, ordem}))));
  const unidadesCriadas = [];
  for (const m of S.materias) for (const [si, sec] of m.secoes.entries()) {
    const s = await db(sb.from('secoes').insert({materia_id: m.id, titulo: sec.titulo, ordem: si}).select().single());
    for (const [ui, un] of sec.unidades.entries()) {
      const u = await db(sb.from('unidades').insert({secao_id: s.id, titulo: un.titulo, ordem: ui}).select().single());
      if (un.chave) chaves[un.chave] = u.id;
      let licoes = [];
      if (un.licoes.length) licoes = ordenar(await db(sb.from('licoes').insert(un.licoes.map((t, i) => ({unidade_id: u.id, titulo: t, ordem: i}))).select()));
      unidadesCriadas.push({id: u.id, licoes});
    }
  }
  const qs = await db(sb.from('questoes').insert(S.questoes.map(q => ({materia_id: q.materia, unidade_id: chaves[q.unidade] || null, tipo: q.tipo, enunciado: q.enunciado, dados: q.dados, explicacao: q.explicacao, status: q.status || 'publicada'}))).select());
  const lq = [];
  for (const un of unidadesCriadas) {
    const pool = qs.filter(q => q.unidade_id === un.id && q.status === 'publicada');
    if (!pool.length || !un.licoes.length) continue;
    un.licoes.forEach((l, i) => {
      const minhas = pool.length <= 8 ? pool : pool.filter((_, k) => k % un.licoes.length === i);
      minhas.forEach((q, j) => lq.push({licao_id: l.id, questao_id: q.id, ordem: j}));
    });
  }
  if (lq.length) await db(sb.from('licao_questoes').insert(lq));
  await carregar(); toast('Conteúdo inicial importado.'); render();
}

async function moverItem(tabela, id, dir) {
  const arr = D[tabela]; const r = arr.find(x => x.id === id); if (!r) return;
  const pai = {secoes: 'materia_id', unidades: 'secao_id', licoes: 'unidade_id'}[tabela];
  const irmaos = arr.filter(x => !pai || x[pai] === r[pai]);
  const i = irmaos.indexOf(r), j = i + dir; if (j < 0 || j >= irmaos.length) return;
  const antes = new Map(irmaos.map(x => [x.id, x.ordem]));
  irmaos.forEach((x, k) => { x.ordem = k; }); r.ordem = j; irmaos[j].ordem = i;
  ordenar(arr); render();
  const nome = tabela === 'loja' ? 'itens_loja' : tabela;
  const mudados = irmaos.filter(x => antes.get(x.id) !== x.ordem);
  await Promise.all(mudados.map(x => db(sb.from(nome).update({ordem: x.ordem}).eq('id', x.id))));
}
function confirmar(titulo, corpo, fn, sim, tom) { V.confirmar = {titulo, corpo, fn, sim, tom}; render(); }
async function carregarAlunosEscola(eid) {

    case 'modal-cancelar': V.modal = null; return render();
    case 'modal-ok': { const Mo = V.modal; if (!Mo) return; const v = {}; Mo.campos.forEach(c => { v[c.k] = c.tipo === 'checks' ? [...shell.querySelectorAll(`#f-modal input[data-md="${c.k}"]:checked`)].map(i => i.value) : document.getElementById('md-' + c.k).value; }); if (Mo.campos.some(c => c.obrigatorio && !String(v[c.k]).trim())) return toast('Preencha todos os campos.'); V.modal = null; await Mo.fn(v); return render(); }
    case 'confirmar-nao': V.confirmar = null; return render();
    case 'confirmar-sim': { const C = V.confirmar; V.confirmar = null; render(); await C.fn(); return render(); }
  }
}
shell.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled || !D) return;
  if (el.tagName === 'SELECT') return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { act(el.dataset.a, el).catch(e => console.error(e)); return; }
  if (el.tagName === 'TR' && ev.target.closest('button, input, select, a')) return;
  if (el.tagName === 'FORM' || el.tagName === 'LABEL') return;
  if (el.type === 'submit' && el.dataset.a === 'modal-ok') return;
  act(el.dataset.a, el).catch(e => console.error(e));
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || !D) return;
  if (V.modal || V.confirmar || V.modalPrev || V.respostas) { V.modal = null; V.confirmar = null; V.modalPrev = null; V.respostas = null; return render(); }
  if (V.rascunho || V.licaoAtribuir) { V.rascunho = null; V.licaoAtribuir = null; return render(); }
  if (V.ativ) { V.ativ = null; return render(); }
  if (V.menu) { V.menu = false; return render(); }
});

/* =====================================================================
   Início
   ===================================================================== */
/* Robustez: erro não tratado vira aviso (não some no console), sem conexão aparece um selo,
   fechar a aba com gravação pendente pede confirmação e 8 h sem mexer encerram a sessão. */
window.addEventListener('unhandledrejection', ev => { const m = ev.reason && (ev.reason.message || ev.reason); if (m && !/AbortError/i.test(String(m))) toast('Erro: ' + traduzErro(String(m))); });
window.addEventListener('error', ev => { if (ev.message) toast('Erro inesperado: ' + ev.message.slice(0, 120)); });
function selosConexao() { let s = document.getElementById('offline'); if (navigator.onLine) { if (s) s.remove(); } else if (!s) { s = document.createElement('div'); s.id = 'offline'; s.className = 'offline'; s.setAttribute('role', 'status'); s.textContent = 'Sem conexão: as alterações não estão sendo salvas'; document.body.appendChild(s); } }
window.addEventListener('online', () => { selosConexao(); toast('Conexão de volta.'); });
window.addEventListener('offline', selosConexao);
window.addEventListener('beforeunload', ev => { if (D && (V.salvando > 0 || V.publicando || alteracoesPendentes())) { ev.preventDefault(); ev.returnValue = ''; } });
const INATIVIDADE_MS = 8 * 3600e3; let ultimoToque = Date.now();
['click', 'keydown', 'pointermove', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { ultimoToque = Date.now(); }, {passive: true}));
setInterval(() => { if (sessao && Date.now() - ultimoToque > INATIVIDADE_MS) { toast('Sessão encerrada por inatividade.'); sb.auth.signOut(); } }, 60e3);

telaAuth('<div class="msg">Carregando…</div>');
sb.auth.onAuthStateChange((ev, s) => {
  if (ev === 'PASSWORD_RECOVERY') { mostrando = 'recuperar'; telaNovaSenha(); return; }
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT' || ev === 'INITIAL_SESSION') rota(s);
});
sb.auth.getSession().then(({data}) => rota(data.session)).catch(() => rota(null));
})();
</script>
